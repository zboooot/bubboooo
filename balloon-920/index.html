<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>气球雨 · 9:20 · v1.8</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        :root {
            --stage-w: 360;
            --stage-h: 800;
            --bg-outer: #0f0f1a;
            --accent: #ff6b9d;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: var(--bg-outer);
            touch-action: none;
            font-family: "ZCOOL KuaiLe", system-ui, sans-serif;
        }

        #viewport {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            background:
                radial-gradient(ellipse 80% 50% at 50% 0%, rgba(255, 107, 157, 0.12), transparent),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(0, 243, 255, 0.08), transparent),
                var(--bg-outer);
        }

        #stage {
            position: relative;
            aspect-ratio: 9 / 20;
            height: 100vh;
            max-height: 100dvh;
            max-width: calc(100dvh * 9 / 20);
            width: min(100vw, calc(100dvh * 9 / 20));
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.06),
                0 24px 80px rgba(0, 0, 0, 0.55);
            border-radius: clamp(12px, 2vw, 20px);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 14px 16px 36px;
            text-align: center;
            pointer-events: none;
            background: linear-gradient(
                180deg,
                rgba(8, 8, 18, 0.82) 0%,
                rgba(8, 8, 18, 0.5) 45%,
                rgba(8, 8, 18, 0.12) 78%,
                rgba(8, 8, 18, 0) 100%
            );
        }

        #hud span {
            color: var(--accent);
        }

        #levelHud {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.94);
            letter-spacing: 0.12em;
            margin-bottom: 2px;
            text-shadow: 0 1px 10px rgba(0, 0, 0, 0.55);
        }

        #hudSub {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.72);
            letter-spacing: 0.08em;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
        }

        #comboHud {
            position: absolute;
            top: 78px;
            right: 14px;
            pointer-events: none;
            text-align: right;
            opacity: 0;
            transform: scale(0.6) translateY(8px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        #comboHud.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        #comboHud.combo-pop {
            animation: comboPop 0.42s cubic-bezier(0.22, 1.15, 0.36, 1) forwards;
        }

        @keyframes comboPop {
            0% { transform: scale(0.55) translateY(10px); }
            45% { transform: scale(1.22) translateY(-4px); }
            100% { transform: scale(1) translateY(0); }
        }

        #comboHud .combo-prefix {
            display: block;
            font-size: 11px;
            letter-spacing: 0.2em;
            opacity: 0.75;
            margin-bottom: 2px;
        }

        #comboValue {
            display: block;
            font-size: 36px;
            font-weight: bold;
            line-height: 1;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.55);
        }

        /* 连爆数：白 0–5 / 绿 6–10 / 蓝 11–15 / 紫 16–25 / 橙 ≥26（字号为白档 3 倍） */
        #comboHud[data-tier="0"] #comboValue {
            color: rgba(255, 255, 255, 0.96);
            text-shadow: 0 2px 18px rgba(0, 0, 0, 0.65);
        }
        #comboHud[data-tier="1"] #comboValue {
            color: #4ade80;
            text-shadow: 0 0 18px rgba(74, 222, 128, 0.45);
        }
        #comboHud[data-tier="2"] #comboValue {
            color: #60a5fa;
            text-shadow: 0 0 20px rgba(96, 165, 250, 0.5);
        }
        #comboHud[data-tier="3"] #comboValue {
            color: #c084fc;
            text-shadow: 0 0 24px rgba(192, 132, 252, 0.55);
        }
        #comboHud[data-tier="4"] #comboValue {
            color: #fb923c;
            font-size: 108px;
            text-shadow: 0 0 32px rgba(251, 146, 60, 0.6);
        }
        #comboHud[data-tier="4"] .combo-prefix {
            font-size: 13px;
            opacity: 0.9;
        }
        #comboHud[data-tier="4"].combo-pop {
            animation: comboPopOrange 0.48s cubic-bezier(0.18, 1.2, 0.32, 1) forwards;
        }
        @keyframes comboPopOrange {
            0% { transform: scale(0.4) translateY(14px); }
            40% { transform: scale(1.15) translateY(-6px); }
            100% { transform: scale(1) translateY(0); }
        }

        #versionTag {
            position: absolute;
            bottom: 112px;
            right: 12px;
            pointer-events: none;
            color: rgba(255, 255, 255, 0.28);
            font-size: 11px;
            letter-spacing: 0.06em;
        }

        #startScreen {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(
                180deg,
                rgba(8, 8, 18, 0.94) 0%,
                rgba(12, 12, 24, 0.9) 55%,
                rgba(8, 8, 18, 0.92) 100%
            );
            pointer-events: auto;
        }

        #startScreen.hidden {
            display: none;
        }

        .start-actions {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 14px;
            width: min(232px, 78%);
        }

        .start-btn {
            font-family: "ZCOOL KuaiLe", system-ui, sans-serif;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 0.14em;
            padding: 15px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        .start-btn:active {
            transform: scale(0.97);
        }

        .start-btn-primary {
            color: #fff;
            background: linear-gradient(180deg, #ff6b9d 0%, #d91e48 100%);
            box-shadow: 0 8px 28px rgba(217, 30, 72, 0.35);
        }

        .start-btn-secondary {
            color: rgba(255, 255, 255, 0.92);
            background: rgba(255, 255, 255, 0.12);
        }
    </style>
</head>
<body>
    <div id="viewport">
        <div id="stage">
            <canvas id="physicsCanvas"></canvas>
            <div id="hud">
                <div id="levelHud">第 1 关</div>
                <div id="hudSub">剩余 <span id="ballCount">0</span> 球</div>
            </div>
            <div id="comboHud" data-tier="0" aria-hidden="true">
                <span class="combo-prefix">连锁</span>
                <span id="comboValue">0</span>
            </div>
            <div id="startScreen">
                <div class="start-actions">
                    <button type="button" class="start-btn start-btn-primary" id="btnStartPrimary">开始游戏</button>
                    <button type="button" class="start-btn start-btn-secondary" id="btnStartRestart">重新开始</button>
                </div>
            </div>
            <div id="versionTag"></div>
        </div>
    </div>

<script>
    const APP_VERSION = '1.8';
    const APP_VERSION_DATE = '2026-06-30';

    const LOGICAL_WIDTH = 360;
    const LOGICAL_HEIGHT = 800;

    const canvas = document.getElementById('physicsCanvas');
    const ctx = canvas.getContext('2d');
    const ballCountEl = document.getElementById('ballCount');
    const levelHudEl = document.getElementById('levelHud');
    const comboHudEl = document.getElementById('comboHud');
    const comboValueEl = document.getElementById('comboValue');
    const versionTagEl = document.getElementById('versionTag');
    const startScreenEl = document.getElementById('startScreen');
    const btnStartPrimary = document.getElementById('btnStartPrimary');
    const btnStartRestart = document.getElementById('btnStartRestart');
    if (versionTagEl) versionTagEl.textContent = `v${APP_VERSION}`;

    const SAVE_KEY = 'balloon920_progress_v1';

    canvas.width = LOGICAL_WIDTH;
    canvas.height = LOGICAL_HEIGHT;

    const width = LOGICAL_WIDTH;
    const height = LOGICAL_HEIGHT;

    const gravity = { x: 0, y: 1500 };
    const numSubsteps = 6;
    const pbdIterations = 2;
    const dt = 1 / 60;

    const MIN_BALLOON_RADIUS = 36;
    const MAX_BALLOON_RADIUS = 68;
    const BALLOON_PACK_GAP = 5;
    /**
     * 关卡 1 锚点：后续关卡只在此基础上改 balloonCountFactor 等，气量/大小分布应沿用本配置。
     * - referenceCount：标准场上球数（≈ 蜂窝格 × countMultiplier，首关 factor=1）
     * - airBuckets：分档随机，避免整屏球看起来「差不多大」
     */
    const BASELINE_SPAWN = {
        countMultiplier: 1.3,
        /** 首关（balloonCountFactor≤1）各色气筒固定燃料 */
        levelOnePump: [80, 80],
        airBuckets: [
            { min: 12, max: 28 },
            { min: 29, max: 48 },
            { min: 49, max: 72 },
            { min: 73, max: 99 }
        ]
    };

    let baselineReferenceCount = 0;
    let baselineLevelOneCount = 0;
    const BALLOON_FIELD_PAD_X = 16;
    const BALLOON_FIELD_PAD_TOP = 12;
    const BALLOON_FIELD_PAD_BOTTOM = 8;
    const SMALL_BALLOON_AIR_START = 12;
    const SMALL_BALLOON_AIR_END = 99;
    const SMALL_BALLOON_RADIUS_MUL_AT_MAX_AIR = 0.6;
    const PARTICLES_PER_BALLOON = 20;
    const AIR_CAPACITY = 100;
    const PUMP_AIR_RATE = 164;
    const INFLATE_MAX_SCALE = 1.842;
    const FULL_POP_DELAY = 0.2;
    const CHAIN_POP_INTERVAL = 0.07;
    const CHAIN_PARTICLE_TOUCH = 16;
    const DRAG_MOVE_THRESHOLD = 12;
    const SHAKE_MIN_AIR_DELTA = 0.4;

    const Sfx = (function createSfx() {
        /** 三消式连击音阶：每多一爆明确升一档，跨两个八度 */
        const COMBO_MELODY = [
            392, 440, 523.25, 587.33, 659.25, 783.99, 880, 1046.5,
            1174.66, 1318.51, 1567.98, 1760, 1975.53, 2093, 2349.32, 2637.02
        ];

        let ctx = null;
        let master = null;
        let popBus = null;
        let pumpBed = null;
        let pumpIntensity = 0;
        let pumpStrokePhase = 0;
        let lastChuffPhaseInt = 0;
        let lastDeniedAt = 0;
        let noiseLoopBuffer = null;
        let bgmBus = null;
        let bgmStarted = false;
        let bgmGraphReady = false;
        let bgmEl = null;
        let bgmMediaSource = null;
        let bgmAutoplayAttempts = 0;

        const BGM_SRC = 'assets/bgm.mp3';
        const BGM_LEVEL = 0.26;

        function init() {
            if (ctx) return;
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            ctx = new AC();
            master = ctx.createGain();
            master.gain.value = 1;
            master.connect(ctx.destination);

            popBus = ctx.createGain();
            popBus.gain.value = 1.15;
            popBus.connect(master);

            const bufferSize = 2 * ctx.sampleRate;
            noiseLoopBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = noiseLoopBuffer.getChannelData(0);
            let last = 0;
            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                last = (last + 0.012 * white) / 1.012;
                data[i] = white * 0.55 + last * 0.45;
            }

            const bedNoise = ctx.createBufferSource();
            bedNoise.buffer = noiseLoopBuffer;
            bedNoise.loop = true;
            const bedHigh = ctx.createBiquadFilter();
            bedHigh.type = 'highpass';
            bedHigh.frequency.value = 280;
            const bedFilter = ctx.createBiquadFilter();
            bedFilter.type = 'bandpass';
            bedFilter.frequency.value = 1150;
            bedFilter.Q.value = 0.95;
            const bedGain = ctx.createGain();
            bedGain.gain.value = 0;
            const bedTone = ctx.createOscillator();
            bedTone.type = 'sine';
            bedTone.frequency.value = 210;
            const bedToneGain = ctx.createGain();
            bedToneGain.gain.value = 0;
            const bedBus = ctx.createGain();
            bedBus.gain.value = 1;

            bedNoise.connect(bedHigh);
            bedHigh.connect(bedFilter);
            bedFilter.connect(bedGain);
            bedGain.connect(bedBus);
            bedTone.connect(bedToneGain);
            bedToneGain.connect(bedBus);
            bedBus.connect(master);

            bedNoise.start();
            bedTone.start();
            pumpBed = { bedGain, bedFilter, bedTone, bedToneGain, bedBus };
        }

        function resume() {
            init();
            if (!ctx) return;
            const begin = () => {
                startBgm();
                if (!bgmStarted) requestAnimationFrame(() => startBgm());
            };
            if (ctx.state === 'suspended') {
                ctx.resume().then(begin).catch(begin);
            } else {
                begin();
            }
        }

        function ensureBgmElement() {
            if (bgmEl) return;
            bgmEl = new Audio(BGM_SRC);
            bgmEl.loop = true;
            bgmEl.preload = 'auto';
            bgmEl.crossOrigin = 'anonymous';
            bgmEl.playsInline = true;
            bgmEl.setAttribute('playsinline', '');
            bgmEl.volume = 1;
        }

        function setupBgmGraph() {
            if (!ctx || bgmGraphReady) return;
            ensureBgmElement();
            bgmBus = ctx.createGain();
            bgmBus.gain.value = 0;
            bgmBus.connect(master);
            bgmMediaSource = ctx.createMediaElementSource(bgmEl);
            bgmMediaSource.connect(bgmBus);
            bgmGraphReady = true;
        }

        function runBgmPlayback() {
            if (!ctx) return;
            setupBgmGraph();
            const t = ctx.currentTime;
            bgmBus.gain.cancelScheduledValues(t);
            bgmBus.gain.setValueAtTime(bgmBus.gain.value, t);
            bgmBus.gain.linearRampToValueAtTime(BGM_LEVEL, t + 1.2);
            const playPromise = bgmEl.play();
            if (playPromise && typeof playPromise.then === 'function') {
                playPromise.then(() => {
                    bgmStarted = true;
                }).catch(() => {});
            } else {
                bgmStarted = true;
            }
        }

        function startBgm() {
            init();
            if (!ctx) return;
            ensureBgmElement();

            const kick = () => runBgmPlayback();
            if (ctx.state === 'suspended') {
                ctx.resume().then(kick).catch(kick);
            } else {
                kick();
            }
        }

        function autoplayBgm() {
            init();
            ensureBgmElement();
            startBgm();
            if (bgmAutoplayAttempts >= 24) return;
            bgmAutoplayAttempts++;
            if (!bgmStarted || (bgmEl && bgmEl.paused)) {
                requestAnimationFrame(autoplayBgm);
            }
        }

        function makeNoiseBurst(durationSec, shaping) {
            const len = Math.max(1, Math.floor(ctx.sampleRate * durationSec));
            const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
            const d = buffer.getChannelData(0);
            for (let i = 0; i < len; i++) {
                const t = i / len;
                const env = shaping ? shaping(t) : Math.pow(1 - t, 1.4);
                d[i] = (Math.random() * 2 - 1) * env;
            }
            return buffer;
        }

        function playPumpChuff(inflate, intensity) {
            if (!ctx || !popBus) return;
            const t = ctx.currentTime;
            const power = 0.65 + intensity * 0.55 + inflate * 0.35;

            const whoosh = ctx.createBufferSource();
            whoosh.buffer = makeNoiseBurst(0.09, (u) => Math.sin(Math.PI * u) * (1 - u * 0.35));
            const wf = ctx.createBiquadFilter();
            wf.type = 'bandpass';
            wf.frequency.setValueAtTime(720 + inflate * 380, t);
            wf.frequency.linearRampToValueAtTime(2200 + inflate * 500, t + 0.07);
            wf.Q.value = 1.05;
            const wg = ctx.createGain();
            wg.gain.setValueAtTime(0.001, t);
            wg.gain.linearRampToValueAtTime(power * 0.82, t + 0.006);
            wg.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
            whoosh.connect(wf);
            wf.connect(wg);
            wg.connect(master);
            whoosh.start(t);
            whoosh.stop(t + 0.1);

            const puff = ctx.createOscillator();
            puff.type = 'sine';
            puff.frequency.setValueAtTime(260 + inflate * 80, t);
            puff.frequency.exponentialRampToValueAtTime(420 + inflate * 120, t + 0.045);
            const pg = ctx.createGain();
            pg.gain.setValueAtTime(power * 0.28, t);
            pg.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
            puff.connect(pg);
            pg.connect(master);
            puff.start(t);
            puff.stop(t + 0.065);

            const click = ctx.createOscillator();
            click.type = 'sine';
            click.frequency.setValueAtTime(520, t);
            click.frequency.exponentialRampToValueAtTime(320, t + 0.035);
            const cg = ctx.createGain();
            cg.gain.setValueAtTime(power * 0.22, t);
            cg.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
            click.connect(cg);
            cg.connect(master);
            click.start(t);
            click.stop(t + 0.045);
        }

        function updatePump(inflate, dt, isPumping) {
            resume();
            if (!pumpBed || !ctx) return;
            if (isPumping) pumpIntensity = Math.min(1, pumpIntensity + dt * 2.2);
            else pumpIntensity = Math.max(0, pumpIntensity - dt * 4.5);

            const t = ctx.currentTime;
            const pressure = pumpIntensity * (0.45 + inflate * 0.55);
            const wobble = 0.72 + 0.28 * Math.sin(simTime * 9.5);

            pumpBed.bedGain.gain.setTargetAtTime(pressure * 0.58 * wobble, t, 0.025);
            pumpBed.bedFilter.frequency.setTargetAtTime(980 + inflate * 750 + wobble * 90, t, 0.04);
            pumpBed.bedToneGain.gain.setTargetAtTime(pressure * 0.1, t, 0.03);
            pumpBed.bedTone.frequency.setTargetAtTime(190 + inflate * 70 + wobble * 8, t, 0.04);
            pumpBed.bedBus.gain.setTargetAtTime(pumpIntensity > 0.02 ? 1 : 0, t, 0.05);

            if (isPumping && pumpIntensity > 0.08) {
                const strokeHz = 4.8 + inflate * 3.2;
                pumpStrokePhase += dt * strokeHz;
                const phaseInt = Math.floor(pumpStrokePhase);
                if (phaseInt > lastChuffPhaseInt) {
                    const steps = Math.min(3, phaseInt - lastChuffPhaseInt);
                    for (let i = 0; i < steps; i++) playPumpChuff(inflate, pumpIntensity);
                    lastChuffPhaseInt = phaseInt;
                }
            } else {
                pumpStrokePhase = 0;
                lastChuffPhaseInt = 0;
            }
        }

        /** 气球爆破：膜裂瞬态 + 空腔闷响 + 放气 flutter（非打击/噪声爆裂路线） */
        function playPopImpact(t, scale, firstPop) {
            const s = scale * (firstPop ? 1.45 : 1);

            const lip = ctx.createOscillator();
            lip.type = 'sine';
            lip.frequency.setValueAtTime((firstPop ? 920 : 760) * Math.min(1.1, scale + 0.15), t);
            lip.frequency.exponentialRampToValueAtTime(380, t + 0.022);
            const lipG = ctx.createGain();
            lipG.gain.setValueAtTime((firstPop ? 0.95 : 0.62) * s, t);
            lipG.gain.exponentialRampToValueAtTime(0.001, t + 0.028);
            lip.connect(lipG);
            lipG.connect(popBus);
            lip.start(t);
            lip.stop(t + 0.03);

            const tear = ctx.createBufferSource();
            tear.buffer = makeNoiseBurst(firstPop ? 0.07 : 0.055, (u) => Math.pow(1 - u, 0.55));
            const tearF = ctx.createBiquadFilter();
            tearF.type = 'bandpass';
            tearF.Q.value = 2.2;
            tearF.frequency.setValueAtTime(5200, t);
            tearF.frequency.exponentialRampToValueAtTime(900, t + 0.05);
            const tearG = ctx.createGain();
            tearG.gain.setValueAtTime((firstPop ? 1.35 : 0.88) * s, t);
            tearG.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
            tear.connect(tearF);
            tearF.connect(tearG);
            tearG.connect(popBus);
            tear.start(t);
            tear.stop(t + 0.065);

            const cavity = ctx.createOscillator();
            cavity.type = 'triangle';
            cavity.frequency.setValueAtTime(firstPop ? 268 : 220, t);
            cavity.frequency.exponentialRampToValueAtTime(108, t + 0.1);
            const cavG = ctx.createGain();
            cavG.gain.setValueAtTime((firstPop ? 1.05 : 0.58) * s, t);
            cavG.gain.exponentialRampToValueAtTime(0.001, t + (firstPop ? 0.13 : 0.09));
            const cavF = ctx.createBiquadFilter();
            cavF.type = 'lowpass';
            cavF.frequency.value = 520;
            cavity.connect(cavF);
            cavF.connect(cavG);
            cavG.connect(popBus);
            cavity.start(t);
            cavity.stop(t + 0.14);

            const flutterDur = firstPop ? 0.11 : 0.07;
            const flutter = ctx.createBufferSource();
            flutter.buffer = makeNoiseBurst(flutterDur, (u) => {
                const wobble = 0.55 + 0.45 * Math.sin(u * Math.PI * 7);
                return (1 - u) * wobble;
            });
            const fltF = ctx.createBiquadFilter();
            fltF.type = 'bandpass';
            fltF.frequency.setValueAtTime(1400, t);
            fltF.frequency.linearRampToValueAtTime(680, t + flutterDur);
            fltF.Q.value = 0.9;
            const fltG = ctx.createGain();
            fltG.gain.setValueAtTime((firstPop ? 0.72 : 0.42) * s, t);
            fltG.gain.exponentialRampToValueAtTime(0.001, t + flutterDur);
            flutter.connect(fltF);
            fltF.connect(fltG);
            fltG.connect(popBus);
            flutter.start(t);
            flutter.stop(t + flutterDur + 0.01);

            if (firstPop) {
                const ring = ctx.createOscillator();
                ring.type = 'sine';
                ring.frequency.setValueAtTime(156, t);
                ring.frequency.exponentialRampToValueAtTime(92, t + 0.16);
                const ringG = ctx.createGain();
                ringG.gain.setValueAtTime(0.55 * s, t);
                ringG.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
                ring.connect(ringG);
                ringG.connect(popBus);
                ring.start(t);
                ring.stop(t + 0.19);
            }
        }

        function playComboPlink(t, freq, step) {
            const vel = 0.58 + Math.min(step, 12) * 0.055;
            const dur = 0.11 + Math.min(step, 8) * 0.006;

            const lead = ctx.createOscillator();
            lead.type = 'triangle';
            lead.frequency.setValueAtTime(freq, t);
            const lg = ctx.createGain();
            lg.gain.setValueAtTime(0.001, t);
            lg.gain.linearRampToValueAtTime(vel, t + 0.004);
            lg.gain.exponentialRampToValueAtTime(0.001, t + dur);
            lead.connect(lg);
            lg.connect(popBus);
            lead.start(t);
            lead.stop(t + dur + 0.02);

            const harm = ctx.createOscillator();
            harm.type = 'sine';
            harm.frequency.setValueAtTime(freq * 2, t);
            const hg = ctx.createGain();
            hg.gain.setValueAtTime(0.001, t);
            hg.gain.linearRampToValueAtTime(vel * 0.38, t + 0.003);
            hg.gain.exponentialRampToValueAtTime(0.001, t + dur * 0.85);
            harm.connect(hg);
            hg.connect(popBus);
            harm.start(t);
            harm.stop(t + dur + 0.02);

            if (step >= 3) {
                const sparkle = ctx.createOscillator();
                sparkle.type = 'sine';
                sparkle.frequency.setValueAtTime(freq * 3, t);
                const spg = ctx.createGain();
                spg.gain.setValueAtTime(0.001, t);
                spg.gain.linearRampToValueAtTime(vel * 0.22, t + 0.002);
                spg.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
                sparkle.connect(spg);
                spg.connect(popBus);
                sparkle.start(t);
                sparkle.stop(t + 0.08);
            }
        }

        function playPop(comboIndex) {
            resume();
            if (!ctx || !popBus) return;
            const step = Math.max(0, comboIndex - 1);
            const melodyIdx = Math.min(step, COMBO_MELODY.length - 1);
            const freq = COMBO_MELODY[melodyIdx];
            const t = ctx.currentTime;

            if (comboIndex === 1) {
                popBus.gain.cancelScheduledValues(t);
                popBus.gain.setValueAtTime(1.55, t);
                popBus.gain.setTargetAtTime(1.15, t + 0.12, 0.06);
                playPopImpact(t, 1, true);
                playComboPlink(t, COMBO_MELODY[0], 0);
            } else {
                const tail = Math.max(0.38, 0.72 - step * 0.03);
                playPopImpact(t, tail, false);
                playComboPlink(t, freq, step);
            }
        }

        function playDenied() {
            resume();
            if (!ctx || !master) return;
            const now = performance.now();
            if (now - lastDeniedAt < 280) return;
            lastDeniedAt = now;
            const t = ctx.currentTime;

            const o = ctx.createOscillator();
            o.type = 'square';
            o.frequency.setValueAtTime(180, t);
            o.frequency.exponentialRampToValueAtTime(70, t + 0.22);
            const g = ctx.createGain();
            g.gain.setValueAtTime(0.32, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
            const f = ctx.createBiquadFilter();
            f.type = 'lowpass';
            f.frequency.value = 700;
            o.connect(f);
            f.connect(g);
            g.connect(master);
            o.start(t);
            o.stop(t + 0.25);

            const buf = ctx.createBufferSource();
            buf.buffer = makeNoiseBurst(0.08, (u) => 1 - u);
            const ng = ctx.createGain();
            ng.gain.setValueAtTime(0.25, t);
            ng.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
            buf.connect(ng);
            ng.connect(master);
            buf.start(t);
            buf.stop(t + 0.09);
        }

        function playWin() {
            resume();
            if (!ctx || !master) return;
            const t = ctx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.5, 1318.51];
            notes.forEach((freq, i) => {
                const o = ctx.createOscillator();
                o.type = 'triangle';
                o.frequency.value = freq;
                const g = ctx.createGain();
                const at = t + i * 0.085;
                g.gain.setValueAtTime(0.001, at);
                g.gain.linearRampToValueAtTime(0.42, at + 0.015);
                g.gain.exponentialRampToValueAtTime(0.001, at + 0.5);
                o.connect(g);
                g.connect(popBus);
                o.start(at);
                o.stop(at + 0.52);
            });
        }

        function playLose() {
            resume();
            if (!ctx || !master) return;
            const t = ctx.currentTime;
            const o = ctx.createOscillator();
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(220, t);
            o.frequency.exponentialRampToValueAtTime(55, t + 0.65);
            const g = ctx.createGain();
            g.gain.setValueAtTime(0.38, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.68);
            const f = ctx.createBiquadFilter();
            f.type = 'lowpass';
            f.frequency.value = 900;
            o.connect(f);
            f.connect(g);
            g.connect(master);
            o.start(t);
            o.stop(t + 0.7);
        }

        return { resume, autoplayBgm, updatePump, playPop, playDenied, playWin, playLose };
    })();

    function makeSeededRng(seed) {
        let s = (seed >>> 0) || 1;
        return function seededRandom() {
            s = (Math.imul(1664525, s) + 1013904223) >>> 0;
            return s / 4294967296;
        };
    }

    function proceduralTier(levelIndex) {
        return levelIndex - TUTORIAL_LEVEL_COUNT + 1;

    /** 第 4 关起：节奏起伏的自动关卡（种子由关卡号决定，可复现） */
    function generateProceduralLevel(levelIndex) {
        const tier = proceduralTier(levelIndex);
        const seed = (levelIndex + 1) * 9973 + tier * 104729;
        const rng = makeSeededRng(seed);

        const wave = Math.sin(tier * 0.85);
        const wave2 = Math.sin(tier * 1.35 + 0.4);

        const colorCount = clamp(2 + Math.floor((tier + 2) / 3), 2, TEAM_PALETTE.length);
        const activeTeams = [];
        for (let i = 0; i < colorCount; i++) activeTeams.push(i);

        const balloonCountFactor = clamp(
            1.18 + tier * 0.055 + wave * 0.11,
            1.12,
            2.35
        );
        const layoutRadiusScale = clamp(1 - tier * 0.026 - Math.max(0, wave) * 0.04, 0.55, 1);
        const scatter = clamp(0.1 + tier * 0.032 + (wave2 > 0 ? 0.1 : 0.02), 0, 0.52);
        const pumpSlack = clamp(0.1 + wave * 0.07, 0.04, 0.22);

        const scarceSlot = tier >= 2 ? Math.floor(rng() * activeTeams.length) : -1;
        const teamSpawnWeights = new Array(activeTeams.length).fill(1);
        if (scarceSlot >= 0) {
            const scarceShare = clamp(0.1 + tier * 0.012, 0.08, 0.22);
            const rest = (1 - scarceShare) / Math.max(1, activeTeams.length - 1);
            for (let s = 0; s < activeTeams.length; s++) {
                teamSpawnWeights[s] = s === scarceSlot ? scarceShare : rest;
            }
        } else {
            const even = 1 / activeTeams.length;
            for (let s = 0; s < activeTeams.length; s++) teamSpawnWeights[s] = even;
        }

        const pumpNerfBySlot = {};
        if (tier >= 3) {
            const nerfSlot = scarceSlot >= 0 ? scarceSlot : Math.floor(rng() * activeTeams.length);
            pumpNerfBySlot[nerfSlot] = clamp(0.48 + rng() * 0.12, 0.45, 0.62);
        }
        if (tier >= 6) {
            let second = Math.floor(rng() * activeTeams.length);
            while (second in pumpNerfBySlot) second = (second + 1) % activeTeams.length;
            pumpNerfBySlot[second] = clamp(0.58 + rng() * 0.12, 0.52, 0.72);
        }

        const breathLevel = wave < -0.35;
        const title = breathLevel
            ? `喘息 · ${levelIndex + 1}`
            : `征程 · ${levelIndex + 1}`;

        return {
            id: levelIndex + 1,
            title,
            procedural: true,
            seed,
            balloonCountFactor: breathLevel ? balloonCountFactor * 0.94 : balloonCountFactor,
            layoutRadiusScale,
            scatter,
            activeTeams,
            teamSpawnWeights,
            scarceSlot,
            pumpSlack: breathLevel ? pumpSlack + 0.06 : pumpSlack,
            pumpNerfBySlot
        };
    }

    function getLevelSpec(levelIndex) {
        if (isTutorialLevel(levelIndex)) return TUTORIAL_LEVELS[levelIndex];
        return generateProceduralLevel(levelIndex);

    function pickSpawnTeamFromWeights(level, rng) {
        const teams = level.activeTeams;
        const weights = level.teamSpawnWeights;
        if (!weights || weights.length !== teams.length) {
            return teams[Math.floor(rng() * teams.length)];
        }
        let roll = rng();
        for (let s = 0; s < teams.length; s++) {
            roll -= weights[s];
            if (roll <= 0) return teams[s];
        }
        return teams[teams.length - 1];
    }

    function buildProceduralPump(level, layout) {
        const teams = level.activeTeams;
        const scale = layout.referenceCount > 0 ? layout.count / layout.referenceCount : 1;
        const slack = level.pumpSlack ?? 0.12;
        const pump = teams.map((ti) =>
            Math.ceil(TEAM_PALETTE[ti].defaultPump * scale * (1 + slack))
        );
        const nerfs = level.pumpNerfBySlot || {};
        for (const key of Object.keys(nerfs)) {
            const slot = Number(key);
            if (slot >= 0 && slot < pump.length) {
                pump[slot] = Math.max(6, Math.ceil(pump[slot] * nerfs[slot]));
            }
        }
        return pump;
    }

    class Particle {
        constructor(x, y, mass) {
            this.x = x;
            this.y = y;
            this.px = x;
            this.py = y;
            this.vx = 0;
            this.vy = 0;
            this.mass = mass;
            this.invMass = mass > 0 ? 1 / mass : 0;
        }

    class DistanceConstraint {
        constructor(p1, p2, stiffness = 1.0) {
            this.p1 = p1;
            this.p2 = p2;
            const dx = p1.x - p2.x;
            const dy = p1.y - p2.y;
            this.restLength = Math.hypot(dx, dy);
            this.initialRestLength = this.restLength;
            this.stiffness = stiffness;
            this.baseStiffness = stiffness;
        }

        solve() {
            const dx = this.p1.x - this.p2.x;
            const dy = this.p1.y - this.p2.y;
            const d = Math.hypot(dx, dy);
            if (d === 0) return;

            const diff = (d - this.restLength) / d;
            const w1 = this.p1.invMass;
            const w2 = this.p2.invMass;
            const w = w1 + w2;
            if (w === 0) return;

            const corrX = dx * diff * this.stiffness / w;
            const corrY = dy * diff * this.stiffness / w;

            this.p1.x -= corrX * w1;
            this.p1.y -= corrY * w1;
            this.p2.x += corrX * w2;
            this.p2.y += corrY * w2;
        }
    }

    class AreaConstraint {
        constructor(particles, stiffness = 1.0) {
            this.particles = particles;
            this.stiffness = stiffness;
            this.restArea = this.calculateArea();
            this.baseRestArea = this.restArea;
        }

        calculateArea() {
            let area = 0;
            const N = this.particles.length;
            for (let i = 0; i < N; i++) {
                const p = this.particles[i];
                const pNext = this.particles[(i + 1) % N];
                area += (p.x * pNext.y - pNext.x * p.y);
            }
            return 0.5 * area;
        }

        solve() {
            const N = this.particles.length;
            const currentArea = this.calculateArea();
            const deltaArea = currentArea - this.restArea;

            let sumWGrad2 = 0;
            const gradients = new Array(N);

            for (let i = 0; i < N; i++) {
                const pNext = this.particles[(i + 1) % N];
                const pPrev = this.particles[(i - 1 + N) % N];
                gradients[i] = {
                    x: 0.5 * (pNext.y - pPrev.y),
                    y: 0.5 * (pPrev.x - pNext.x)
                };
                const w = this.particles[i].invMass;
                sumWGrad2 += w * (gradients[i].x ** 2 + gradients[i].y ** 2);
            }

            if (sumWGrad2 < 0.00001) return;

            const lambda = -deltaArea / sumWGrad2 * this.stiffness;

            for (let i = 0; i < N; i++) {
                const p = this.particles[i];
                const w = p.invMass;
                p.x += lambda * w * gradients[i].x;
                p.y += lambda * w * gradients[i].y;
            }
        }
    }

    function layoutPumpHitRects() {
        pumpHitRects.length = 0;
        const n = activeTeams.length;
        if (n === 0) return;
        const dockTop = GROUND_Y + 6;
        const dockInnerH = PUMP_ZONE_HEIGHT - 12;
        const cols = n <= 3 ? n : (n === 4 ? 4 : 3);
        const rows = Math.ceil(n / cols);
        const gap = n >= 6 ? 8 : (n >= 4 ? 10 : 16);
        const maxRowW = width - 20;
        const iconW = Math.min(72, Math.floor((maxRowW - gap * (cols - 1)) / cols));
        const iconH = rows > 1
            ? Math.min(44, Math.floor((dockInnerH - gap * (rows - 1)) / rows))
            : Math.min(78, dockInnerH - 4);
        let slot = 0;
        for (let r = 0; r < rows; r++) {
            const countInRow = Math.min(cols, n - r * cols);
            const rowW = countInRow * iconW + (countInRow - 1) * gap;
            const startX = (width - rowW) * 0.5;
            const y = dockTop + r * (iconH + gap);
            for (let c = 0; c < countInRow; c++) {
                pumpHitRects.push({
                    index: slot,
                    x: startX + c * (iconW + gap),
                    y,
                    w: iconW,
                    h: iconH
                });
                slot++;
            }
        }
    }

    function pickPumpAt(x, y) {

            const r = pumpHitRects[i];
            if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r.index;

        return -1;
    }

    function strokeRoundRect(x, y, w, h, r) {
        const rr = Math.min(r, w * 0.5, h * 0.5);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.lineTo(x + w - rr, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
        ctx.lineTo(x + w, y + h - rr);
        ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
        ctx.lineTo(x + rr, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
        ctx.lineTo(x, y + rr);
        ctx.quadraticCurveTo(x, y, x + rr, y);
        ctx.closePath();
    }

        ctx.fill();
        ctx.fillStyle = metalDark;
        ctx.beginPath();
        ctx.arc(nozzleX + 1.5, nozzleY, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = selected ? 'rgba(255, 255, 255, 0.95)' : 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = selected ? 2.5 : 1.5;
        strokeRoundRect(x + 2, y + 3, w - 4, h - 6, 10);
        ctx.stroke();

        ctx.shadowBlur = 0;
        const num = empty ? '0' : String(Math.max(0, Math.ceil(fuelRemaining)));
        const labelY = barrelTop + barrelH * 0.52;
        const fontSize = Math.max(14, Math.min(20, barrelW * 0.95));
        ctx.font = `bold ${fontSize}px "ZCOOL KuaiLe", system-ui, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.55)';
        ctx.fillStyle = empty ? 'rgba(255, 255, 255, 0.6)' : 'rgba(255, 255, 255, 0.98)';
        ctx.strokeText(num, cx, labelY);
        ctx.fillText(num, cx, labelY);
        ctx.restore();
    }

    function drawPumpDock() {
        const dockGrad = ctx.createLinearGradient(0, GROUND_Y, 0, height);
        dockGrad.addColorStop(0, 'rgba(18, 18, 32, 0.92)');
        dockGrad.addColorStop(1, 'rgba(8, 8, 16, 0.98)');
        ctx.fillStyle = dockGrad;
        ctx.fillRect(0, GROUND_Y, width, PUMP_ZONE_HEIGHT);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y + 0.5);
        ctx.lineTo(width, GROUND_Y + 0.5);
        ctx.stroke();

        layoutPumpHitRects();
        for (let i = 0; i < activeTeams.length; i++) {
            const r = pumpHitRects[i];
            if (!r) continue;
            const tool = paletteTeam(activeTeams[i]);
            drawPumpIcon(
                r.x, r.y, r.w, r.h, tool, i,
                selectedPumpIndex === i, pumpFuelRemaining[i] ?? 0
            );
        }
    }

    function createSoftBall(cx, cy, radius, colorBase, colorLight, initialVelocity = null) {
        const N = PARTICLES_PER_BALLOON;
        const ballParticles = [];

        for (let i = 0; i < N; i++) {
            const angle = (i / N) * Math.PI * 2;
            const px = cx + Math.cos(angle) * radius;
            const py = cy + Math.sin(angle) * radius;
            const p = new Particle(px, py, 1.0);
            if (initialVelocity) {
                p.vx = initialVelocity.vx;
                p.vy = initialVelocity.vy;
            }
            ballParticles.push(p);
            particles.push(p);
        }

        const distanceConstraints = [];
        for (let i = 0; i < N; i++) {
            const c1 = new DistanceConstraint(ballParticles[i], ballParticles[(i + 1) % N], 1.0);
            const c2 = new DistanceConstraint(ballParticles[i], ballParticles[(i + 2) % N], 0.8);
            constraints.push(c1, c2);
            distanceConstraints.push(c1, c2);
        }
        const areaConstraint = new AreaConstraint(ballParticles, 1.0);
        constraints.push(areaConstraint);

        const solverConstraints = distanceConstraints.concat([areaConstraint]);

        balls.push({
            particles: ballParticles,
            radius,
            baseRadius: radius,
            colorBase,
            colorLight,
            inflate: 0,
            fillAtRestBase: 0,
            restVisualScale: 1,
            air: AIR_CAPACITY,
            imminentPopDelay: null,
            distanceConstraints,
            areaConstraint,
            solverConstraints,
            cx,
            cy,
            labelLift: 0,
            labelScale: 1,
            labelPulse: 0,
            labelLastCeil: AIR_CAPACITY
        });
    }

    function refreshBallCentroids() {
        for (let b = 0; b < balls.length; b++) {
            const ball = balls[b];
            const pts = ball.particles;
            let cx = 0;
            let cy = 0;
            for (let i = 0; i < pts.length; i++) {
                cx += pts[i].x;
                cy += pts[i].y;
            }
            ball.cx = cx / pts.length;
            ball.cy = cy / pts.length;
        }
    }

    function solveBallConstraints() {
        if (!constraintOrderFlip) {
            for (let b = 0; b < balls.length; b++) {
                const list = balls[b].solverConstraints;
                for (let i = 0; i < list.length; i++) list[i].solve();
            }
        } else {
            for (let b = balls.length - 1; b >= 0; b--) {
                const list = balls[b].solverConstraints;
                for (let i = list.length - 1; i >= 0; i--) list[i].solve();
            }
        }
        constraintOrderFlip = !constraintOrderFlip;
    }

    function airToFillRatio(air) {
        const clamped = Math.max(0, Math.min(AIR_CAPACITY, air));
        return 1 - clamped / AIR_CAPACITY;
    }

    function smallBalloonRadiusMul(air) {
        if (air <= SMALL_BALLOON_AIR_START) return 1;
        if (air >= SMALL_BALLOON_AIR_END) return SMALL_BALLOON_RADIUS_MUL_AT_MAX_AIR;
        const t = (air - SMALL_BALLOON_AIR_START) / (SMALL_BALLOON_AIR_END - SMALL_BALLOON_AIR_START);
        return 1 - 0.4 * t;
    }

    function visualScaleFromAir(air) {
        const fill = airToFillRatio(air);
        const baseScale = 1 + fill * (INFLATE_MAX_SCALE - 1);
        return baseScale * smallBalloonRadiusMul(air);
    }

    function currentInflateScale(ball) {
        return visualScaleFromAir(ball.air);
    }

    function applyBallAirVisual(ball) {
        ball.inflate = airToFillRatio(ball.air);
        applyInflationTargets(ball);
    }

    function schedulePopIfEmpty(ball) {
        if (ball.air > 0) return;
        if (ball.imminentPopDelay == null) ball.imminentPopDelay = FULL_POP_DELAY;
    }

    function rollBaselineInitialAir(spawnIndex = 0) {
        const buckets = BASELINE_SPAWN.airBuckets;
        const bucket = buckets[((spawnIndex % buckets.length) + buckets.length) % buckets.length];
        const span = bucket.max - bucket.min + 1;
        return bucket.min + Math.floor(Math.random() * span);
    }

    /** @deprecated 请用 rollBaselineInitialAir；保留别名避免遗漏调用点 */
    function randomInitialAir(spawnIndex = 0) {
        return rollBaselineInitialAir(spawnIndex);
    }

    function captureBaselineCounts(layout) {
        baselineReferenceCount = layout.referenceCount;
        if (layout.balloonCountFactor <= 1) {
            baselineLevelOneCount = layout.count;
        }
    }

    function resolveBalloonCountFactor(factor) {
        const ref = baselineReferenceCount > 0
            ? baselineReferenceCount
            : computeBalloonFillLayout(1).referenceCount;
        return Math.max(1, Math.round(ref * factor));
    }

    function updateImminentPops() {
        for (let i = balls.length - 1; i >= 0; i--) {
            const ball = balls[i];
            if (ball.imminentPopDelay == null) continue;
            ball.imminentPopDelay -= dt;
            if (ball.imminentPopDelay <= 0) {
                ball.imminentPopDelay = null;
                refreshBallCentroids();
                for (let bi = 0; bi < balls.length; bi++) syncBallBounds(balls[bi]);
                popBalloon(ball);
            }
        }
    }

    function applyInflationTargets(ball) {
        const targetScale = visualScaleFromAir(ball.air);
        const baseScale = ball.restVisualScale || targetScale;
        const rel = baseScale > 1e-6 ? targetScale / baseScale : targetScale;
        const areaScale = rel * rel;
        ball.areaConstraint.restArea = ball.areaConstraint.baseRestArea * areaScale;
        for (const dc of ball.distanceConstraints) {
            dc.restLength = dc.initialRestLength * rel;
        }
        ball.radius = ball.baseRadius * rel;

        const wobble = ball.inflate * ball.inflate;
        const pulse = Math.sin(simTime * (8 + wobble * 28)) * wobble;
        ball.areaConstraint.stiffness = Math.max(0.35, 1 - wobble * 0.55 + pulse * 0.2);
        for (const dc of ball.distanceConstraints) {
            dc.stiffness = dc.baseStiffness * Math.max(0.4, 1 - wobble * 0.45);
        }
    }

    function applyInflationShake(ball) {
        if (ball.inflate <= 0.12) return;
        const pts = ball.particles;
        const c = polygonCentroid(pts);
        const wobble = ball.inflate * ball.inflate;
        const mag = (6 + wobble * 220) * dt;
        const spin = simTime * (14 + wobble * 40);

        for (let i = 0; i < pts.length; i++) {
            const p = pts[i];
            const nx = p.x - c.x;
            const ny = p.y - c.y;
            const len = Math.hypot(nx, ny) || 1;
            const tx = -ny / len;
            const ty = nx / len;
            const wave = Math.sin(spin + i * 0.85) * wobble;
            p.vx += tx * wave * mag + (Math.random() - 0.5) * mag * 1.6;
            p.vy += ty * wave * mag + (Math.random() - 0.5) * mag * 1.6;
        }
    }

    function resetChainPopState() {
        chainPopQueue = [];
        chainPopVisited = null;
        chainPopAccum = 0;
    }

    function comboTierForCount(n) {
        if (n >= 26) return 4;
        if (n >= 16) return 3;
        if (n >= 11) return 2;
        if (n >= 6) return 1;
        return 0;
    }

    function bumpComboHud(n) {
        if (!comboHudEl || !comboValueEl) return;
        if (n < 2) {
            comboHudEl.classList.remove('visible', 'combo-pop');
            comboHideTimer = 0;
            return;
        }
        comboValueEl.textContent = String(n);
        comboHudEl.dataset.tier = String(comboTierForCount(n));
        comboHudEl.classList.add('visible');
        comboHudEl.classList.remove('combo-pop');
        void comboHudEl.offsetWidth;
        comboHudEl.classList.add('combo-pop');
        comboHideTimer = 1.5;
    }

    function updateComboHud() {
        if (!comboHudEl || comboHideTimer <= 0) return;
        if (chainPopQueue.length > 0) {
            comboHideTimer = 1.5;
            return;
        }
        comboHideTimer -= dt;
        if (comboHideTimer <= 0) {
            comboHudEl.classList.remove('visible', 'combo-pop');
        }
    }

    function hideComboHud() {
        comboHideTimer = 0;
        chainComboCount = 0;
        if (comboHudEl) comboHudEl.classList.remove('visible', 'combo-pop');
    }

    function playOutcomeSoundOnce(outcome) {
        if (outcomeSoundPlayed === outcome) return;
        outcomeSoundPlayed = outcome;
        if (outcome === 'won') Sfx.playWin();
        else if (outcome === 'lost') Sfx.playLose();
    }

    function resetOutcomeSound() {
        outcomeSoundPlayed = null;
    }

    function ensureBallLabelState(ball) {
        if (ball.labelLift == null) ball.labelLift = 0;
        if (ball.labelScale == null) ball.labelScale = 1;
        if (ball.labelPulse == null) ball.labelPulse = 0;
        if (ball.labelLastCeil == null) ball.labelLastCeil = Math.ceil(ball.air);
    }

    function updateBallLabelAnims() {
        for (let i = 0; i < balls.length; i++) {
            const ball = balls[i];
            ensureBallLabelState(ball);
            ball.labelLift *= Math.exp(-5.2 * dt);
            ball.labelPulse *= Math.exp(-9.5 * dt);
            ball.labelScale += (1 - ball.labelScale) * Math.min(1, 7.5 * dt);
        }
    }

    function bumpBallLabelOnAirTick(ball, airBefore) {
        ensureBallLabelState(ball);
        const ceilBefore = Math.ceil(airBefore);
        const ceilAfter = Math.ceil(ball.air);
        if (ceilAfter < ceilBefore) {
            const step = ceilBefore - ceilAfter;
            ball.labelLift = Math.min(ball.radius * 0.4, ball.labelLift + 3.2 + step * 1.2);
            ball.labelPulse = Math.min(1, ball.labelPulse + 0.55 + step * 0.15);
            ball.labelScale = Math.min(1.34, ball.labelScale + 0.07 + step * 0.03);
        }
        ball.labelLastCeil = ceilAfter;
    }

    function drawBallAirLabel(ball, cx, cy) {
        ensureBallLabelState(ball);
        const airLabel = ball.air > 0 ? String(Math.ceil(ball.air)) : '0';
        let fontSize = Math.max(15, Math.min(34, ball.radius * 0.52));
        const scale = ball.labelScale * (1 + ball.labelPulse * 0.12);
        fontSize *= scale;
        fontSize = Math.min(fontSize, ball.radius * 0.8);

        ctx.font = `bold ${fontSize}px "ZCOOL KuaiLe", system-ui, sans-serif`;
        let textW = ctx.measureText(airLabel).width;
        const maxW = ball.radius * 1.55;
        if (textW > maxW) {
            fontSize *= maxW / textW;
            ctx.font = `bold ${fontSize}px "ZCOOL KuaiLe", system-ui, sans-serif`;
            textW = ctx.measureText(airLabel).width;
        }

        const textH = fontSize;
        let lift = ball.labelLift;
        const maxLift = Math.max(0, ball.radius - textH * 0.52 - 3);
        lift = Math.min(lift, maxLift);
        const labelY = cy - lift;

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = Math.max(2, fontSize * 0.14);
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.42)';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.96)';
        ctx.strokeText(airLabel, cx, labelY);
        ctx.fillText(airLabel, cx, labelY);
    }

    function ensureChainVisited() {
        if (!chainPopVisited) chainPopVisited = new Set();
    }

    function syncBallBounds(ball) {
        const pts = ball.particles;
        let cx = 0;
        let cy = 0;
        for (let i = 0; i < pts.length; i++) {
            cx += pts[i].x;
            cy += pts[i].y;
        }
        cx /= pts.length;
        cy /= pts.length;
        let maxR = 0;
        for (let i = 0; i < pts.length; i++) {
            const r = Math.hypot(pts[i].x - cx, pts[i].y - cy);
            if (r > maxR) maxR = r;
        }
        ball.cx = cx;
        ball.cy = cy;
        ball.boundsRadius = maxR;
        return ball;
    }

    function minParticleGap(ballA, ballB) {
        const pa = ballA.particles;
        const pb = ballB.particles;
        let best = Infinity;
        for (let i = 0; i < pa.length; i++) {
            const ax = pa[i].x;
            const ay = pa[i].y;
            for (let j = 0; j < pb.length; j++) {
                const d = Math.hypot(ax - pb[j].x, ay - pb[j].y);
                if (d < best) best = d;
            }
        }
        return best;
    }

    function ballsPhysicallyTouch(ballA, ballB) {
        if (minParticleGap(ballA, ballB) <= CHAIN_PARTICLE_TOUCH) return true;
        syncBallBounds(ballA);
        syncBallBounds(ballB);
        const dist = Math.hypot(ballA.cx - ballB.cx, ballA.cy - ballB.cy);
        return dist <= ballA.boundsRadius + ballB.boundsRadius + CHAIN_PARTICLE_TOUCH * 0.5;
    }

    function getTouchingSameColorNeighbors(ball) {
        syncBallBounds(ball);
        const neighbors = [];
        for (let i = 0; i < balls.length; i++) {
            const other = balls[i];
            if (other === ball || other.colorBase !== ball.colorBase) continue;
            if (!ballsPhysicallyTouch(ball, other)) continue;
            neighbors.push({ ball: other, gap: minParticleGap(ball, other) });
        }
        neighbors.sort((a, b) => a.gap - b.gap);
        return neighbors.map((n) => n.ball);
    }

    function enqueueChainNeighbors(ball, neighbors) {
        ensureChainVisited();
        for (let i = 0; i < neighbors.length; i++) {
            const n = neighbors[i];
            if (!balls.includes(n) || chainPopVisited.has(n)) continue;
            chainPopVisited.add(n);
            chainPopQueue.push(n);
        }
    }

    function processChainPops() {
        if (!chainPopQueue.length) return;
        chainPopAccum += dt;
        if (chainPopAccum < CHAIN_POP_INTERVAL) return;
        chainPopAccum -= CHAIN_POP_INTERVAL;

        const next = chainPopQueue.shift();
        if (next && balls.includes(next)) popBalloon(next, true);
    }

    function spawnPopEffect(ball) {
        const c = polygonCentroid(ball.particles);
        for (let i = 0; i < 18; i++) {
            const a = Math.random() * Math.PI * 2;
            const sp = 80 + Math.random() * 260;
            popEffects.push({
                x: c.x,
                y: c.y,
                vx: Math.cos(a) * sp,
                vy: Math.sin(a) * sp,
                life: 0.55 + Math.random() * 0.35,
                maxLife: 1,
                color: ball.colorLight,
                size: 2 + Math.random() * 4
            });
        }
    }

    function popBalloon(ball, fromChain = false) {
        if (!balls.includes(ball)) return;

        if (!fromChain) {
            resetChainPopState();
            chainComboCount = 1;
        } else {
            chainComboCount++;
        }
        ensureChainVisited();
        chainPopVisited.add(ball);

        Sfx.playPop(chainComboCount);
        bumpComboHud(chainComboCount);

        const neighbors = getTouchingSameColorNeighbors(ball);
        spawnPopEffect(ball);
        const idx = balls.indexOf(ball);
        if (idx >= 0) destroyBall(idx);
        updateBallCount();
        enqueueChainNeighbors(ball, neighbors);
        checkLevelWin();
        checkLevelLose();
    }

    function updateBallCount() {
        ballCountEl.textContent = String(balls.length);
    }

    function updateLevelHud() {
        if (!levelHudEl) return;
        levelHudEl.textContent = `第 ${levelIndex + 1} 关`;
    }

    function balloonCountOnPumpSlot(slot) {
        let n = 0;
        for (let i = 0; i < balls.length; i++) {
            if (pumpSlotForBall(balls[i]) === slot) n++;
        }
        return n;
    }

    /** 该球能否被当前同色气筒一次打至爆破（不模拟连锁，只问「还能不能动手」） */
    function canFullyPopBallNow(ball) {
        if (ball.air <= 0) return true;
        const slot = pumpSlotForBall(ball);
        if (slot < 0) return false;
        return (pumpFuelRemaining[slot] ?? 0) >= ball.air;
    }

    /**
     * 最终无法过关（不做「总气量/总燃料」类数值比较）：
     * 1) 某色场上仍有球但气筒已空 → 该色永远无法再清，整关必败（其它色有气也算）
     * 2) 已没有任何一颗球能被当前燃料打爆 → 无法再继续推进
     */
    function isLevelUnwinnable() {
        if (balls.length === 0) return false;

        for (let slot = 0; slot < activeTeams.length; slot++) {
            if (balloonCountOnPumpSlot(slot) > 0 && (pumpFuelRemaining[slot] ?? 0) <= 0) {
                return true;
            }
        }

        for (let i = 0; i < balls.length; i++) {
            if (canFullyPopBallNow(balls[i])) return false;
        }
        return true;
    }

    function checkLevelLose() {
        if (gameOutcome !== 'playing') return;
        if (balls.length === 0) {
            loseCountdown = null;
            return;
        }
        if (!isLevelUnwinnable()) {
            loseCountdown = null;
            updateLevelHud();
            return;
        }
        if (loseCountdown == null) loseCountdown = LOSE_DELAY_SEC;
        updateLevelHud();
    }

    function updateLoseCountdown() {
        if (gameOutcome !== 'playing') return;
        if (loseCountdown == null) return;
        if (balls.length === 0 || !isLevelUnwinnable()) {
            loseCountdown = null;
            updateLevelHud();
            return;
        }
        loseCountdown -= dt;
        updateLevelHud();
        if (loseCountdown <= 0) {
            loseCountdown = null;
            gameOutcome = 'lost';
            activeInflateBall = null;
            playOutcomeSoundOnce('lost');
            updateLevelHud();
        }
    }

    function checkLevelWin() {
        if (gameOutcome !== 'playing') return;
        if (balls.length > 0) return;
        loseCountdown = null;
        if (winRevealCountdown == null) winRevealCountdown = TRANSITION_GAP_SEC;
        activeInflateBall = null;
        updateLevelHud();
    }

    function updateWinRevealCountdown() {
        if (gameOutcome !== 'playing') return;
        if (winRevealCountdown == null) return;
        winRevealCountdown -= dt;
        updateLevelHud();
        if (winRevealCountdown <= 0) {
            winRevealCountdown = null;
            gameOutcome = 'won';
            activeInflateBall = null;
            playOutcomeSoundOnce('won');
            updateLevelHud();
        }
    }

    function scheduleLoadLevel(idx) {
        pendingLoadLevelIndex = Math.max(0, idx);
        levelTransitionCountdown = TRANSITION_GAP_SEC;
        transitionFade = 0;
        levelTransitionDidLoad = false;
        gameOutcome = 'transition';
        settlementButtons = { next: null, restart: null };
        activeInflateBall = null;
        pointerDown = false;
        updateLevelHud();
    }

    function updateLevelTransition() {
        if (gameOutcome !== 'transition') return;
        if (levelTransitionCountdown == null) return;
        levelTransitionCountdown -= dt;
        const elapsed = TRANSITION_GAP_SEC - levelTransitionCountdown;
        if (elapsed < TRANSITION_FADE_HALF_SEC) {
            transitionFade = elapsed / TRANSITION_FADE_HALF_SEC;
        } else {
            if (!levelTransitionDidLoad) {
                loadLevelImmediate(pendingLoadLevelIndex, true);
                levelTransitionDidLoad = true;
            }
            const t = Math.min(1, (elapsed - TRANSITION_FADE_HALF_SEC) / TRANSITION_FADE_HALF_SEC);
            transitionFade = 1 - t;
        }
        updateLevelHud();
        if (levelTransitionCountdown <= 0) {
            levelTransitionCountdown = null;
            transitionFade = 0;
            levelTransitionDidLoad = false;
            gameOutcome = 'playing';
        }
    }

    function clearWorld() {
        while (balls.length > 0) destroyBall(0);
        popEffects.length = 0;
        resetChainPopState();
        hideComboHud();
        activeInflateBall = null;
        dragNode = null;
        pendingDragParticle = null;
    }

    function hitSettlementButton(btn, x, y) {
        if (!btn) return false;
        return x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h;
    }

    function destroyBall(index) {
        const ball = balls[index];
        const set = new Set(ball.particles);

        for (let i = particles.length - 1; i >= 0; i--) {
            if (set.has(particles[i])) particles.splice(i, 1);
        }

        for (let i = constraints.length - 1; i >= 0; i--) {
            const c = constraints[i];
            if (c instanceof AreaConstraint) {
                if (c.particles === ball.particles) constraints.splice(i, 1);
            } else if (c instanceof DistanceConstraint) {
                if (set.has(c.p1) || set.has(c.p2)) constraints.splice(i, 1);
            }
        }

        if (dragNode && set.has(dragNode)) dragNode = null;
        if (activeInflateBall === ball) activeInflateBall = null;
        balls.splice(index, 1);
    }

    function syncBallRestState(ball) {
        const pts = ball.particles;
        let cx = 0;
        let cy = 0;
        for (let i = 0; i < pts.length; i++) {
            cx += pts[i].x;
            cy += pts[i].y;
        }
        cx /= pts.length;
        cy /= pts.length;

        let avgR = 0;
        for (let i = 0; i < pts.length; i++) {
            avgR += Math.hypot(pts[i].x - cx, pts[i].y - cy);
        }
        avgR /= pts.length;

        ball.cx = cx;
        ball.cy = cy;
        ball.radius = avgR;
        ball.baseRadius = avgR;

        const area = ball.areaConstraint.calculateArea();
        ball.areaConstraint.restArea = area;
        ball.areaConstraint.baseRestArea = area;

        for (let i = 0; i < ball.distanceConstraints.length; i++) {
            const dc = ball.distanceConstraints[i];
            const dx = dc.p1.x - dc.p2.x;
            const dy = dc.p1.y - dc.p2.y;
            const len = Math.hypot(dx, dy);
            dc.restLength = len;
            dc.initialRestLength = len;
        }

        ball.fillAtRestBase = airToFillRatio(ball.air);
        ball.restVisualScale = visualScaleFromAir(ball.air);
        ball.areaConstraint.restArea = ball.areaConstraint.baseRestArea;
        for (let i = 0; i < ball.distanceConstraints.length; i++) {
            ball.distanceConstraints[i].restLength = ball.distanceConstraints[i].initialRestLength;
        }
    }

    function reshapeBallToCircle(ball, radius) {
        const pts = ball.particles;
        const n = pts.length;
        const cx = ball.cx;
        const cy = ball.cy;

        for (let i = 0; i < n; i++) {
            const angle = (i / n) * Math.PI * 2;
            pts[i].x = cx + Math.cos(angle) * radius;
            pts[i].y = cy + Math.sin(angle) * radius;
            pts[i].vx = 0;
            pts[i].vy = 0;
            pts[i].px = pts[i].x;
            pts[i].py = pts[i].y;
        }

        ball.radius = radius;
        ball.baseRadius = radius;
    }

    function localRelaxBall(ball, iterations) {
        for (let k = 0; k < iterations; k++) {
            const list = ball.solverConstraints;
            for (let i = 0; i < list.length; i++) list[i].solve();
        }
    }

    function clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
    }

    function estimateMeanBalloonRadius() {
        let sumScale = 0;
        const buckets = BASELINE_SPAWN.airBuckets;
        for (let i = 0; i < buckets.length; i++) {
            const mid = (buckets[i].min + buckets[i].max) * 0.5;
            sumScale += visualScaleFromAir(mid);
        }
        const meanScale = sumScale / buckets.length;
        return MIN_BALLOON_RADIUS * meanScale;
    }

    /**
     * @param balloonCountFactor 相对 baselineReferenceCount 的倍数；1 = 首关标准数量
     * @param allowStackAboveView factor>1 时允许行数超出可玩区（堆出画面）
     */
    function computeBalloonFillLayout(balloonCountFactor = 1, layoutRadiusScale = 1) {
        const playW = width - BALLOON_FIELD_PAD_X * 2;
        const playH = GROUND_Y - BALLOON_FIELD_PAD_TOP - BALLOON_FIELD_PAD_BOTTOM;
        const r = estimateMeanBalloonRadius() * clamp(layoutRadiusScale, 0.5, 1);
        const packGap = BALLOON_PACK_GAP * clamp(0.65 + layoutRadiusScale * 0.35, 0.65, 1);
        const pitchX = 2 * r + packGap;
        const pitchY = pitchX * (Math.sqrt(3) * 0.5);

        let cols = Math.max(1, Math.floor((playW - 2 * r) / pitchX) + 1);
        let rows = Math.max(1, Math.floor((playH - 2 * r) / pitchY) + 1);

        while (cols > 1 && (cols - 1) * pitchX + 2 * r > playW + 1) cols--;
        while (rows > 1 && (rows - 1) * pitchY + 2 * r > playH + 1) rows--;

        const gridCount = cols * rows;
        const referenceCount = Math.max(
            gridCount,
            Math.round(gridCount * BASELINE_SPAWN.countMultiplier)
        );
        const desiredCount = Math.max(1, Math.round(referenceCount * balloonCountFactor));
        let spawnRows = Math.ceil(desiredCount / cols);
        let count = desiredCount;
        if (balloonCountFactor <= 1) {
            spawnRows = Math.min(spawnRows, rows);
            count = Math.min(desiredCount, spawnRows * cols);
        }
        const spanX = cols > 1 ? (cols - 1) * pitchX : 0;
        const spanY = spawnRows > 1 ? (spawnRows - 1) * pitchY : 0;
        const originX = BALLOON_FIELD_PAD_X + (playW - spanX) * 0.5;
        const floorLine = floorLimitY();
        const originY = floorLine - r - spanY;

        return {
            count,
            referenceCount,
            balloonCountFactor,
            gridCount,
            cols,
            rows: spawnRows,
            rowsInView: rows,
            r,
            pitchX,
            pitchY,
            originX,
            originY
        };
    }

    function spawnBalloonsWithLayout(layout, level) {
        const rng = levelSpawnRng || makeSeededRng(level.seed || 1);
        const scatter = level.scatter ?? 0;
        const radiusScale = level.layoutRadiusScale ?? 1;
        const playW = width - BALLOON_FIELD_PAD_X * 2;
        const playTop = BALLOON_FIELD_PAD_TOP;
        const playBottom = floorLimitY() - layout.r;

        for (let i = 0; i < layout.count; i++) {
            const col = i % layout.cols;
            const row = Math.floor(i / layout.cols);
            const stagger = (row % 2) * (layout.pitchX * 0.5);
            let cx = layout.originX + col * layout.pitchX + stagger;
            let cy = layout.originY + row * layout.pitchY;

            if (scatter > 0.05) {
                const ampX = layout.pitchX * scatter * 0.55;
                const ampY = layout.pitchY * scatter * 0.5;
                cx += (rng() - 0.5) * 2 * ampX;
                cy += (rng() - 0.5) * 2 * ampY;
                if (scatter > 0.28 && rng() < scatter * 0.35) {
                    cx = BALLOON_FIELD_PAD_X + layout.r + rng() * (playW - 2 * layout.r);
                    cy = playTop + layout.r + rng() * Math.max(layout.r, playBottom - playTop - layout.r);
                }
            }

            const teamId = level.procedural
                ? pickSpawnTeamFromWeights(level, rng)
                : level.activeTeams[i % level.activeTeams.length];
            const { colorBase, colorLight } = pickTeamColor(teamId);
            const air = rollBaselineInitialAir(i);
            const seedRadius = MIN_BALLOON_RADIUS * radiusScale;
            createSoftBall(cx, cy, seedRadius, colorBase, colorLight);
            const ball = balls[balls.length - 1];
            ball.air = air;
            ball.labelLastCeil = Math.ceil(air);
            applyBallAirVisual(ball);
            const visualR = seedRadius * currentInflateScale(ball);
            reshapeBallToCircle(ball, visualR);
            localRelaxBall(ball, 10);
            syncBallRestState(ball);
            schedulePopIfEmpty(ball);
        }

        refreshBallCentroids();
        updateBallCount();
    }

    function loadLevelImmediate(idx, duringTransition = false) {
        levelIndex = Math.max(0, idx);
        const level = getLevelSpec(levelIndex);
        currentLevelSpec = level;
        levelSpawnRng = makeSeededRng(level.seed || (levelIndex + 1) * 131);
        clearWorld();
        if (!duringTransition) {
            gameOutcome = 'playing';
            levelTransitionCountdown = null;
            transitionFade = 0;
            levelTransitionDidLoad = false;
        }
        loseCountdown = null;
        winRevealCountdown = null;
        settlementButtons = { next: null, restart: null };
        selectedPumpIndex = 0;
        activeTeams = level.activeTeams.slice();
        layoutPumpHitRects();

        const layout = computeBalloonFillLayout(
            level.balloonCountFactor,
            level.layoutRadiusScale ?? 1
        );
        if (level.pump && level.pump.length === activeTeams.length) {
            pumpFuelRemaining = level.pump.slice();
        } else {
            pumpFuelRemaining = buildProceduralPump(level, layout);
        }
        if (isTutorialLevel(levelIndex)) {
            captureBaselineCounts(layout);
        }
        spawnBalloonsWithLayout(layout, level);
        resetOutcomeSound();
        updateLevelHud();
        if (!duringTransition && appScreen === 'game') saveProgress();
    }

    function advanceAfterWin() {
        scheduleLoadLevel(levelIndex + 1);
    }

    let dragNode = null;
    let pendingDragParticle = null;
    let activeInflateBall = null;
    let pointerDown = false;
    let pointerDownPos = { x: 0, y: 0 };
    let mouse = { x: 0, y: 0 };

    showStartScreen();
    updateStartMenuUI();

    if (btnStartPrimary) {
        btnStartPrimary.addEventListener('click', () => {

            enterGame(save ? save.levelIndex : 0);

    if (stageEl) {

        }, { passive: true });

    window.addEventListener('keydown', () => {
