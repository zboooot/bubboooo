<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>气球雨 · 9:20 · v1.15</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        :root {
            --stage-w: 360;
            --stage-h: 800;
            --bg-outer: #0f0f1a;
            --accent: #ff6b9d;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: var(--bg-outer);
            touch-action: none;
            font-family: "ZCOOL KuaiLe", system-ui, sans-serif;
        }

        #viewport {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 12px;
            background:
                radial-gradient(ellipse 80% 50% at 50% 0%, rgba(255, 107, 157, 0.12), transparent),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(0, 243, 255, 0.08), transparent),
                var(--bg-outer);
        }

        #stage {
            position: relative;
            aspect-ratio: 9 / 20;
            height: 100vh;
            max-height: 100dvh;
            max-width: calc(100dvh * 9 / 20);
            width: min(100vw, calc(100dvh * 9 / 20));
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.06),
                0 24px 80px rgba(0, 0, 0, 0.55);
            border-radius: clamp(12px, 2vw, 20px);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 14px 16px 36px;
            text-align: center;
            pointer-events: none;
            background: linear-gradient(
                180deg,
                rgba(8, 8, 18, 0.82) 0%,
                rgba(8, 8, 18, 0.5) 45%,
                rgba(8, 8, 18, 0.12) 78%,
                rgba(8, 8, 18, 0) 100%
            );
        }

        #hud span {
            color: var(--accent);
        }

        #levelHud {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.94);
            letter-spacing: 0.12em;
            margin-bottom: 2px;
            text-shadow: 0 1px 10px rgba(0, 0, 0, 0.55);
        }

        #levelHud .level-num {
            font-size: 150%;
            line-height: 1;
        }

        #hudSub {
            display: none;
        }

        #comboHud {
            position: absolute;
            top: 78px;
            right: 14px;
            pointer-events: none;
            text-align: right;
            opacity: 0;
            transform: scale(0.6) translateY(8px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        #comboHud.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        #comboHud.combo-pop {
            animation: comboPop 0.42s cubic-bezier(0.22, 1.15, 0.36, 1) forwards;
        }

        @keyframes comboPop {
            0% { transform: scale(0.55) translateY(10px); }
            45% { transform: scale(1.22) translateY(-4px); }
            100% { transform: scale(1) translateY(0); }
        }

        #comboHud .combo-prefix {
            display: block;
            font-size: 11px;
            letter-spacing: 0.2em;
            opacity: 0.75;
            margin-bottom: 2px;
        }

        #comboValue {
            display: block;
            font-size: 36px;
            font-weight: bold;
            line-height: 1;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.55);
        }

        /* 连爆数：白 0–5 / 绿 6–10 / 蓝 11–15 / 紫 16–25 / 橙 ≥26（字号为白档 3 倍） */
        #comboHud[data-tier="0"] #comboValue {
            color: rgba(255, 255, 255, 0.96);
            text-shadow: 0 2px 18px rgba(0, 0, 0, 0.65);
        }
        #comboHud[data-tier="1"] #comboValue {
            color: #4ade80;
            text-shadow: 0 0 18px rgba(74, 222, 128, 0.45);
        }
        #comboHud[data-tier="2"] #comboValue {
            color: #60a5fa;
            text-shadow: 0 0 20px rgba(96, 165, 250, 0.5);
        }
        #comboHud[data-tier="3"] #comboValue {
            color: #c084fc;
            text-shadow: 0 0 24px rgba(192, 132, 252, 0.55);
        }
        #comboHud[data-tier="4"] #comboValue {
            color: #fb923c;
            font-size: 108px;
            text-shadow: 0 0 32px rgba(251, 146, 60, 0.6);
        }
        #comboHud[data-tier="4"] .combo-prefix {
            font-size: 13px;
            opacity: 0.9;
        }
        #comboHud[data-tier="4"].combo-pop {
            animation: comboPopOrange 0.48s cubic-bezier(0.18, 1.2, 0.32, 1) forwards;
        }
        @keyframes comboPopOrange {
            0% { transform: scale(0.4) translateY(14px); }
            40% { transform: scale(1.15) translateY(-6px); }
            100% { transform: scale(1) translateY(0); }
        }

        #versionTag {
            position: absolute;
            bottom: 112px;
            right: 12px;
            pointer-events: none;
            color: rgba(255, 255, 255, 0.28);
            font-size: 11px;
            letter-spacing: 0.06em;
        }

        #startScreen {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(
                180deg,
                rgba(8, 8, 18, 0.94) 0%,
                rgba(12, 12, 24, 0.9) 55%,
                rgba(8, 8, 18, 0.92) 100%
            );
            pointer-events: auto;
        }

        #startScreen.hidden {
            display: none;
        }

        .start-actions {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 14px;
            width: min(232px, 78%);
        }

        .start-btn {
            font-family: "ZCOOL KuaiLe", system-ui, sans-serif;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 0.14em;
            padding: 15px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        .start-btn:active {
            transform: scale(0.97);
        }

        .start-btn-primary {
            color: #fff;
            background: linear-gradient(180deg, #ff6b9d 0%, #d91e48 100%);
            box-shadow: 0 8px 28px rgba(217, 30, 72, 0.35);
        }

        .start-btn-secondary {
            color: rgba(255, 255, 255, 0.92);
            background: rgba(255, 255, 255, 0.12);
        }

        .start-hint {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.72);
            letter-spacing: 0.1em;
            line-height: 1.55;
        }

        #debugPanel {
            flex: 0 0 auto;
            width: min(220px, 28vw);
            max-height: min(100dvh - 24px, 800px);
            overflow-y: auto;
            padding: 14px 12px;
            border-radius: 14px;
            background: rgba(18, 18, 32, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
            color: rgba(255, 255, 255, 0.88);
            font-size: 12px;
            letter-spacing: 0.04em;
        }

        #debugPanel h2 {
            margin: 0 0 12px;
            font-size: 15px;
            color: var(--accent);
            letter-spacing: 0.12em;
            font-weight: bold;
        }

        #debugPanel label {
            display: block;
            margin-bottom: 10px;
        }

        #debugPanel label span {
            display: block;
            margin-bottom: 4px;
            opacity: 0.75;
            font-size: 11px;
        }

        #debugPanel input,
        #debugPanel select {
            width: 100%;
            padding: 7px 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.35);
            color: #fff;
            font-family: inherit;
            font-size: 13px;
        }

        #btnOpenTestLab {
            width: 100%;
            margin-top: 6px;
            padding: 11px 10px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.1em;
            color: #fff;
            background: linear-gradient(180deg, #6b8cff 0%, #3b5bdb 100%);
            box-shadow: 0 6px 20px rgba(59, 91, 219, 0.35);
        }

        #btnOpenTestLab:active {
            transform: scale(0.98);
        }

        #btnRestartNormalGame {
            width: 100%;
            margin-top: 10px;
            padding: 11px 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.92);
            background: rgba(255, 255, 255, 0.12);
        }

        #btnRestartNormalGame:active {
            transform: scale(0.98);
        }

        @media (max-width: 520px) {
            #debugPanel {
                display: none;
            }
            #viewport {
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <div id="viewport">
        <div id="stage">
            <canvas id="physicsCanvas"></canvas>
            <div id="hud">
                <div id="levelHud">第 <span class="level-num">1</span> 关</div>
                <div id="hudSub">剩余 <span id="ballCount">0</span> 球</div>
            </div>
            <div id="comboHud" data-tier="0" aria-hidden="true">
                <span class="combo-prefix">连锁</span>
                <span id="comboValue">0</span>
            </div>
            <div id="startScreen" class="hidden">
                <div class="start-actions">
                    <button type="button" class="start-btn start-btn-primary" id="btnStartPrimary">开始游戏</button>
                    <button type="button" class="start-btn start-btn-secondary" id="btnStartRestart">重新开始</button>
                    <p class="start-hint">按住泡泡撑爆他</p>
                </div>
            </div>
            <div id="versionTag"></div>
        </div>
        <aside id="debugPanel" aria-label="测试参数">
            <h2>测试关卡</h2>
            <label>
                <span>普通气球数量</span>
                <input type="number" id="testBalloonCount" min="0" max="80" value="10">
            </label>
            <label>
                <span>小丑气球数量</span>
                <input type="number" id="testClownCount" min="0" max="20" value="1">
            </label>
            <label>
                <span>复制数量（最少）</span>
                <input type="number" id="testCopyMin" min="1" max="30" value="5">
            </label>
            <label>
                <span>复制数量（最多）</span>
                <input type="number" id="testCopyMax" min="1" max="30" value="10">
            </label>
            <label>
                <span>颜色种类</span>
                <input type="number" id="testTeamCount" min="2" max="8" value="3">
            </label>
            <label>
                <span>方块墙数量</span>
                <input type="number" id="testTetrisCount" min="0" max="8" value="1">
            </label>
            <label>
                <span>彩虹气球数量</span>
                <input type="number" id="testRainbowCount" min="0" max="8" value="1">
            </label>
            <label>
                <span>道具类型</span>
                <select id="testItemMode">
                    <option value="clown" selected>小丑气球</option>
                    <option value="tetris">俄罗斯方块墙</option>
                    <option value="ninja_dart">忍者飞镖</option>
                    <option value="rainbow">彩虹气球</option>
                    <option value="both">小丑 + 方块墙</option>
                    <option value="none">无道具</option>
                </select>
            </label>
            <button type="button" id="btnOpenTestLab">打开测试关卡</button>
            <button type="button" id="btnRestartNormalGame">重新开始游戏</button>
        </aside>
    </div>

<script type="module" src="js/main.js"></script>
</body>
</html>
