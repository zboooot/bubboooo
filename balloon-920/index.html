    });

    window.addEventListener('keydown', (e) => {
        if (appScreen !== 'game') return;
        if (e.key === 'r' || e.key === 'R') {
            if (gameOutcome === 'transition') return;
            scheduleLoadLevel(levelIndex);
        }
    });

    function screenToLogical(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: (clientX - rect.left) * (width / rect.width),
            y: (clientY - rect.top) * (height / rect.height)
        };
    }

    function pickBalloonAt(x, y) {
        if (isInPumpZone(y)) return null;
        for (let i = balls.length - 1; i >= 0; i--) {
            const pts = balls[i].particles;
            if (pointInPolygon(x, y, pts)) return balls[i];
            const c = polygonCentroid(pts);
            const dist = Math.hypot(x - c.x, y - c.y);
            if (dist < balls[i].radius * 1.05) return balls[i];
        }
        return null;
    }

    function startDrag(clientX, clientY) {
        if (appScreen !== 'game') return;
        Sfx.resume();
        const pos = screenToLogical(clientX, clientY);
        mouse.x = pos.x;
        mouse.y = pos.y;
        pointerDownPos.x = pos.x;
        pointerDownPos.y = pos.y;
        pointerDown = true;
        dragNode = null;
        pendingDragParticle = null;

        if (gameOutcome === 'transition') return;

        if (gameOutcome === 'won' || gameOutcome === 'lost') {
            if (gameOutcome === 'won' && hitSettlementButton(settlementButtons.next, mouse.x, mouse.y)) {
                advanceAfterWin();
                return;
            }
            if (hitSettlementButton(settlementButtons.restart, mouse.x, mouse.y)) {
                scheduleLoadLevel(levelIndex);
                return;
            }
            return;
        }

        if (isInPumpZone(mouse.y)) {
            const pumpIdx = pickPumpAt(mouse.x, mouse.y);
            if (pumpIdx >= 0) selectedPumpIndex = pumpIdx;
            return;
        }

        const hitBall = pickBalloonAt(mouse.x, mouse.y);
        if (hitBall) {
            const idx = selectPumpForBall(hitBall);
            if (idx >= 0 && pumpFuelRemaining[idx] > 0) {
                activeInflateBall = hitBall;
            } else {
                Sfx.playDenied();
            }
            return;
        }
        activeInflateBall = null;

        let minDist = 42;
        for (const p of particles) {
            const dist = Math.hypot(p.x - mouse.x, p.y - mouse.y);
            if (dist < minDist) {
                minDist = dist;
                pendingDragParticle = p;
            }
        }
    }

    function moveDrag(clientX, clientY) {
        const pos = screenToLogical(clientX, clientY);
        mouse.x = pos.x;
        mouse.y = pos.y;

        if (!pointerDown || activeInflateBall || dragNode || !pendingDragParticle) return;
        const moved = Math.hypot(mouse.x - pointerDownPos.x, mouse.y - pointerDownPos.y);
        if (moved >= DRAG_MOVE_THRESHOLD) {
            dragNode = pendingDragParticle;
            pendingDragParticle = null;
        }
    }

    function endDrag() {
        dragNode = null;
        pendingDragParticle = null;
        activeInflateBall = null;
        pointerDown = false;
    }

    function updateInflation() {
        inflatePumpActive = false;
        if (gameOutcome !== 'playing' || !pointerDown || !activeInflateBall) return;
        if (!balls.includes(activeInflateBall)) {
            activeInflateBall = null;
            return;
        }

        const ball = activeInflateBall;
        const pumpIdx = pumpSlotForBall(ball);
        if (pumpIdx < 0 || pumpFuelRemaining[pumpIdx] <= 0) {
            Sfx.playDenied();
            activeInflateBall = null;
            return;
        }

        const airBefore = ball.air;
        const fill = airToFillRatio(ball.air);
        const ease = Math.pow(Math.max(0, 1 - fill), 3.2);
        const speedFactor = Math.max(0.15, ease);
        const want = PUMP_AIR_RATE * speedFactor * dt;
        const used = Math.min(want, ball.air, pumpFuelRemaining[pumpIdx]);
        if (used <= 0) {
            Sfx.playDenied();
            activeInflateBall = null;
            return;
        }

        ball.air -= used;
        pumpFuelRemaining[pumpIdx] -= used;
        if (pumpFuelRemaining[pumpIdx] < 1e-6) pumpFuelRemaining[pumpIdx] = 0;

        inflatePumpActive = true;
        checkLevelLose();

        applyBallAirVisual(ball);
        bumpBallLabelOnAirTick(ball, airBefore);
        const airDelta = airBefore - ball.air;
        if (airDelta >= SHAKE_MIN_AIR_DELTA) {
            applyInflationShake(ball);
        }
        schedulePopIfEmpty(ball);
    }

    function updatePopEffects() {
        for (let i = popEffects.length - 1; i >= 0; i--) {
            const fx = popEffects[i];
            fx.life -= dt;
            if (fx.life <= 0) {
                popEffects.splice(i, 1);
                continue;
            }
            fx.x += fx.vx * dt;
            fx.y += fx.vy * dt;
            fx.vy += 420 * dt;
            fx.vx *= 0.98;
        }
    }

    canvas.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
    window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
    window.addEventListener('mouseup', endDrag);

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        startDrag(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });
    window.addEventListener('touchmove', (e) => {
        if (e.touches.length) moveDrag(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });
    window.addEventListener('touchend', endDrag);

    function polygonCentroid(poly) {
        let cx = 0;
        let cy = 0;
        for (let i = 0; i < poly.length; i++) {
            cx += poly[i].x;
            cy += poly[i].y;
        }
        return { x: cx / poly.length, y: cy / poly.length };
    }

    function pointInPolygon(px, py, poly) {
        let inside = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
            const xi = poly[i].x, yi = poly[i].y;
            const xj = poly[j].x, yj = poly[j].y;
            const intersects = ((yi > py) !== (yj > py)) &&
                (px < (xj - xi) * (py - yi) / ((yj - yi) || 1e-8) + xi);
            if (intersects) inside = !inside;
        }
        return inside;
    }

    function closestPointOnSegment(px, py, ax, ay, bx, by) {
        const abx = bx - ax;
        const aby = by - ay;
        const abLenSq = abx * abx + aby * aby;
        if (abLenSq < 1e-8) return { x: ax, y: ay, t: 0 };
        let t = ((px - ax) * abx + (py - ay) * aby) / abLenSq;
        t = Math.max(0, Math.min(1, t));
        return { x: ax + abx * t, y: ay + aby * t, t };
    }

    function getOutwardNormal(ax, ay, bx, by, centroid) {
        const ex = bx - ax;
        const ey = by - ay;
        let nx = -ey;
        let ny = ex;
        const mx = (ax + bx) * 0.5;
        const my = (ay + by) * 0.5;
        const toOutsideX = mx - centroid.x;
        const toOutsideY = my - centroid.y;
        if (nx * toOutsideX + ny * toOutsideY < 0) {
            nx = -nx;
            ny = -ny;
        }
        const len = Math.hypot(nx, ny) || 1;
        return { x: nx / len, y: ny / len };
    }

    function projectPointVsPolygon(point, poly, centroid, contactSlop) {
        let best = null;
        let bestDistSq = Infinity;

        for (let i = 0; i < poly.length; i++) {
            const j = (i + 1) % poly.length;
            const a = poly[i];
            const b = poly[j];
            const cp = closestPointOnSegment(point.x, point.y, a.x, a.y, b.x, b.y);
            const dx = point.x - cp.x;
            const dy = point.y - cp.y;
            const distSq = dx * dx + dy * dy;
            if (distSq < bestDistSq) {
                bestDistSq = distSq;
                best = { i, j, cp };
            }
        }

        if (!best) return;

        const a = poly[best.i];
        const b = poly[best.j];
        const normal = getOutwardNormal(a.x, a.y, b.x, b.y, centroid);
        const signedDist = (point.x - best.cp.x) * normal.x + (point.y - best.cp.y) * normal.y;
        const needInsideTest = bestDistSq < contactSlop * contactSlop * 16;
        const inside = needInsideTest && pointInPolygon(point.x, point.y, poly);
        const penetration = inside ? (contactSlop - signedDist) : Math.max(0, contactSlop - signedDist);
        if (penetration <= 0) return;

        const wp = point.invMass;
        const wa = a.invMass;
        const wb = b.invMass;
        const t = best.cp.t;
        const wA = wa * (1 - t);
        const wB = wb * t;
        const wSum = wp + wA + wB;
        if (wSum < 1e-8) return;

        const corrX = normal.x * penetration;
        const corrY = normal.y * penetration;

        point.x += corrX * (wp / wSum);
        point.y += corrY * (wp / wSum);
        a.x -= corrX * (wA / wSum);
        a.y -= corrY * (wA / wSum);
        b.x -= corrX * (wB / wSum);
        b.y -= corrY * (wB / wSum);
    }

    function solvePair(polyA, polyB, pairSeed, cAx, cAy, cBx, cBy) {
        const contactSlop = 2.0;
        const cA = { x: cAx, y: cAy };
        const cB = { x: cBx, y: cBy };
        const offsetA = (collisionPhase + pairSeed) % polyA.length;
        const offsetB = (collisionPhase + pairSeed * 3) % polyB.length;
        const flip = (collisionOrderFlip ^ (pairSeed & 1)) !== 0;

        if (!flip) {
            for (let i = 0; i < polyA.length; i++) {
                const idx = (offsetA + i) % polyA.length;
                projectPointVsPolygon(polyA[idx], polyB, cB, contactSlop);
            }
            for (let i = 0; i < polyB.length; i++) {
                const idx = (offsetB + i) % polyB.length;
                projectPointVsPolygon(polyB[idx], polyA, cA, contactSlop);
            }
        } else {
            for (let i = 0; i < polyB.length; i++) {
                const idx = (offsetB + i) % polyB.length;
                projectPointVsPolygon(polyB[idx], polyA, cA, contactSlop);
            }
            for (let i = 0; i < polyA.length; i++) {
                const idx = (offsetA + i) % polyA.length;
                projectPointVsPolygon(polyA[idx], polyB, cB, contactSlop);
            }
        }
    }

    function solveBallCollisions() {
        if (balls.length < 2) return;

        const reachPad = 28;
        for (let a = 0; a < balls.length; a++) {
            const ba = balls[a];
            for (let b = a + 1; b < balls.length; b++) {
                const bb = balls[b];
                const dx = ba.cx - bb.cx;
                const dy = ba.cy - bb.cy;
                const reach = ba.radius + bb.radius + reachPad;
                if (dx * dx + dy * dy > reach * reach) continue;
                solvePair(
                    ba.particles, bb.particles, a + b,
                    ba.cx, ba.cy, bb.cx, bb.cy
                );
            }
        }
        collisionOrderFlip = !collisionOrderFlip;
        collisionPhase++;
    }

    function updatePhysics() {
        const subdt = dt / numSubsteps;
        const padding = 5;
        const floorY = floorLimitY();

        for (let step = 0; step < numSubsteps; step++) {
            for (const p of particles) {
                if (p === dragNode) continue;
                p.vy += gravity.y * subdt;
                p.vx += gravity.x * subdt;
                p.px = p.x;
                p.py = p.y;
                p.x += p.vx * subdt;
                p.y += p.vy * subdt;
            }

            if (dragNode) {
                dragNode.x = mouse.x;
                dragNode.y = mouse.y;
                dragNode.px = mouse.x;
                dragNode.py = mouse.y;
            }

            refreshBallCentroids();

            for (let iter = 0; iter < pbdIterations; iter++) {
                solveBallConstraints();

                for (const p of particles) {
                    if (p.y > floorY) p.y = floorY;
                    if (p.x > width - padding) p.x = width - padding;
                    if (p.x < padding) p.x = padding;
                }
            }

            solveBallCollisions();

            for (const p of particles) {
                if (p.y > floorY) p.y = floorY;
                if (p.x > width - padding) p.x = width - padding;
                if (p.x < padding) p.x = padding;
            }

            for (const p of particles) {
                if (p === dragNode) {
                    p.vx = 0;
                    p.vy = 0;
                    continue;
                }

                p.vx = (p.x - p.px) / subdt;
                p.vy = (p.y - p.py) / subdt;

                if (p.y >= floorY - 0.01 && p.vy > 0) {
                    p.vy = -p.vy * 0.1;
                    p.vx *= 0.8;
                }
                if (p.x <= 5.01 || p.x >= width - 5.01) {
                    p.vx = -p.vx * 0.1;
                    p.vy *= 0.8;
                }

                p.vx *= 0.999;
                p.vy *= 0.999;
            }

            if (step === numSubsteps - 1) {
                const driftBlend = 0.02;
                const driftSpeedThreshold = 40;
                const driftMeanVxThreshold = 8;
                for (let b = 0; b < balls.length; b++) {
                    const pts = balls[b].particles;
                    let hasDragNode = false;
                    for (let i = 0; i < pts.length; i++) {
                        if (pts[i] === dragNode) {
                            hasDragNode = true;
                            break;
                        }
                    }
                    if (hasDragNode) continue;

                    let sumVx = 0;
                    let sumVy = 0;
                    for (let i = 0; i < pts.length; i++) {
                        sumVx += pts[i].vx;
                        sumVy += pts[i].vy;
                    }
                    const meanVx = sumVx / pts.length;
                    const meanVy = sumVy / pts.length;
                    const meanSpeed = Math.hypot(meanVx, meanVy);

                    if (meanSpeed > driftSpeedThreshold || Math.abs(meanVx) > driftMeanVxThreshold) continue;

                    for (let i = 0; i < pts.length; i++) {
                        pts[i].vx -= meanVx * driftBlend;
                    }
                }
            }
        }
        refreshBallCentroids();
    }

    const bgCanvas = document.createElement('canvas');
    bgCanvas.width = width;
    bgCanvas.height = height;
    const bgCtx = bgCanvas.getContext('2d');
    (function paintStaticBackground() {
        const g = bgCtx.createLinearGradient(0, 0, 0, height);
        g.addColorStop(0, '#2a1f4e');
        g.addColorStop(0.45, '#1a1a2e');
        g.addColorStop(1, '#12121f');
        bgCtx.fillStyle = g;
        bgCtx.fillRect(0, 0, width, height);
        bgCtx.fillStyle = 'rgba(255, 255, 255, 0.03)';
        for (let i = 0; i < 24; i++) {
            const sx = (i * 97) % width;
            const sy = (i * 131) % height;
            bgCtx.beginPath();
            bgCtx.arc(sx, sy, 1.2, 0, Math.PI * 2);
            bgCtx.fill();
        }
    })();

    function drawBackground() {
        ctx.drawImage(bgCanvas, 0, 0);
    }

    function drawTransitionFade() {
        if (gameOutcome !== 'transition' && transitionFade <= 0) return;
        const a = Math.min(1, Math.max(0, transitionFade)) * 0.92;
        if (a <= 0.001) return;
        ctx.fillStyle = `rgba(8, 8, 18, ${a})`;
        ctx.fillRect(0, 0, width, height);
    }

    function draw() {
        drawBackground();

        for (const ball of balls) {
            const pts = ball.particles;
            if (!pts.length) continue;

            const cx = ball.cx;
            const cy = ball.cy;

            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
            ctx.closePath();

            const grad = ctx.createRadialGradient(
                cx - ball.radius * 0.3, cy - ball.radius * 0.3, ball.radius * 0.1,
                cx, cy, ball.radius * 1.1
            );
            grad.addColorStop(0, ball.colorLight);
            grad.addColorStop(1, ball.colorBase);

            ctx.fillStyle = grad;
            ctx.fill();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
            ctx.beginPath();
            ctx.ellipse(
                cx - ball.radius * 0.4, cy - ball.radius * 0.4,
                ball.radius * 0.22, ball.radius * 0.13, -Math.PI / 4, 0, Math.PI * 2
            );
            ctx.fill();

            drawBallAirLabel(ball, cx, cy);
        }

        for (const fx of popEffects) {
            const alpha = Math.max(0, fx.life / fx.maxLife);
            const r = parseInt(fx.color.slice(1, 3), 16);
            const g = parseInt(fx.color.slice(3, 5), 16);
            const b = parseInt(fx.color.slice(5, 7), 16);
            ctx.beginPath();
            ctx.arc(fx.x, fx.y, fx.size * alpha, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
            ctx.fill();
        }

        if (activeInflateBall && balls.includes(activeInflateBall)) {
            const pts = activeInflateBall.particles;
            const c = polygonCentroid(pts);
            ctx.beginPath();
            ctx.arc(c.x, c.y, activeInflateBall.radius * 1.08, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 255, 255, ${0.25 + activeInflateBall.inflate * 0.5})`;
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 6]);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        if (dragNode) {
            ctx.beginPath();
            ctx.moveTo(dragNode.x, dragNode.y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.fill();
        }

        drawPumpDock();
        drawSettlementOverlay();
        drawTransitionFade();
    }

    function drawSettlementOverlay() {
        if (gameOutcome !== 'won' && gameOutcome !== 'lost') {
            settlementButtons = { next: null, restart: null };
            return;
        }
        ctx.save();
        ctx.fillStyle = 'rgba(8, 8, 18, 0.58)';
        ctx.fillRect(0, 0, width, GROUND_Y);

        const level = currentLevelSpec || getLevelSpec(levelIndex);
        const isWin = gameOutcome === 'won';
        const panelW = Math.min(300, width - 36);
        const panelH = isWin ? 168 : 156;
        const px = (width - panelW) * 0.5;
        const py = GROUND_Y * 0.4 - panelH * 0.5;
        ctx.fillStyle = 'rgba(22, 24, 38, 0.96)';
        strokeRoundRect(px, py, panelW, panelH, 14);
        ctx.fill();
        ctx.strokeStyle = isWin ? 'rgba(255, 255, 255, 0.22)' : 'rgba(255, 120, 120, 0.35)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.textAlign = 'center';
        ctx.fillStyle = isWin ? 'rgba(255, 255, 255, 0.95)' : 'rgba(255, 180, 190, 0.98)';
        ctx.font = 'bold 22px "ZCOOL KuaiLe", system-ui, sans-serif';
        ctx.fillText(isWin ? '过关！' : '失败', width * 0.5, py + 38);
        ctx.font = '14px "ZCOOL KuaiLe", system-ui, sans-serif';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
        const sub = isWin
            ? (level ? level.title : '')
            : '已无法过关（某色气筒用尽或无法再打爆任何气球）';
        ctx.fillText(sub, width * 0.5, py + 62);

        const btnH = 38;
        const by = py + panelH - btnH - 22;

        function drawBtn(x, w, label, primary) {
            if (primary) {
                const grad = ctx.createLinearGradient(x, by, x, by + btnH);
                grad.addColorStop(0, isWin ? '#ff6b9d' : '#6b8cff');
                grad.addColorStop(1, isWin ? '#d91e48' : '#3b5bdb');
                ctx.fillStyle = grad;
            } else {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.14)';
            }
            strokeRoundRect(x, by, w, btnH, 10);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.lineWidth = 1.2;
            ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 15px "ZCOOL KuaiLe", system-ui, sans-serif';
            ctx.fillText(label, x + w * 0.5, by + btnH * 0.62);
            return { x, y: by, w, h: btnH };
        }

        settlementButtons.next = null;
        if (isWin) {
            const btnW = 118;
            const gap = 14;
            const totalBtnW = btnW * 2 + gap;
            const bx0 = (width - totalBtnW) * 0.5;
            const nextLabel = '下一关';
            settlementButtons.restart = drawBtn(bx0, btnW, '重新开始', false);
            settlementButtons.next = drawBtn(bx0 + btnW + gap, btnW, nextLabel, true);
        } else {
            const btnW = 168;
            const bx = (width - btnW) * 0.5;
            settlementButtons.restart = drawBtn(bx, btnW, '重新开始', true);
        }
        ctx.restore();
    }

    layoutPumpHitRects();

    function loop() {
        simTime += dt;
        updateInflation();
        const pumpInflate = activeInflateBall && balls.includes(activeInflateBall)
            ? activeInflateBall.inflate
            : 0;
        Sfx.updatePump(pumpInflate, dt, inflatePumpActive);
        updateBallLabelAnims();
        updateComboHud();
        updatePhysics();
        updateImminentPops();
        processChainPops();
        checkLevelLose();
        updateLoseCountdown();
        updateWinRevealCountdown();
        updateLevelTransition();
        updatePopEffects();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>
