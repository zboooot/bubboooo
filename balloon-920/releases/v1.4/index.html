    class Particle {
        constructor(x, y, mass) {
            this.x = x;
            this.y = y;
            this.px = x;
            this.py = y;
            this.vx = 0;
            this.vy = 0;
            this.mass = mass;
            this.invMass = mass > 0 ? 1 / mass : 0;
        }
    }

    class DistanceConstraint {
        constructor(p1, p2, stiffness = 1.0) {
            this.p1 = p1;
            this.p2 = p2;
            const dx = p1.x - p2.x;
            const dy = p1.y - p2.y;
            this.restLength = Math.hypot(dx, dy);
            this.initialRestLength = this.restLength;
            this.stiffness = stiffness;
            this.baseStiffness = stiffness;
        }

        solve() {
            const dx = this.p1.x - this.p2.x;
            const dy = this.p1.y - this.p2.y;
            const d = Math.hypot(dx, dy);
            if (d === 0) return;

            const diff = (d - this.restLength) / d;
            const w1 = this.p1.invMass;
            const w2 = this.p2.invMass;
            const w = w1 + w2;
            if (w === 0) return;

            const corrX = dx * diff * this.stiffness / w;
            const corrY = dy * diff * this.stiffness / w;

            this.p1.x -= corrX * w1;
            this.p1.y -= corrY * w1;
            this.p2.x += corrX * w2;
            this.p2.y += corrY * w2;
        }
    }

    class AreaConstraint {
        constructor(particles, stiffness = 1.0) {
            this.particles = particles;
            this.stiffness = stiffness;
            this.restArea = this.calculateArea();
            this.baseRestArea = this.restArea;
        }

        calculateArea() {
            let area = 0;
            const N = this.particles.length;
            for (let i = 0; i < N; i++) {
                const p = this.particles[i];
                const pNext = this.particles[(i + 1) % N];
                area += (p.x * pNext.y - pNext.x * p.y);
            }
            return 0.5 * area;
        }

        solve() {
            const N = this.particles.length;
            const currentArea = this.calculateArea();
            const deltaArea = currentArea - this.restArea;

            let sumWGrad2 = 0;
            const gradients = new Array(N);

            for (let i = 0; i < N; i++) {
                const pNext = this.particles[(i + 1) % N];
                const pPrev = this.particles[(i - 1 + N) % N];
                gradients[i] = {
                    x: 0.5 * (pNext.y - pPrev.y),
                    y: 0.5 * (pPrev.x - pNext.x)
                };
                const w = this.particles[i].invMass;
                sumWGrad2 += w * (gradients[i].x ** 2 + gradients[i].y ** 2);
            }

            if (sumWGrad2 < 0.00001) return;

            const lambda = -deltaArea / sumWGrad2 * this.stiffness;

            for (let i = 0; i < N; i++) {
                const p = this.particles[i];
                const w = p.invMass;
                p.x += lambda * w * gradients[i].x;
                p.y += lambda * w * gradients[i].y;
            }
        }
    }

    function paletteTeam(teamIndex) {
        return TEAM_PALETTE[teamIndex] || TEAM_PALETTE[0];
    }

    function pickTeamColor(teamIndex = -1) {
        if (teamIndex >= 0) return paletteTeam(teamIndex);
        return paletteTeam(activeTeams[Math.floor(Math.random() * activeTeams.length)] || 0);

    function paletteIndexForColor(colorBase) {
        for (let i = 0; i < TEAM_PALETTE.length; i++) {
            if (TEAM_PALETTE[i].colorBase === colorBase) return i;
        }
        return -1;
    }

    function pumpSlotForPaletteTeam(paletteIdx) {
        for (let i = 0; i < activeTeams.length; i++) {
            if (activeTeams[i] === paletteIdx) return i;
        }

    }

    function pumpSlotForBall(ball) {
        return pumpSlotForPaletteTeam(paletteIndexForColor(ball.colorBase));

    function floorLimitY() {

    function isInPumpZone(y) {

    function pumpFuelForBall(ball) {
        const slot = pumpSlotForBall(ball);
        if (slot < 0) return 0;
        return pumpFuelRemaining[slot];
    }

    function canPumpBall(ball) {
        return pumpFuelForBall(ball) > 0;
    }

    function selectPumpForBall(ball) {
        const slot = pumpSlotForBall(ball);
        if (slot >= 0) selectedPumpIndex = slot;
        return slot;

    function layoutPumpHitRects() {
        pumpHitRects.length = 0;
        const n = activeTeams.length;
        if (n === 0) return;
        const dockTop = GROUND_Y + 6;
        const dockInnerH = PUMP_ZONE_HEIGHT - 12;
        const cols = n <= 3 ? n : (n === 4 ? 4 : 3);
        const rows = Math.ceil(n / cols);
        const gap = n >= 6 ? 8 : (n >= 4 ? 10 : 16);
        const maxRowW = width - 20;
        const iconW = Math.min(72, Math.floor((maxRowW - gap * (cols - 1)) / cols));
        const iconH = rows > 1
            ? Math.min(44, Math.floor((dockInnerH - gap * (rows - 1)) / rows))
            : Math.min(78, dockInnerH - 4);
        const rowWidths = [];
        for (let r = 0; r < rows; r++) {
            const countInRow = Math.min(cols, n - r * cols);
            rowWidths.push(countInRow * iconW + (countInRow - 1) * gap);
        }
        let slot = 0;
        for (let r = 0; r < rows; r++) {
            const countInRow = Math.min(cols, n - r * cols);
            const rowW = rowWidths[r];
            const startX = (width - rowW) * 0.5;
            const y = dockTop + r * (iconH + gap);
            for (let c = 0; c < countInRow; c++) {
                pumpHitRects.push({
                    index: slot,
                    x: startX + c * (iconW + gap),
                    y,
                    w: iconW,
                    h: iconH
                });
                slot++;
            }
        }
    }

    function pickPumpAt(x, y) {
        for (let i = 0; i < pumpHitRects.length; i++) {
            const r = pumpHitRects[i];
            if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r.index;
        }
        return -1;
    }

    function strokeRoundRect(x, y, w, h, r) {
        const rr = Math.min(r, w * 0.5, h * 0.5);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.lineTo(x + w - rr, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
        ctx.lineTo(x + w, y + h - rr);
        ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
        ctx.lineTo(x + rr, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
        ctx.lineTo(x, y + rr);
        ctx.quadraticCurveTo(x, y, x + rr, y);
        ctx.closePath();
    }

    function drawPumpIcon(x, y, w, h, tool, index, selected, fuelRemaining) {
        const empty = fuelRemaining <= 0;
        const cx = x + w * 0.4;
        const baseY = y + h - 9;
        const barrelW = w * 0.3;
        const barrelH = h * 0.46;
        const barrelTop = baseY - barrelH - 3;
        const metal = '#8b93a8';
        const metalDark = '#4d5568';

        ctx.save();
        if (empty) ctx.globalAlpha = 0.42;
        if (selected && !empty) {
            ctx.shadowColor = tool.colorLight;
            ctx.shadowBlur = 10;
        }

        ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
        strokeRoundRect(x + 2, y + 3, w - 4, h - 6, 10);
        ctx.fill();

        ctx.fillStyle = 'rgba(35, 38, 52, 0.95)';
        ctx.beginPath();
        ctx.ellipse(cx, baseY, barrelW * 0.72, 5.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = metalDark;
        ctx.lineWidth = 1;
        ctx.stroke();

        const barrelGrad = ctx.createLinearGradient(cx - barrelW * 0.5, barrelTop, cx + barrelW * 0.5, barrelTop);
        barrelGrad.addColorStop(0, tool.colorBase);
        barrelGrad.addColorStop(0.45, tool.colorLight);
        barrelGrad.addColorStop(1, tool.colorBase);
        ctx.fillStyle = barrelGrad;
        strokeRoundRect(cx - barrelW * 0.5, barrelTop, barrelW, barrelH, barrelW * 0.35);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.28)';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
        strokeRoundRect(cx - barrelW * 0.34, barrelTop + 4, barrelW * 0.1, barrelH - 10, 2);
        ctx.fill();

        const stemW = barrelW * 0.34;
        const stemH = 7;
        const handleY = barrelTop - stemH;
        ctx.fillStyle = metalDark;
        strokeRoundRect(cx - stemW * 0.5, handleY, stemW, stemH, 3);
        ctx.fill();
        ctx.fillStyle = metal;
        strokeRoundRect(cx - barrelW * 0.95, handleY - 5, barrelW * 1.9, 5, 2.5);
        ctx.fill();

        const hoseX0 = cx + barrelW * 0.42;
        const hoseY0 = barrelTop + barrelH * 0.58;
        const nozzleX = x + w - 10;
        const nozzleY = baseY - 14;
        ctx.strokeStyle = tool.colorBase;
        ctx.lineWidth = 4.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(hoseX0, hoseY0);
        ctx.bezierCurveTo(cx + w * 0.35, hoseY0 - 2, x + w * 0.55, nozzleY + 6, nozzleX - 4, nozzleY);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(hoseX0, hoseY0 - 1);
        ctx.bezierCurveTo(cx + w * 0.35, hoseY0 - 3, x + w * 0.55, nozzleY + 4, nozzleX - 4, nozzleY - 1);
        ctx.stroke();

        ctx.fillStyle = metal;
        ctx.beginPath();
        ctx.arc(nozzleX, nozzleY, 4.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = metalDark;
        ctx.beginPath();
        ctx.arc(nozzleX + 1.5, nozzleY, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = selected ? 'rgba(255, 255, 255, 0.95)' : 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = selected ? 2.5 : 1.5;
        strokeRoundRect(x + 2, y + 3, w - 4, h - 6, 10);
        ctx.stroke();

        ctx.shadowBlur = 0;
        const num = empty ? '0' : String(Math.max(0, Math.ceil(fuelRemaining)));
        const labelY = barrelTop + barrelH * 0.52;
        const fontSize = Math.max(14, Math.min(20, barrelW * 0.95));
        ctx.font = `bold ${fontSize}px "ZCOOL KuaiLe", system-ui, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.55)';
        ctx.fillStyle = empty ? 'rgba(255, 255, 255, 0.6)' : 'rgba(255, 255, 255, 0.98)';
        ctx.strokeText(num, cx, labelY);
        ctx.fillText(num, cx, labelY);
        ctx.restore();
    }

    function drawPumpDock() {
        const dockGrad = ctx.createLinearGradient(0, GROUND_Y, 0, height);
        dockGrad.addColorStop(0, 'rgba(18, 18, 32, 0.92)');
        dockGrad.addColorStop(1, 'rgba(8, 8, 16, 0.98)');

        ctx.fillRect(0, GROUND_Y, width, PUMP_ZONE_HEIGHT);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y + 0.5);
        ctx.lineTo(width, GROUND_Y + 0.5);
        ctx.stroke();

        layoutPumpHitRects();
        for (let i = 0; i < activeTeams.length; i++) {
            const r = pumpHitRects[i];
            if (!r) continue;
            const tool = paletteTeam(activeTeams[i]);
            drawPumpIcon(
                r.x, r.y, r.w, r.h, tool, i,
                selectedPumpIndex === i, pumpFuelRemaining[i] ?? 0
            );
        }
    }

    function createSoftBall(cx, cy, radius, colorBase, colorLight, initialVelocity = null) {
        const N = PARTICLES_PER_BALLOON;
        const ballParticles = [];

        for (let i = 0; i < N; i++) {
            const angle = (i / N) * Math.PI * 2;
            const px = cx + Math.cos(angle) * radius;
            const py = cy + Math.sin(angle) * radius;
            const p = new Particle(px, py, 1.0);
            if (initialVelocity) {
                p.vx = initialVelocity.vx;
                p.vy = initialVelocity.vy;
            }
            ballParticles.push(p);
            particles.push(p);
        }

        const distanceConstraints = [];
        for (let i = 0; i < N; i++) {
            const c1 = new DistanceConstraint(ballParticles[i], ballParticles[(i + 1) % N], 1.0);
            const c2 = new DistanceConstraint(ballParticles[i], ballParticles[(i + 2) % N], 0.8);
            constraints.push(c1, c2);
            distanceConstraints.push(c1, c2);
        }
        const areaConstraint = new AreaConstraint(ballParticles, 1.0);
        constraints.push(areaConstraint);

        const solverConstraints = distanceConstraints.concat([areaConstraint]);

        balls.push({
            particles: ballParticles,
            radius,
            baseRadius: radius,
            colorBase,
            colorLight,
            inflate: 0,
            fillAtRestBase: 0,
            restVisualScale: 1,
            air: AIR_CAPACITY,
            imminentPopDelay: null,
            distanceConstraints,
            areaConstraint,
            solverConstraints,
            cx,
            cy
        });
    }

    function refreshBallCentroids() {
        for (let b = 0; b < balls.length; b++) {
            const ball = balls[b];
            const pts = ball.particles;
            let cx = 0;
            let cy = 0;
            for (let i = 0; i < pts.length; i++) {
                cx += pts[i].x;
                cy += pts[i].y;
            }
            ball.cx = cx / pts.length;
            ball.cy = cy / pts.length;
        }
    }

    function solveBallConstraints() {
        if (!constraintOrderFlip) {
            for (let b = 0; b < balls.length; b++) {
                const list = balls[b].solverConstraints;
                for (let i = 0; i < list.length; i++) list[i].solve();
            }
        } else {
            for (let b = balls.length - 1; b >= 0; b--) {
                const list = balls[b].solverConstraints;
                for (let i = list.length - 1; i >= 0; i--) list[i].solve();
            }
        }
        constraintOrderFlip = !constraintOrderFlip;
    }

    function airToFillRatio(air) {
        const clamped = Math.max(0, Math.min(AIR_CAPACITY, air));
        return 1 - clamped / AIR_CAPACITY;
    }

    function smallBalloonRadiusMul(air) {
        if (air <= SMALL_BALLOON_AIR_START) return 1;
        if (air >= SMALL_BALLOON_AIR_END) return SMALL_BALLOON_RADIUS_MUL_AT_MAX_AIR;
        const t = (air - SMALL_BALLOON_AIR_START) / (SMALL_BALLOON_AIR_END - SMALL_BALLOON_AIR_START);
        return 1 - 0.4 * t;
    }

    function visualScaleFromAir(air) {
        const fill = airToFillRatio(air);
        const baseScale = 1 + fill * (INFLATE_MAX_SCALE - 1);
        return baseScale * smallBalloonRadiusMul(air);
    }

    function currentInflateScale(ball) {
        return visualScaleFromAir(ball.air);
    }

    function applyBallAirVisual(ball) {
        ball.inflate = airToFillRatio(ball.air);
        applyInflationTargets(ball);
    }

    function schedulePopIfEmpty(ball) {
        if (ball.air > 0) return;
        if (ball.imminentPopDelay == null) ball.imminentPopDelay = FULL_POP_DELAY;
    }

    function randomInitialAir() {
        return 12 + Math.floor(Math.random() * 89);
    }

    function updateImminentPops() {
        for (let i = balls.length - 1; i >= 0; i--) {
            const ball = balls[i];
            if (ball.imminentPopDelay == null) continue;
            ball.imminentPopDelay -= dt;
            if (ball.imminentPopDelay <= 0) {
                ball.imminentPopDelay = null;
                refreshBallCentroids();
                for (let bi = 0; bi < balls.length; bi++) syncBallBounds(balls[bi]);
                popBalloon(ball);
            }
        }
    }

    function applyInflationTargets(ball) {
        const targetScale = visualScaleFromAir(ball.air);
        const baseScale = ball.restVisualScale || targetScale;
        const rel = baseScale > 1e-6 ? targetScale / baseScale : targetScale;
        const areaScale = rel * rel;
        ball.areaConstraint.restArea = ball.areaConstraint.baseRestArea * areaScale;
        for (const dc of ball.distanceConstraints) {
            dc.restLength = dc.initialRestLength * rel;
        }
        ball.radius = ball.baseRadius * rel;

        const wobble = ball.inflate * ball.inflate;
        const pumping = activeInflateBall === ball;
        if (pumping) {
            const pulse = Math.sin(simTime * (8 + wobble * 28)) * wobble;
            ball.areaConstraint.stiffness = Math.max(0.35, 1 - wobble * 0.55 + pulse * 0.2);
            for (const dc of ball.distanceConstraints) {
                dc.stiffness = dc.baseStiffness * Math.max(0.4, 1 - wobble * 0.45);
            }
        } else {
            ball.areaConstraint.stiffness = Math.max(0.65, 1 - wobble * 0.25);
            for (const dc of ball.distanceConstraints) {
                dc.stiffness = dc.baseStiffness * Math.max(0.65, 1 - wobble * 0.2);
            }
        }
    }

    function applyInflationShake(ball) {
        if (ball.inflate <= 0.12) return;
        const pts = ball.particles;
        const c = polygonCentroid(pts);
        const wobble = ball.inflate * ball.inflate;
        const mag = (6 + wobble * 220) * dt;
        const spin = simTime * (14 + wobble * 40);

        for (let i = 0; i < pts.length; i++) {
            const p = pts[i];
            const nx = p.x - c.x;
            const ny = p.y - c.y;
            const len = Math.hypot(nx, ny) || 1;
            const tx = -ny / len;
            const ty = nx / len;
            const wave = Math.sin(spin + i * 0.85) * wobble;
            p.vx += tx * wave * mag + (Math.random() - 0.5) * mag * 1.6;
            p.vy += ty * wave * mag + (Math.random() - 0.5) * mag * 1.6;
        }
    }

    function resetChainPopState() {
        chainPopQueue = [];
        chainPopVisited = null;
        chainPopAccum = 0;
    }

    function ensureChainVisited() {
        if (!chainPopVisited) chainPopVisited = new Set();
    }

    function syncBallBounds(ball) {
        const pts = ball.particles;
        let cx = 0;
        let cy = 0;
        for (let i = 0; i < pts.length; i++) {
            cx += pts[i].x;
            cy += pts[i].y;
        }
        cx /= pts.length;
        cy /= pts.length;
        let maxR = 0;
        for (let i = 0; i < pts.length; i++) {
            const r = Math.hypot(pts[i].x - cx, pts[i].y - cy);
            if (r > maxR) maxR = r;
        }
        ball.cx = cx;
        ball.cy = cy;
        ball.boundsRadius = maxR;
        return ball;
    }

    function minParticleGap(ballA, ballB) {
        const pa = ballA.particles;
        const pb = ballB.particles;
        let best = Infinity;
        for (let i = 0; i < pa.length; i++) {
            const ax = pa[i].x;
            const ay = pa[i].y;
            for (let j = 0; j < pb.length; j++) {
                const d = Math.hypot(ax - pb[j].x, ay - pb[j].y);
                if (d < best) best = d;
            }
        }
        return best;
    }

    function ballsPhysicallyTouch(ballA, ballB) {
        if (minParticleGap(ballA, ballB) <= CHAIN_PARTICLE_TOUCH) return true;
        syncBallBounds(ballA);
        syncBallBounds(ballB);
        const dist = Math.hypot(ballA.cx - ballB.cx, ballA.cy - ballB.cy);
        return dist <= ballA.boundsRadius + ballB.boundsRadius + CHAIN_PARTICLE_TOUCH * 0.5;
    }

    function getTouchingSameColorNeighbors(ball) {
        syncBallBounds(ball);
        const neighbors = [];
        for (let i = 0; i < balls.length; i++) {
            const other = balls[i];
            if (other === ball || other.colorBase !== ball.colorBase) continue;
            if (!ballsPhysicallyTouch(ball, other)) continue;
            neighbors.push({ ball: other, gap: minParticleGap(ball, other) });
        }
        neighbors.sort((a, b) => a.gap - b.gap);
        return neighbors.map((n) => n.ball);
    }

    function enqueueChainNeighbors(ball, neighbors) {
        ensureChainVisited();
        for (let i = 0; i < neighbors.length; i++) {
            const n = neighbors[i];
            if (!balls.includes(n) || chainPopVisited.has(n)) continue;
            chainPopVisited.add(n);
            chainPopQueue.push(n);
        }
    }

    function processChainPops() {
        if (!chainPopQueue.length) return;
        chainPopAccum += dt;
        if (chainPopAccum < CHAIN_POP_INTERVAL) return;
        chainPopAccum -= CHAIN_POP_INTERVAL;

        const next = chainPopQueue.shift();
        if (next && balls.includes(next)) popBalloon(next, true);
    }

    function spawnPopEffect(ball) {
        const c = polygonCentroid(ball.particles);
        for (let i = 0; i < 18; i++) {
            const a = Math.random() * Math.PI * 2;
            const sp = 80 + Math.random() * 260;
            popEffects.push({
                x: c.x,
                y: c.y,
                vx: Math.cos(a) * sp,
                vy: Math.sin(a) * sp,
                life: 0.55 + Math.random() * 0.35,
                maxLife: 1,
                color: ball.colorLight,
                size: 2 + Math.random() * 4
            });
        }
    }

    function popBalloon(ball, fromChain = false) {
        if (!balls.includes(ball)) return;

        if (!fromChain) resetChainPopState();
        ensureChainVisited();
        chainPopVisited.add(ball);

        const neighbors = getTouchingSameColorNeighbors(ball);
        spawnPopEffect(ball);
        const idx = balls.indexOf(ball);
        if (idx >= 0) destroyBall(idx);
        updateBallCount();
        enqueueChainNeighbors(ball, neighbors);
        checkLevelWin();
    }

    function updateBallCount() {
        ballCountEl.textContent = String(balls.length);
    }

    function updateLevelHud() {
        const level = LEVELS[levelIndex];
        if (!levelHudEl || !level) return;
        const phaseHint = spawnPhase === 'observe' ? ' · 观察'
            : spawnPhase === 'spawning' ? ' · 入场' : '';
        levelHudEl.textContent = `${level.title} (${levelIndex + 1}/${LEVELS.length})${phaseHint}`;
    }

    function auditLevelBalance(level) {
        const needByPalette = new Array(TEAM_PALETTE.length).fill(0);
        for (const b of level.balloons) needByPalette[b.team] += b.air;
        const rows = [];
        for (let s = 0; s < level.activeTeams.length; s++) {
            const team = level.activeTeams[s];
            const need = needByPalette[team];
            const pump = level.pump[s];
            rows.push({
                team,
                need,
                pump,
                ok: pump >= need,
                slack: need > 0 ? (pump - need) / need : 0
            });
        }
        return rows;
    }

    function gridCentroidForSpec(spec, layout) {
        const col = spec.col;
        const row = spec.row;
        const stagger = (row % 2) * (layout.pitchX * 0.5);
        const cx = layout.originX + col * layout.pitchX + stagger;
        const cy = layout.originY + row * layout.pitchY;
        return { cx, cy };
    }

    function spawnOneBalloonSpec(spec, layout) {
        const { cx, cy } = gridCentroidForSpec(spec, layout);
        const team = paletteTeam(spec.team);
        const seedRadius = MIN_BALLOON_RADIUS;
        createSoftBall(cx, cy, seedRadius, team.colorBase, team.colorLight);
        const ball = balls[balls.length - 1];
        ball.air = spec.air;
        applyBallAirVisual(ball);
        const visualR = seedRadius * currentInflateScale(ball);
        reshapeBallToCircle(ball, visualR);
        localRelaxBall(ball, 10);
        syncBallRestState(ball);
        schedulePopIfEmpty(ball);
    }

    function clearSimulationEntities() {
        particles.length = 0;
        constraints.length = 0;
        balls.length = 0;
        popEffects.length = 0;
        resetChainPopState();
        activeInflateBall = null;
        dragNode = null;
        pendingDragParticle = null;
    }

    function beginLevelSpawn(level) {
        spawnQueue = level.balloons.slice();
        spawnTimer = 0;
        observeTimer = level.observeSec ?? 0.6;
        if (level.spawnMode === 'instant') {
            const layout = computeBalloonFillLayout();
            while (spawnQueue.length) spawnOneBalloonSpec(spawnQueue.shift(), layout);
            spawnPhase = 'observe';
            refreshBallCentroids();
            updateBallCount();
        } else {
            spawnPhase = 'spawning';
        }
        updateLevelHud();
    }

    function updateLevelSpawn() {
        if (spawnPhase === 'won' || gameOutcome === 'won') return;
        const level = LEVELS[levelIndex];
        if (!level) return;

        if (spawnPhase === 'spawning') {
            if (!spawnQueue.length) {
                spawnPhase = 'observe';
                refreshBallCentroids();
                updateBallCount();
                updateLevelHud();
                return;
            }
            spawnTimer -= dt;
            const stagger = level.spawnStaggerSec ?? 0.06;
            if (spawnTimer <= 0) {
                const layout = computeBalloonFillLayout();
                spawnOneBalloonSpec(spawnQueue.shift(), layout);
                spawnTimer = stagger;
                updateBallCount();
            }
            return;
        }

        if (spawnPhase === 'observe') {
            observeTimer -= dt;
            if (observeTimer <= 0) {
                spawnPhase = 'playing';
                updateLevelHud();
            }
        }
    }

    function canPlayerPump() {
        return spawnPhase === 'playing' && gameOutcome === 'playing';
    }

    function checkLevelWin() {
        if (gameOutcome !== 'playing' || spawnPhase !== 'playing') return;
        if (balls.length > 0) return;
        gameOutcome = 'won';
        spawnPhase = 'won';
        activeInflateBall = null;
        updateLevelHud();
    }

    function loadLevel(idx) {
        levelIndex = Math.max(0, Math.min(idx, LEVELS.length - 1));
        const level = LEVELS[levelIndex];
        clearSimulationEntities();
        activeTeams = level.activeTeams.slice();
        pumpFuelRemaining = level.pump.slice();
        selectedPumpIndex = 0;
        gameOutcome = 'playing';
        winOverlayClick = null;
        layoutPumpHitRects();
        beginLevelSpawn(level);
        if (typeof console !== 'undefined' && console.table) {
            console.table(auditLevelBalance(level));
        }
    }

    function advanceAfterWin() {
        if (levelIndex < LEVELS.length - 1) loadLevel(levelIndex + 1);
        else loadLevel(0);
    }

    function destroyBall(index) {
        const ball = balls[index];
        const set = new Set(ball.particles);

        for (let i = particles.length - 1; i >= 0; i--) {
            if (set.has(particles[i])) particles.splice(i, 1);
        }

        for (let i = constraints.length - 1; i >= 0; i--) {
            const c = constraints[i];
            if (c instanceof AreaConstraint) {
                if (c.particles === ball.particles) constraints.splice(i, 1);
            } else if (c instanceof DistanceConstraint) {
                if (set.has(c.p1) || set.has(c.p2)) constraints.splice(i, 1);
            }
        }

        if (dragNode && set.has(dragNode)) dragNode = null;
        if (activeInflateBall === ball) activeInflateBall = null;
        balls.splice(index, 1);
    }

    function syncBallRestState(ball) {
        const pts = ball.particles;
        let cx = 0;
        let cy = 0;
        for (let i = 0; i < pts.length; i++) {
            cx += pts[i].x;
            cy += pts[i].y;
        }
        cx /= pts.length;
        cy /= pts.length;

        let avgR = 0;
        for (let i = 0; i < pts.length; i++) {
            avgR += Math.hypot(pts[i].x - cx, pts[i].y - cy);
        }
        avgR /= pts.length;

        ball.cx = cx;
        ball.cy = cy;
        ball.radius = avgR;
        ball.baseRadius = avgR;

        const area = ball.areaConstraint.calculateArea();
        ball.areaConstraint.restArea = area;
        ball.areaConstraint.baseRestArea = area;

        for (let i = 0; i < ball.distanceConstraints.length; i++) {
            const dc = ball.distanceConstraints[i];
            const dx = dc.p1.x - dc.p2.x;
            const dy = dc.p1.y - dc.p2.y;
            const len = Math.hypot(dx, dy);
            dc.restLength = len;
            dc.initialRestLength = len;
        }

        ball.fillAtRestBase = airToFillRatio(ball.air);
        ball.restVisualScale = visualScaleFromAir(ball.air);
        ball.areaConstraint.restArea = ball.areaConstraint.baseRestArea;
        ball.areaConstraint.stiffness = 1;
        for (let i = 0; i < ball.distanceConstraints.length; i++) {
            const dc = ball.distanceConstraints[i];
            dc.restLength = dc.initialRestLength;
            dc.stiffness = dc.baseStiffness;
        }
        for (let i = 0; i < ball.particles.length; i++) {
            ball.particles[i].vx = 0;
            ball.particles[i].vy = 0;
        }
    }

    function reshapeBallToCircle(ball, radius) {
        const pts = ball.particles;
        const n = pts.length;
        const cx = ball.cx;
        const cy = ball.cy;

        for (let i = 0; i < n; i++) {
            const angle = (i / n) * Math.PI * 2;
            pts[i].x = cx + Math.cos(angle) * radius;
            pts[i].y = cy + Math.sin(angle) * radius;
            pts[i].vx = 0;
            pts[i].vy = 0;
            pts[i].px = pts[i].x;
            pts[i].py = pts[i].y;
        }

        ball.radius = radius;
        ball.baseRadius = radius;
    }

    function localRelaxBall(ball, iterations) {
        for (let k = 0; k < iterations; k++) {
            const list = ball.solverConstraints;
            for (let i = 0; i < list.length; i++) list[i].solve();
        }
    }

    function clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
    }

    function estimateMeanBalloonRadius() {
        const meanAir = (12 + 100) * 0.5;
        return MIN_BALLOON_RADIUS * visualScaleFromAir(meanAir);
    }

    function computeBalloonFillLayout() {
        const playW = width - BALLOON_FIELD_PAD_X * 2;
        const playH = GROUND_Y - BALLOON_FIELD_PAD_TOP - BALLOON_FIELD_PAD_BOTTOM;
        const r = estimateMeanBalloonRadius();
        const pitchX = 2 * r + BALLOON_PACK_GAP;
        const pitchY = pitchX * (Math.sqrt(3) * 0.5);

        let cols = Math.max(1, Math.floor((playW - 2 * r) / pitchX) + 1);
        let rows = Math.max(1, Math.floor((playH - 2 * r) / pitchY) + 1);

        while (cols > 1 && (cols - 1) * pitchX + 2 * r > playW + 1) cols--;
        while (rows > 1 && (rows - 1) * pitchY + 2 * r > playH + 1) rows--;

        const gridCount = cols * rows;
        const count = Math.max(gridCount, Math.round(gridCount * BALLOON_COUNT_MULTIPLIER));
        const spawnRows = Math.ceil(count / cols);
        const spanX = cols > 1 ? (cols - 1) * pitchX : 0;
        const spanY = spawnRows > 1 ? (spawnRows - 1) * pitchY : 0;
        const originX = BALLOON_FIELD_PAD_X + (playW - spanX) * 0.5;
        const floorLine = floorLimitY();
        const originY = floorLine - r - spanY;

        return {
            count,
            gridCount,
            cols,
            rows: spawnRows,
            r,
            pitchX,
            pitchY,
            originX,
            originY
        };
    }

    let dragNode = null;
    let pendingDragParticle = null;
    let activeInflateBall = null;
    let pointerDown = false;
    let pointerDownPos = { x: 0, y: 0 };
    let mouse = { x: 0, y: 0 };

    loadLevel(0);

    window.addEventListener('keydown', (e) => {
        if (e.key === 'r' || e.key === 'R') loadLevel(levelIndex);
    });

    function screenToLogical(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: (clientX - rect.left) * (width / rect.width),
            y: (clientY - rect.top) * (height / rect.height)
        };
    }

    function pickBalloonAt(x, y) {
        if (isInPumpZone(y)) return null;
        for (let i = balls.length - 1; i >= 0; i--) {
            const pts = balls[i].particles;
            if (pointInPolygon(x, y, pts)) return balls[i];
            const c = polygonCentroid(pts);
            const dist = Math.hypot(x - c.x, y - c.y);
            if (dist < balls[i].radius * 1.05) return balls[i];
        }
        return null;
    }

    function startDrag(clientX, clientY) {
        const pos = screenToLogical(clientX, clientY);
        mouse.x = pos.x;
        mouse.y = pos.y;
        pointerDownPos.x = pos.x;
        pointerDownPos.y = pos.y;
        pointerDown = true;
        dragNode = null;
        pendingDragParticle = null;

        if (gameOutcome === 'won') {
            if (winOverlayClick && mouse.x >= winOverlayClick.x && mouse.x <= winOverlayClick.x + winOverlayClick.w
                && mouse.y >= winOverlayClick.y && mouse.y <= winOverlayClick.y + winOverlayClick.h) {
                advanceAfterWin();
            }
            return;
        }

        if (!canPlayerPump()) return;

        if (isInPumpZone(mouse.y)) {
            const pumpIdx = pickPumpAt(mouse.x, mouse.y);
            if (pumpIdx >= 0) selectedPumpIndex = pumpIdx;
            return;
        }

        const hitBall = pickBalloonAt(mouse.x, mouse.y);
        if (hitBall) {
            const idx = selectPumpForBall(hitBall);
            if (idx >= 0 && pumpFuelRemaining[idx] > 0) activeInflateBall = hitBall;
            return;
        }
        activeInflateBall = null;

        let minDist = 42;
        for (const p of particles) {
            const dist = Math.hypot(p.x - mouse.x, p.y - mouse.y);
            if (dist < minDist) {
                minDist = dist;
                pendingDragParticle = p;
            }
        }
    }

    function moveDrag(clientX, clientY) {
        const pos = screenToLogical(clientX, clientY);
        mouse.x = pos.x;
        mouse.y = pos.y;

        if (!pointerDown || activeInflateBall || dragNode || !pendingDragParticle) return;
        const moved = Math.hypot(mouse.x - pointerDownPos.x, mouse.y - pointerDownPos.y);
        if (moved >= DRAG_MOVE_THRESHOLD) {
            dragNode = pendingDragParticle;
            pendingDragParticle = null;
        }
    }

    function endDrag() {
        dragNode = null;
        pendingDragParticle = null;
        activeInflateBall = null;
        pointerDown = false;
    }

    function updateInflation() {
        if (!canPlayerPump() || !pointerDown || !activeInflateBall) return;
        if (!balls.includes(activeInflateBall)) {
            activeInflateBall = null;
            return;
        }

        const ball = activeInflateBall;
        const pumpIdx = pumpSlotForBall(ball);
        if (pumpIdx < 0 || pumpFuelRemaining[pumpIdx] <= 0) {
            activeInflateBall = null;
            return;
        }

        const airBefore = ball.air;
        const fill = airToFillRatio(ball.air);
        const ease = Math.pow(Math.max(0, 1 - fill), 3.2);
        const speedFactor = Math.max(0.15, ease);
        const want = PUMP_AIR_RATE * speedFactor * dt;
        const used = Math.min(want, ball.air, pumpFuelRemaining[pumpIdx]);
        if (used <= 0) {
            activeInflateBall = null;
            return;
        }

        ball.air -= used;
        pumpFuelRemaining[pumpIdx] -= used;
        if (pumpFuelRemaining[pumpIdx] < 1e-6) pumpFuelRemaining[pumpIdx] = 0;

        applyBallAirVisual(ball);
        const airDelta = airBefore - ball.air;
        if (airDelta >= SHAKE_MIN_AIR_DELTA) {
            applyInflationShake(ball);
        }
        schedulePopIfEmpty(ball);
    }

    function updatePopEffects() {
        for (let i = popEffects.length - 1; i >= 0; i--) {
            const fx = popEffects[i];
            fx.life -= dt;
            if (fx.life <= 0) {
                popEffects.splice(i, 1);
                continue;
            }
            fx.x += fx.vx * dt;
            fx.y += fx.vy * dt;
            fx.vy += 420 * dt;
            fx.vx *= 0.98;
        }
    }

    canvas.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
    window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
    window.addEventListener('mouseup', endDrag);

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        startDrag(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });
    window.addEventListener('touchmove', (e) => {
        if (e.touches.length) moveDrag(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });
    window.addEventListener('touchend', endDrag);

    function polygonCentroid(poly) {
        let cx = 0;
        let cy = 0;
        for (let i = 0; i < poly.length; i++) {
            cx += poly[i].x;
            cy += poly[i].y;
        }
        return { x: cx / poly.length, y: cy / poly.length };
    }

    function pointInPolygon(px, py, poly) {
        let inside = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
            const xi = poly[i].x, yi = poly[i].y;
            const xj = poly[j].x, yj = poly[j].y;
            const intersects = ((yi > py) !== (yj > py)) &&
                (px < (xj - xi) * (py - yi) / ((yj - yi) || 1e-8) + xi);
            if (intersects) inside = !inside;
        }
        return inside;
    }

    function closestPointOnSegment(px, py, ax, ay, bx, by) {
        const abx = bx - ax;
        const aby = by - ay;
        const abLenSq = abx * abx + aby * aby;
        if (abLenSq < 1e-8) return { x: ax, y: ay, t: 0 };
        let t = ((px - ax) * abx + (py - ay) * aby) / abLenSq;
        t = Math.max(0, Math.min(1, t));
        return { x: ax + abx * t, y: ay + aby * t, t };
    }

    function getOutwardNormal(ax, ay, bx, by, centroid) {
        const ex = bx - ax;
        const ey = by - ay;
        let nx = -ey;
        let ny = ex;
        const mx = (ax + bx) * 0.5;
        const my = (ay + by) * 0.5;
        const toOutsideX = mx - centroid.x;
        const toOutsideY = my - centroid.y;
        if (nx * toOutsideX + ny * toOutsideY < 0) {
            nx = -nx;
            ny = -ny;
        }
        const len = Math.hypot(nx, ny) || 1;
        return { x: nx / len, y: ny / len };
    }

    function projectPointVsPolygon(point, poly, centroid, contactSlop) {
        let best = null;
        let bestDistSq = Infinity;

        for (let i = 0; i < poly.length; i++) {
            const j = (i + 1) % poly.length;
            const a = poly[i];
            const b = poly[j];
            const cp = closestPointOnSegment(point.x, point.y, a.x, a.y, b.x, b.y);
            const dx = point.x - cp.x;
            const dy = point.y - cp.y;
            const distSq = dx * dx + dy * dy;
            if (distSq < bestDistSq) {
                bestDistSq = distSq;
                best = { i, j, cp };
            }
        }

        if (!best) return;

        const a = poly[best.i];
        const b = poly[best.j];
        const normal = getOutwardNormal(a.x, a.y, b.x, b.y, centroid);
        const signedDist = (point.x - best.cp.x) * normal.x + (point.y - best.cp.y) * normal.y;
        const needInsideTest = bestDistSq < contactSlop * contactSlop * 16;
        const inside = needInsideTest && pointInPolygon(point.x, point.y, poly);
        const penetration = inside ? (contactSlop - signedDist) : Math.max(0, contactSlop - signedDist);
        if (penetration <= 0) return;

        const wp = point.invMass;
        const wa = a.invMass;
        const wb = b.invMass;
        const t = best.cp.t;
        const wA = wa * (1 - t);
        const wB = wb * t;
        const wSum = wp + wA + wB;
        if (wSum < 1e-8) return;

        const corrX = normal.x * penetration;
        const corrY = normal.y * penetration;

        point.x += corrX * (wp / wSum);
        point.y += corrY * (wp / wSum);
        a.x -= corrX * (wA / wSum);
        a.y -= corrY * (wA / wSum);
        b.x -= corrX * (wB / wSum);
        b.y -= corrY * (wB / wSum);
    }

    function solvePair(polyA, polyB, pairSeed, cAx, cAy, cBx, cBy) {
        const contactSlop = 2.0;
        const cA = { x: cAx, y: cAy };
        const cB = { x: cBx, y: cBy };
        const offsetA = (collisionPhase + pairSeed) % polyA.length;
        const offsetB = (collisionPhase + pairSeed * 3) % polyB.length;
        const flip = (collisionOrderFlip ^ (pairSeed & 1)) !== 0;

        if (!flip) {
            for (let i = 0; i < polyA.length; i++) {
                const idx = (offsetA + i) % polyA.length;
                projectPointVsPolygon(polyA[idx], polyB, cB, contactSlop);
            }
            for (let i = 0; i < polyB.length; i++) {
                const idx = (offsetB + i) % polyB.length;
                projectPointVsPolygon(polyB[idx], polyA, cA, contactSlop);
            }
        } else {
            for (let i = 0; i < polyB.length; i++) {
                const idx = (offsetB + i) % polyB.length;
                projectPointVsPolygon(polyB[idx], polyA, cA, contactSlop);
            }
            for (let i = 0; i < polyA.length; i++) {
                const idx = (offsetA + i) % polyA.length;
                projectPointVsPolygon(polyA[idx], polyB, cB, contactSlop);
            }
        }
    }

    function solveBallCollisions() {
        if (balls.length < 2) return;

        const reachPad = 28;
        for (let a = 0; a < balls.length; a++) {
            const ba = balls[a];
            for (let b = a + 1; b < balls.length; b++) {
                const bb = balls[b];
                const dx = ba.cx - bb.cx;
                const dy = ba.cy - bb.cy;
                const reach = ba.radius + bb.radius + reachPad;
                if (dx * dx + dy * dy > reach * reach) continue;
                solvePair(
                    ba.particles, bb.particles, a + b,
                    ba.cx, ba.cy, bb.cx, bb.cy
                );
            }
        }
        collisionOrderFlip = !collisionOrderFlip;
        collisionPhase++;
    }

    function stabilizeSettledBalls() {
        const driftBlend = 0.1;
        const spinDamp = 0.18;
        const activeThreshold = 42;
        const sleepThreshold = 14;

        for (let b = 0; b < balls.length; b++) {
            const ball = balls[b];
            if (activeInflateBall === ball) continue;

            const pts = ball.particles;
            let hasDragNode = false;
            for (let i = 0; i < pts.length; i++) {
                if (pts[i] === dragNode) {
                    hasDragNode = true;
                    break;
                }
            }
            if (hasDragNode) continue;

            let sumVx = 0;
            let sumVy = 0;
            let sumSq = 0;
            let cx = 0;
            let cy = 0;
            for (let i = 0; i < pts.length; i++) {
                const p = pts[i];
                sumVx += p.vx;
                sumVy += p.vy;
                sumSq += p.vx * p.vx + p.vy * p.vy;
                cx += p.x;
                cy += p.y;
            }
            const n = pts.length;
            const meanVx = sumVx / n;
            const meanVy = sumVy / n;
            const meanSpeed = Math.hypot(meanVx, meanVy);
            const rms = Math.sqrt(sumSq / n);
            if (meanSpeed > activeThreshold && rms > activeThreshold) continue;

            cx /= n;
            cy /= n;

            for (let i = 0; i < n; i++) {
                const p = pts[i];
                p.vx -= meanVx * driftBlend;
                p.vy -= meanVy * driftBlend;

                const rx = p.x - cx;
                const ry = p.y - cy;
                const rlen = Math.hypot(rx, ry) || 1;
                const rvx = p.vx - meanVx;
                const rvy = p.vy - meanVy;
                const radial = rvx * (rx / rlen) + rvy * (ry / rlen);
                const tvx = rvx - radial * (rx / rlen);
                const tvy = rvy - radial * (ry / rlen);
                p.vx -= tvx * spinDamp;
                p.vy -= tvy * spinDamp;
            }

            if (rms < sleepThreshold) {
                const s = 0.55;
                for (let i = 0; i < n; i++) {
                    pts[i].vx *= s;
                    pts[i].vy *= s;
                }
            }
        }
    }

    function updatePhysics() {
        const subdt = dt / numSubsteps;
        const padding = 5;
        const floorY = floorLimitY();

        for (let step = 0; step < numSubsteps; step++) {
            for (const p of particles) {
                if (p === dragNode) continue;
                p.vy += gravity.y * subdt;
                p.vx += gravity.x * subdt;
                p.px = p.x;
                p.py = p.y;
                p.x += p.vx * subdt;
                p.y += p.vy * subdt;
            }

            if (dragNode) {
                dragNode.x = mouse.x;
                dragNode.y = mouse.y;
                dragNode.px = mouse.x;
                dragNode.py = mouse.y;
            }

            refreshBallCentroids();

            for (let iter = 0; iter < pbdIterations; iter++) {
                solveBallConstraints();

                for (const p of particles) {
                    if (p.y > floorY) p.y = floorY;
                    if (p.x > width - padding) p.x = width - padding;
                    if (p.x < padding) p.x = padding;
                }
            }

            solveBallCollisions();

            for (const p of particles) {
                if (p.y > floorY) p.y = floorY;
                if (p.x > width - padding) p.x = width - padding;
                if (p.x < padding) p.x = padding;
            }

            for (const p of particles) {
                if (p === dragNode) {
                    p.vx = 0;
                    p.vy = 0;
                    continue;
                }

                p.vx = (p.x - p.px) / subdt;
                p.vy = (p.y - p.py) / subdt;

                if (p.y >= floorY - 0.01 && p.vy > 0) {
                    p.vy = -p.vy * 0.1;
                    p.vx *= 0.8;
                }
                if (p.x <= 5.01 || p.x >= width - 5.01) {
                    p.vx = -p.vx * 0.1;
                    p.vy *= 0.8;
                }

                p.vx *= 0.999;
                p.vy *= 0.999;
            }

            if (step === numSubsteps - 1) {
                stabilizeSettledBalls();
            }
        }
        refreshBallCentroids();
    }

    const bgCanvas = document.createElement('canvas');
    bgCanvas.width = width;
    bgCanvas.height = height;
    const bgCtx = bgCanvas.getContext('2d');
    (function paintStaticBackground() {
        const g = bgCtx.createLinearGradient(0, 0, 0, height);
        g.addColorStop(0, '#2a1f4e');
        g.addColorStop(0.45, '#1a1a2e');
        g.addColorStop(1, '#12121f');
        bgCtx.fillStyle = g;
        bgCtx.fillRect(0, 0, width, height);
        bgCtx.fillStyle = 'rgba(255, 255, 255, 0.03)';
        for (let i = 0; i < 24; i++) {
            const sx = (i * 97) % width;
            const sy = (i * 131) % height;
            bgCtx.beginPath();
            bgCtx.arc(sx, sy, 1.2, 0, Math.PI * 2);
            bgCtx.fill();
        }
    })();

    function drawBackground() {
        ctx.drawImage(bgCanvas, 0, 0);
    }

    function draw() {
        drawBackground();

        for (const ball of balls) {
            const pts = ball.particles;
            if (!pts.length) continue;

            const cx = ball.cx;
            const cy = ball.cy;

            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
            ctx.closePath();

            const grad = ctx.createRadialGradient(
                cx - ball.radius * 0.3, cy - ball.radius * 0.3, ball.radius * 0.1,
                cx, cy, ball.radius * 1.1
            );
            grad.addColorStop(0, ball.colorLight);
            grad.addColorStop(1, ball.colorBase);

            ctx.fillStyle = grad;
            ctx.fill();

            const stress = ball.inflate;
            ctx.lineWidth = 2.5 + stress * 2.5;
            const strokeAlpha = 0.35 + stress * 0.45;
            if (stress > 0.55) {
                ctx.strokeStyle = `rgba(255, ${Math.floor(180 - stress * 120)}, ${Math.floor(200 - stress * 160)}, ${strokeAlpha})`;
            } else {
                ctx.strokeStyle = `rgba(255, 255, 255, ${strokeAlpha})`;
            }
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
            ctx.beginPath();
            ctx.ellipse(
                cx - ball.radius * 0.4, cy - ball.radius * 0.4,
                ball.radius * 0.22, ball.radius * 0.13, -Math.PI / 4, 0, Math.PI * 2
            );
            ctx.fill();

            const airLabel = ball.air > 0 ? String(Math.ceil(ball.air)) : '0';
            const fontSize = Math.max(15, Math.min(34, ball.radius * 0.52));
            ctx.font = `bold ${fontSize}px "ZCOOL KuaiLe", system-ui, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.lineWidth = Math.max(2, fontSize * 0.14);
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.42)';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.96)';
            ctx.strokeText(airLabel, cx, cy);
            ctx.fillText(airLabel, cx, cy);
        }

        for (const fx of popEffects) {
            const alpha = Math.max(0, fx.life / fx.maxLife);
            const r = parseInt(fx.color.slice(1, 3), 16);
            const g = parseInt(fx.color.slice(3, 5), 16);
            const b = parseInt(fx.color.slice(5, 7), 16);
            ctx.beginPath();
            ctx.arc(fx.x, fx.y, fx.size * alpha, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
            ctx.fill();
        }

        if (activeInflateBall && balls.includes(activeInflateBall)) {
            const pts = activeInflateBall.particles;
            const c = polygonCentroid(pts);
            ctx.beginPath();
            ctx.arc(c.x, c.y, activeInflateBall.radius * 1.08, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(255, 255, 255, ${0.25 + activeInflateBall.inflate * 0.5})`;
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 6]);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        if (dragNode) {
            ctx.beginPath();
            ctx.moveTo(dragNode.x, dragNode.y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.fill();
        }

        drawPumpDock();
        drawWinOverlay();
    }

    function drawWinOverlay() {
        if (gameOutcome !== 'won') {
            winOverlayClick = null;
            return;
        }
        ctx.save();
        ctx.fillStyle = 'rgba(8, 8, 18, 0.55)';
        ctx.fillRect(0, 0, width, GROUND_Y);

        const panelW = Math.min(300, width - 40);
        const panelH = 132;
        const px = (width - panelW) * 0.5;
        const py = GROUND_Y * 0.42 - panelH * 0.5;
        ctx.fillStyle = 'rgba(22, 24, 38, 0.94)';
        strokeRoundRect(px, py, panelW, panelH, 14);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        const level = LEVELS[levelIndex];
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
        ctx.font = 'bold 22px "ZCOOL KuaiLe", system-ui, sans-serif';
        ctx.fillText('过关！', width * 0.5, py + 36);
        ctx.font = '15px "ZCOOL KuaiLe", system-ui, sans-serif';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
        ctx.fillText(level ? level.title : '', width * 0.5, py + 62);

        const btnW = 168;
        const btnH = 40;
        const bx = (width - btnW) * 0.5;
        const by = py + panelH - btnH - 18;
        const grad = ctx.createLinearGradient(bx, by, bx, by + btnH);
        grad.addColorStop(0, '#ff6b9d');
        grad.addColorStop(1, '#d91e48');
        ctx.fillStyle = grad;
        strokeRoundRect(bx, by, btnW, btnH, 10);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px "ZCOOL KuaiLe", system-ui, sans-serif';
        const btnLabel = levelIndex < LEVELS.length - 1 ? '下一关' : '再玩一遍';
        ctx.fillText(btnLabel, width * 0.5, by + btnH * 0.62);
        winOverlayClick = { x: bx, y: by, w: btnW, h: btnH };
        ctx.restore();
    }

    layoutPumpHitRects();

    function loop() {
        simTime += dt;
        updateLevelSpawn();
        updateInflation();
        updatePhysics();
        updateImminentPops();
        processChainPops();
        updatePopEffects();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
