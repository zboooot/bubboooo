<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>气球雨 · 9:20 · v1.25</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        :root {
            --stage-w: 360;
            --stage-h: 800;
            --bg-outer: #0f0f1a;
            --accent: #ff6b9d;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: var(--bg-outer);
            touch-action: none;
            font-family: "ZCOOL KuaiLe", system-ui, sans-serif;
        }

        #viewport {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 0;
            padding: 12px;
            background:
                radial-gradient(ellipse 80% 50% at 50% 0%, rgba(255, 107, 157, 0.12), transparent),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(0, 243, 255, 0.08), transparent),
                var(--bg-outer);
        }

        #stage {
            position: relative;
            aspect-ratio: 9 / 20;
            height: 100vh;
            max-height: 100dvh;
            max-width: calc(100dvh * 9 / 20);
            width: min(100vw, calc(100dvh * 9 / 20));
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.06),
                0 24px 80px rgba(0, 0, 0, 0.55);
            border-radius: clamp(12px, 2vw, 20px);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 14px 16px 36px;
            text-align: center;
            pointer-events: none;
            background: linear-gradient(
                180deg,
                rgba(8, 8, 18, 0.82) 0%,
                rgba(8, 8, 18, 0.5) 45%,
                rgba(8, 8, 18, 0.12) 78%,
                rgba(8, 8, 18, 0) 100%
            );
        }

        #hud span {
            color: var(--accent);
        }

        #levelHud {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.94);
            letter-spacing: 0.12em;
            margin-bottom: 2px;
            text-shadow: 0 1px 10px rgba(0, 0, 0, 0.55);
        }

        #levelHud .level-num {
            font-size: 150%;
            line-height: 1;
        }

        #hudSub {
            display: none;
        }

        #comboHud {
            position: absolute;
            top: 78px;
            right: 14px;
            pointer-events: none;
            text-align: right;
            opacity: 0;
            transform: scale(0.6) translateY(8px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        #comboHud.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        #comboHud.combo-pop {
            animation: comboPop 0.42s cubic-bezier(0.22, 1.15, 0.36, 1) forwards;
        }

        @keyframes comboPop {
            0% { transform: scale(0.55) translateY(10px); }
            45% { transform: scale(1.22) translateY(-4px); }
            100% { transform: scale(1) translateY(0); }
        }

        #comboHud .combo-prefix {
            display: block;
            font-size: 11px;
            letter-spacing: 0.2em;
            opacity: 0.75;
            margin-bottom: 2px;
        }

        #comboValue {
            display: block;
            font-size: 36px;
            font-weight: bold;
            line-height: 1;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.55);
        }

        /* 连爆数：白 0–5 / 绿 6–10 / 蓝 11–15 / 紫 16–25 / 橙 ≥26（字号为白档 3 倍） */
        #comboHud[data-tier="0"] #comboValue {
            color: rgba(255, 255, 255, 0.96);
            text-shadow: 0 2px 18px rgba(0, 0, 0, 0.65);
        }
        #comboHud[data-tier="1"] #comboValue {
            color: #4ade80;
            text-shadow: 0 0 18px rgba(74, 222, 128, 0.45);
        }
        #comboHud[data-tier="2"] #comboValue {
            color: #60a5fa;
            text-shadow: 0 0 20px rgba(96, 165, 250, 0.5);
        }
        #comboHud[data-tier="3"] #comboValue {
            color: #c084fc;
            text-shadow: 0 0 24px rgba(192, 132, 252, 0.55);
        }
        #comboHud[data-tier="4"] #comboValue {
            color: #fb923c;
            font-size: 108px;
            text-shadow: 0 0 32px rgba(251, 146, 60, 0.6);
        }
        #comboHud[data-tier="4"] .combo-prefix {
            font-size: 13px;
            opacity: 0.9;
        }
        #comboHud[data-tier="4"].combo-pop {
            animation: comboPopOrange 0.48s cubic-bezier(0.18, 1.2, 0.32, 1) forwards;
        }
        @keyframes comboPopOrange {
            0% { transform: scale(0.4) translateY(14px); }
            40% { transform: scale(1.15) translateY(-6px); }
            100% { transform: scale(1) translateY(0); }
        }

        #versionTag {
            position: absolute;
            bottom: 112px;
            right: 12px;
            pointer-events: none;
            color: rgba(255, 255, 255, 0.28);
            font-size: 11px;
            letter-spacing: 0.06em;
        }

        #startScreen {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(
                180deg,
                rgba(8, 8, 18, 0.94) 0%,
                rgba(12, 12, 24, 0.9) 55%,
                rgba(8, 8, 18, 0.92) 100%
            );
            pointer-events: auto;
        }

        #startScreen.hidden {
            display: none;
        }

        .start-actions {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 14px;
            width: min(232px, 78%);
        }

        .start-btn {
            font-family: "ZCOOL KuaiLe", system-ui, sans-serif;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 0.14em;
            padding: 15px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        .start-btn:active {
            transform: scale(0.97);
        }

        .start-btn-primary {
            color: #fff;
            background: linear-gradient(180deg, #ff6b9d 0%, #d91e48 100%);
            box-shadow: 0 8px 28px rgba(217, 30, 72, 0.35);
        }

        .start-btn-secondary {
            color: rgba(255, 255, 255, 0.92);
            background: rgba(255, 255, 255, 0.12);
        }

        .start-hint {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.72);
            letter-spacing: 0.1em;
            line-height: 1.55;
        }

    </style>
</head>

<script>
(() => {
  // js/config.js

  var ITEM_REVEAL_ANCHOR_HOLD_SEC = 0.5;

  var ITEM_REVEAL_FADE_SEC = 0.45;
  var ITEM_REVEAL_MOVE_SEC = 0.55;

  // js/level/levelData.js
  var TEAM_PALETTE = [
    { colorBase: "#d91e48", colorLight: "#ff6b85", defaultPump: 35, shortName: "\u7EA2" },
    { colorBase: "#7b2fd4", colorLight: "#c49bff", defaultPump: 28, shortName: "\u7D2B" },
    { colorBase: "#0ea5b7", colorLight: "#5eead4", defaultPump: 30, shortName: "\u9752" },
    { colorBase: "#e85d04", colorLight: "#ffb366", defaultPump: 28, shortName: "\u6A59" },
    { colorBase: "#16a34a", colorLight: "#86efac", defaultPump: 26, shortName: "\u7EFF" },
    { colorBase: "#2563eb", colorLight: "#93c5fd", defaultPump: 26, shortName: "\u84DD" }
  ];
  var TUTORIAL_LEVEL_COUNT = 3;
  var NINJA_DART_TEST_LEVEL = {
    id: "test-ninja-dart",
    title: "\u5FCD\u8005\u98DE\u9556\u8BD5\u70BC",
    testLevel: true,
    balloonCountFactor: 0.78,
    layoutRadiusScale: 0.92,
    scatter: 0.04,
    activeTeams: [0, 1, 2],
    pump: [120, 120, 120],
    popItemDrops: [
      { spawnIndex: 2, itemId: "ninja_dart" },
      { spawnIndex: 6, itemId: "ninja_dart" },
      { spawnIndex: 11, itemId: "ninja_dart" }
    ]
  };
  var TEST_LEVELS = {
    ninja_dart: NINJA_DART_TEST_LEVEL
  };
  var TUTORIAL_LEVELS = [
    {
      id: 1,
      title: "\u53CC\u7B52\u70ED\u8EAB",
      balloonCountFactor: 1,
      activeTeams: [0, 1],
      pump: [80, 80]
    },
    {
      id: 2,
      title: "\u4E09\u8272\u52A0\u539A",
      balloonCountFactor: 1.12,
      activeTeams: [0, 1, 2],
      pump: [80, 80, 76]
    },
    {
      id: 3,
      title: "\u7D27\u6CB9\u8003\u9A8C",
      balloonCountFactor: 1.2,
      activeTeams: [0, 1, 2],
      pump: [80, 80, 30]
    }
  ];

  // js/audio/SfxSystem.js
  function createSfxSystem(getSimTime) {
    const COMBO_MELODY = [
      392,
      440,
      523.25,
      587.33,
      659.25,
      783.99,
      880,
      1046.5,
      1174.66,
      1318.51,
      1567.98,
      1760,
      1975.53,
      2093,
      2349.32,
      2637.02
    ];
    let ctx = null;
    let master = null;
    let popBus = null;
    let pumpBed = null;
    let pumpIntensity = 0;
    let pumpStrokePhase = 0;
    let lastChuffPhaseInt = 0;
    let lastDeniedAt = 0;
    let noiseLoopBuffer = null;
    let bgmBus = null;
    let bgmStarted = false;
    let bgmGraphReady = false;
    let bgmEl = null;
    let bgmMediaSource = null;
    let bgmAutoplayAttempts = 0;
    let dartFlyLoop = null;
    let dartFlightLevel = 0;
    const BGM_SRC = "../../assets/bgm.mp3";
    const NINJA_SHOUT_SRC = "../../assets/ninja_shout.mp3";
    const NINJA_DART_FLY_SRC = "../../assets/ninja_dart_fly.mp3";
    let ninjaShoutBuffer = null;
    let ninjaDartFlyBuffer = null;
    let ninjaSfxLoadPromise = null;
    let lastRainbowSfxAt = 0;
    let lastClownLaughAt = 0;
    const BGM_LEVEL = 0.26;
    function runWhenCtxReady(fn) {
      init();
      if (!ctx) return;
      const run = () => {
        try {
          fn(ctx.currentTime);
        } catch {
        }
      };
      if (ctx.state === "running") run();
      else ctx.resume().then(run).catch(run);
    }
    function init() {
      if (ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 1;
      master.connect(ctx.destination);
      popBus = ctx.createGain();
      popBus.gain.value = 1.15;
      popBus.connect(master);
      const bufferSize = 2 * ctx.sampleRate;
      noiseLoopBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = noiseLoopBuffer.getChannelData(0);
      let last = 0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        last = (last + 0.012 * white) / 1.012;
        data[i] = white * 0.55 + last * 0.45;
      }
      const bedNoise = ctx.createBufferSource();
      bedNoise.buffer = noiseLoopBuffer;
      bedNoise.loop = true;
      const bedHigh = ctx.createBiquadFilter();
      bedHigh.type = "highpass";
      bedHigh.frequency.value = 280;
      const bedFilter = ctx.createBiquadFilter();
      bedFilter.type = "bandpass";
      bedFilter.frequency.value = 1150;
      bedFilter.Q.value = 0.95;
      const bedGain = ctx.createGain();
      bedGain.gain.value = 0;
      const bedTone = ctx.createOscillator();
      bedTone.type = "sine";
      bedTone.frequency.value = 210;
      const bedToneGain = ctx.createGain();
      bedToneGain.gain.value = 0;
      const bedBus = ctx.createGain();
      bedBus.gain.value = 1;
      bedNoise.connect(bedHigh);
      bedHigh.connect(bedFilter);
      bedFilter.connect(bedGain);
      bedGain.connect(bedBus);
      bedTone.connect(bedToneGain);
      bedToneGain.connect(bedBus);
      bedBus.connect(master);
      bedNoise.start();
      bedTone.start();
      pumpBed = { bedGain, bedFilter, bedTone, bedToneGain, bedBus };
    }
    function loadNinjaSfx() {
      if (!ctx) return Promise.resolve();
      if (ninjaSfxLoadPromise) return ninjaSfxLoadPromise;
      ninjaSfxLoadPromise = (async () => {
        const decode = async (url) => {
          const res = await fetch(url);
          if (!res.ok) throw new Error(`sfx fetch ${url}`);
          return ctx.decodeAudioData(await res.arrayBuffer());
        };
        try {
          [ninjaShoutBuffer, ninjaDartFlyBuffer] = await Promise.all([
            decode(NINJA_SHOUT_SRC),
            decode(NINJA_DART_FLY_SRC)
          ]);
          ensureDartFlyLoop();
        } catch {
          ninjaSfxLoadPromise = null;
        }
      })();
      return ninjaSfxLoadPromise;
    }
    function resume() {
      init();
      if (!ctx) return;
      void loadNinjaSfx();
      const begin = () => {
        startBgm();
        if (!bgmStarted) requestAnimationFrame(() => startBgm());
      };
      if (ctx.state === "suspended") {
        ctx.resume().then(begin).catch(begin);
      } else {
        begin();
      }
    }
    function ensureBgmElement() {
      if (bgmEl) return;
      bgmEl = new Audio(BGM_SRC);
      bgmEl.loop = true;
      bgmEl.preload = "auto";
      bgmEl.crossOrigin = "anonymous";
      bgmEl.playsInline = true;
      bgmEl.setAttribute("playsinline", "");
      bgmEl.volume = 1;
    }
    function setupBgmGraph() {
      if (!ctx || bgmGraphReady) return;
      ensureBgmElement();
      bgmBus = ctx.createGain();
      bgmBus.gain.value = 0;
      bgmBus.connect(master);
      bgmMediaSource = ctx.createMediaElementSource(bgmEl);
      bgmMediaSource.connect(bgmBus);
      bgmGraphReady = true;
    }
    function runBgmPlayback() {
      if (!ctx) return;
      setupBgmGraph();
      const t = ctx.currentTime;
      bgmBus.gain.cancelScheduledValues(t);
      bgmBus.gain.setValueAtTime(bgmBus.gain.value, t);
      bgmBus.gain.linearRampToValueAtTime(BGM_LEVEL, t + 1.2);
      const playPromise = bgmEl.play();
      if (playPromise && typeof playPromise.then === "function") {
        playPromise.then(() => {
          bgmStarted = true;
        }).catch(() => {
        });
      } else {
        bgmStarted = true;
      }
    }
    function startBgm() {
      init();
      if (!ctx) return;
      ensureBgmElement();
      const kick = () => runBgmPlayback();
      if (ctx.state === "suspended") {
        ctx.resume().then(kick).catch(kick);
      } else {
        kick();
      }
    }
    function autoplayBgm() {
      init();
      ensureBgmElement();
      startBgm();
      if (bgmAutoplayAttempts >= 24) return;
      bgmAutoplayAttempts++;
      if (!bgmStarted || bgmEl && bgmEl.paused) {
        requestAnimationFrame(autoplayBgm);
      }
    }
    function makeNoiseBurst(durationSec, shaping) {
      const len = Math.max(1, Math.floor(ctx.sampleRate * durationSec));
      const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buffer.getChannelData(0);
      for (let i = 0; i < len; i++) {
        const t = i / len;
        const env = shaping ? shaping(t) : Math.pow(1 - t, 1.4);
        d[i] = (Math.random() * 2 - 1) * env;
      }
      return buffer;
    }
    function playPumpChuff(inflate, intensity) {
      if (!ctx || !popBus) return;
      const t = ctx.currentTime;
      const power = 0.65 + intensity * 0.55 + inflate * 0.35;
      const whoosh = ctx.createBufferSource();
      whoosh.buffer = makeNoiseBurst(0.09, (u) => Math.sin(Math.PI * u) * (1 - u * 0.35));
      const wf = ctx.createBiquadFilter();
      wf.type = "bandpass";
      wf.frequency.setValueAtTime(720 + inflate * 380, t);
      wf.frequency.linearRampToValueAtTime(2200 + inflate * 500, t + 0.07);
      wf.Q.value = 1.05;
      const wg = ctx.createGain();
      wg.gain.setValueAtTime(1e-3, t);
      wg.gain.linearRampToValueAtTime(power * 0.82, t + 6e-3);
      wg.gain.exponentialRampToValueAtTime(1e-3, t + 0.09);
      whoosh.connect(wf);
      wf.connect(wg);
      wg.connect(master);
      whoosh.start(t);
      whoosh.stop(t + 0.1);
      const puff = ctx.createOscillator();
      puff.type = "sine";
      puff.frequency.setValueAtTime(260 + inflate * 80, t);
      puff.frequency.exponentialRampToValueAtTime(420 + inflate * 120, t + 0.045);
      const pg = ctx.createGain();
      pg.gain.setValueAtTime(power * 0.28, t);
      pg.gain.exponentialRampToValueAtTime(1e-3, t + 0.06);
      puff.connect(pg);
      pg.connect(master);
      puff.start(t);
      puff.stop(t + 0.065);
      const click = ctx.createOscillator();
      click.type = "sine";
      click.frequency.setValueAtTime(520, t);
      click.frequency.exponentialRampToValueAtTime(320, t + 0.035);
      const cg = ctx.createGain();
      cg.gain.setValueAtTime(power * 0.22, t);
      cg.gain.exponentialRampToValueAtTime(1e-3, t + 0.04);
      click.connect(cg);
      cg.connect(master);
      click.start(t);
      click.stop(t + 0.045);
    }
    function updatePump(inflate, dt2, isPumping) {
      resume();
      if (!pumpBed || !ctx) return;
      if (isPumping) pumpIntensity = Math.min(1, pumpIntensity + dt2 * 2.2);
      else pumpIntensity = Math.max(0, pumpIntensity - dt2 * 4.5);
      const t = ctx.currentTime;
      const pressure = pumpIntensity * (0.45 + inflate * 0.55);
      const wobble = 0.72 + 0.28 * Math.sin(getSimTime() * 9.5);
      pumpBed.bedGain.gain.setTargetAtTime(pressure * 0.58 * wobble, t, 0.025);

        const width2 = (2.8 - ease * 1.6) * (1 - i * 0.15);
        ctx.lineWidth = Math.max(0.8, width2);
        ctx.strokeStyle = `rgba(255, 252, 245, ${alpha})`;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.lineWidth = Math.max(0.5, width2 * 0.55);
        ctx.strokeStyle = `rgba(255, 140, 90, ${alpha * 0.45})`;
        ctx.beginPath();
        ctx.arc(cx, cy, radius + 1.5, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }
    drawBackground() {
      const game = this.game;
      const ctx = game.dom.ctx;
      ctx.drawImage(game.bgCanvas, 0, 0);
    }
    drawTransitionFade() {
      const game = this.game;
      const ctx = game.dom.ctx;
      if (game.gameOutcome !== "transition" && game.transitionFade <= 0) return;
      const a = Math.min(1, Math.max(0, game.transitionFade)) * 0.92;
      if (a <= 1e-3) return;
      ctx.fillStyle = `rgba(8, 8, 18, ${a})`;
      ctx.fillRect(0, 0, width, height);
    }
    draw() {
      const game = this.game;
      const ctx = game.dom.ctx;
      game.drawBackground();
      for (const ball of game.balls) {
        const pts = ball.particles;
        if (!pts.length) continue;
        const cx = ball.cx;
        const cy = ball.cy;
        if (isRainbowBall(ball)) {
          ctx.beginPath();
          traceBalloonPath(ctx, pts);
          game.drawRainbowBalloonFill(ctx, ball, cx, cy);
        } else {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.beginPath();
          traceBalloonPath(ctx, pts, cx, cy);
          ctx.fillStyle = this._getBallFillGradient(
            ctx,
            ball.colorLight,
            ball.colorBase,
            ball.radius
          );
          ctx.fill();
          ctx.restore();
        }
        if (!isClownBall(ball) && !isRainbowBall(ball)) {
          ctx.fillStyle = "rgba(255, 255, 255, 0.22)";
          ctx.beginPath();
          ctx.ellipse(
            cx - ball.radius * 0.4,
            cy - ball.radius * 0.4,
            ball.radius * 0.22,
            ball.radius * 0.13,
            -Math.PI / 4,
            0,
            Math.PI * 2
          );
          ctx.fill();
          if (ball.imminentPopDelay != null) {
            game.drawImminentPopBallFx(ball, cx, cy);
          }
          game.drawBallAirLabel(ball, cx, cy);
          game.drawEmbeddedItemIcon?.(ball, cx, cy);
        } else if (isClownBall(ball)) {
          game.drawClownFace(ball, cx, cy);
        } else if (isRainbowBall(ball)) {
          game.drawRainbowLuckyClover(ball, cx, cy);
        }
      }
      game.drawTetrisWalls(ctx);
      for (const fx of game.popEffects) {
        const alpha = Math.max(0, fx.life / fx.maxLife);
        const r = fx.r ?? parseInt(fx.color.slice(1, 3), 16);
        const g = fx.g ?? parseInt(fx.color.slice(3, 5), 16);
        const b = fx.b ?? parseInt(fx.color.slice(5, 7), 16);
        if (fx.kind === "streak") {
          const spd = Math.hypot(fx.vx, fx.vy) || 1;
          const ux = fx.vx / spd;
          const uy = fx.vy / spd;
          const len = (fx.streakLen ?? 14) * (0.35 + alpha);
          ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
          ctx.lineWidth = Math.max(1, fx.size * 0.55);
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(fx.x - ux * len * 0.35, fx.y - uy * len * 0.35);
          ctx.lineTo(fx.x + ux * len, fx.y + uy * len);
          ctx.stroke();
          continue;
        }
        ctx.beginPath();
        ctx.arc(fx.x, fx.y, fx.size * alpha, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
        ctx.fill();
      }
      if (game.activeInflateBall && game.balls.includes(game.activeInflateBall)) {
        const pts = game.activeInflateBall.particles;
        const c = game.polygonCentroid(pts);
        ctx.beginPath();
        ctx.arc(c.x, c.y, game.activeInflateBall.radius * 1.08, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 255, 255, ${0.25 + game.activeInflateBall.inflate * 0.5})`;
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 6]);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      if (game.dragNode) {
        ctx.beginPath();
        ctx.moveTo(game.dragNode.x, game.dragNode.y);
        ctx.lineTo(game.mouse.x, game.mouse.y);
        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgba(255, 255, 255, 0.45)";
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(game.mouse.x, game.mouse.y, 5, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.fill();
      }
      game.drawItems(ctx);
      if (game.gameOutcome !== "won" && game.gameOutcome !== "lost") {
        game.drawPumpDock();
      }
      game.drawItemReveal(ctx);
      game.drawFieldItemHint(ctx);
      game.drawSettlementOverlay();
      game.drawCelebrateEffects();
      game.drawClownPopCinematic();
      game.drawTransitionFade();
    }
    drawCelebrateEffects() {
      const game = this.game;
      const ctx = game.dom.ctx;
      if (game.gameOutcome !== "won" || !game.celebrateEffects.length) return;
      for (const fx of game.celebrateEffects) {
        const t = Math.max(0, fx.life / fx.maxLife);
        const tw = 0.55 + 0.45 * Math.sin(fx.twinkle);
        const alpha = t * tw;
        ctx.beginPath();
        ctx.arc(fx.x, fx.y, fx.size * (0.6 + t * 0.5), 0, Math.PI * 2);
        ctx.fillStyle = fx.color;
        ctx.globalAlpha = alpha;
        ctx.fill();
        if (fx.size > 3) {
          ctx.beginPath();
          ctx.arc(fx.x, fx.y, fx.size * 0.35, 0, Math.PI * 2);
          ctx.fillStyle = "#ffffff";
          ctx.globalAlpha = alpha * 0.85;
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
    }
    drawSettlementOverlay() {
      const game = this.game;
      const ctx = game.dom.ctx;
      if (game.gameOutcome !== "won" && game.gameOutcome !== "lost") {
        game.settlementButtons = { next: null, restart: null };
        return;
      }
      ctx.save();
      ctx.fillStyle = "rgba(8, 8, 18, 0.58)";
      ctx.fillRect(0, 0, width, GROUND_Y);
      const level = game.currentLevelSpec || game.getLevelSpec(game.levelIndex);
      const isWin = game.gameOutcome === "won";
      const hint = game.settlementHintForLevel(game.levelIndex, isWin);
      const hintBlock = isWin ? hint ? 56 : 32 : 16;
      const panelW = Math.min(300, width - 36);
      const panelH = isWin ? 198 + (hint ? 8 : 0) : 156;
      const px = (width - panelW) * 0.5;
      const py = GROUND_Y * 0.4 - panelH * 0.5;
      ctx.fillStyle = "rgba(22, 24, 38, 0.96)";
      game.strokeRoundRect(px, py, panelW, panelH, 14);
      ctx.fill();
      ctx.strokeStyle = isWin ? "rgba(255, 255, 255, 0.22)" : "rgba(255, 120, 120, 0.35)";
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      if (isWin) {
        const titleGrad = ctx.createLinearGradient(width * 0.5 - 90, py, width * 0.5 + 90, py + 40);
        titleGrad.addColorStop(0, "#ffffff");
        titleGrad.addColorStop(0.45, "#fff7ed");
        titleGrad.addColorStop(1, "#fb923c");
        ctx.fillStyle = titleGrad;
        ctx.font = 'bold 22px "ZCOOL KuaiLe", system-ui, sans-serif';
        ctx.fillText("\u606D\u559C\u8FC7\u5173\uFF01", width * 0.5, py + 40);
      } else {
        ctx.fillStyle = "rgba(255, 180, 190, 0.98)";
        ctx.font = 'bold 22px "ZCOOL KuaiLe", system-ui, sans-serif';
        ctx.fillText("\u5931\u8D25", width * 0.5, py + 40);
      }
      ctx.font = '14px "ZCOOL KuaiLe", system-ui, sans-serif';
      ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
      const sub = isWin ? level ? level.title : "" : "\u5DF2\u65E0\u6CD5\u8FC7\u5173\uFF08\u67D0\u8272\u6C14\u7B52\u7528\u5C3D\u6216\u65E0\u6CD5\u518D\u6253\u7206\u4EFB\u4F55\u6C14\u7403\uFF09";
      ctx.fillText(sub, width * 0.5, py + 66);
      const btnH = 38;
      const btnZoneTop = py + 82;
      const btnZoneBottom = py + panelH - hintBlock;
      const by = btnZoneTop + Math.max(0, (btnZoneBottom - btnZoneTop - btnH) * 0.5);
      function drawBtn(x, w, label, primary) {
        if (primary) {
          const grad = ctx.createLinearGradient(x, by, x, by + btnH);
          grad.addColorStop(0, isWin ? "#ff6b9d" : "#6b8cff");
          grad.addColorStop(1, isWin ? "#d91e48" : "#3b5bdb");
          ctx.fillStyle = grad;
        } else {
          ctx.fillStyle = "rgba(255, 255, 255, 0.14)";
        }
        game.strokeRoundRect(x, by, w, btnH, 10);
        ctx.fill();
        ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.fillStyle = "#fff";
        ctx.font = 'bold 15px "ZCOOL KuaiLe", system-ui, sans-serif';
        ctx.textBaseline = "middle";
        ctx.fillText(label, x + w * 0.5, by + btnH * 0.5);
        ctx.textBaseline = "alphabetic";
        return { x, y: by, w, h: btnH };
      }
      game.settlementButtons.next = null;
      if (isWin) {
        const btnW = 118;
        const gap = 14;
        const totalBtnW = btnW * 2 + gap;
        const bx0 = (width - totalBtnW) * 0.5;
        const nextLabel = game.testLevelId ? "\u518D\u8BD5\u4E00\u6B21" : "\u4E0B\u4E00\u5173";
        const restartLabel = game.testLevelId ? "\u91CD\u5F00\u672C\u5173" : "\u91CD\u65B0\u5F00\u59CB";
        game.settlementButtons.restart = drawBtn(bx0, btnW, restartLabel, false);
        game.settlementButtons.next = drawBtn(bx0 + btnW + gap, btnW, nextLabel, true);
      } else {
        const btnW = 168;
        const bx = (width - btnW) * 0.5;
        game.settlementButtons.restart = drawBtn(bx, btnW, "\u91CD\u65B0\u5F00\u59CB", true);
      }
      if (hint) {
        ctx.font = '13px "ZCOOL KuaiLe", system-ui, sans-serif';
        ctx.fillStyle = "rgba(255, 255, 255, 0.68)";
        ctx.textBaseline = "middle";
        const hintY = py + panelH - hintBlock * 0.5 + 4;
        ctx.fillText(hint, width * 0.5, hintY);
        ctx.textBaseline = "alphabetic";
      }
      ctx.restore();
    }
  };

  // js/ui/FieldItemHintController.js
  var FIELD_ITEM_HINT_TEXT = {
    clown: "\u4F1A\u590D\u5236\u5F88\u591A\u6C14\u7403",
    rainbow: "\u53EF\u4EE5\u4E0E\u4EFB\u610F\u989C\u8272\u6C14\u7403\u8FDE\u7206",
    wall: "\u7EAF\u969C\u788D\u7269"
  };
  var PUMP_DOCK_HINT_TEXT = "\u6309\u4F4F\u6CE1\u6CE1\u6491\u7206\u4ED6";
  var LEVEL_ONE_BALLOON_HINT_TEXT = "\u6CE1\u6CE1\u6570\u5B57\u8868\u793A\u8FD8\u9700\u8981\u591A\u5C11\u4F1A\u7206";
  var POP_SEC = 0.16;
  var SETTLE_SEC = 0.14;
  var HOLD_STILL_SEC = 3;
  var FLOAT_FADE_SEC = 1.05;
  var BASE_FONT_PX = 26;
  var PEAK_SCALE = 1.1;
  var START_SCALE = 0.9;
  var FLOAT_PX_PER_SEC = 40;
  var ANCHOR_Y_RATIO = 0.26;
  function hintTotalDuration() {
    return POP_SEC + SETTLE_SEC + HOLD_STILL_SEC + FLOAT_FADE_SEC;
  }
  function hintMoveStartAge() {
    return POP_SEC + SETTLE_SEC + HOLD_STILL_SEC;
  }
  var LEVEL_ONE_INTRO_DELAY_SEC = 3;
  var FieldItemHintController = class {
    constructor(game) {
      this.game = game;
      this.hint = null;
      this.levelOneIntroDelay = null;
    }
    showFieldItemHint(text) {
      if (!text) return;
      this.hint = {
        text,
        age: 0,
        duration: hintTotalDuration()
      };
    }
    _canScheduleLevelOneIntro() {
      const game = this.game;
      return !game.testLevelId && game.levelIndex === 0 && game.appScreen === "game" && game.gameOutcome === "playing";
    }
    cancelLevelOneIntroSchedule() {
      this.levelOneIntroDelay = null;
    }
    /** 主线第 1 关：延迟后自动提示气球数字含义 */
    showLevelOneIntroHintIfNeeded() {
      this.cancelLevelOneIntroSchedule();
      if (!this._canScheduleLevelOneIntro()) return;
      this.levelOneIntroDelay = LEVEL_ONE_INTRO_DELAY_SEC;
    }
    clearFieldItemHint() {
      this.hint = null;
      this.cancelLevelOneIntroSchedule();
    }
    updateFieldItemHint(dt2) {
      if (this.levelOneIntroDelay != null) {
        if (!this._canScheduleLevelOneIntro()) {
          this.cancelLevelOneIntroSchedule();
        } else {
          this.levelOneIntroDelay -= dt2;
          if (this.levelOneIntroDelay <= 0) {
            this.levelOneIntroDelay = null;
            this.showFieldItemHint(LEVEL_ONE_BALLOON_HINT_TEXT);
          }
        }
      }
      if (!this.hint) return;
      this.hint.age += dt2;
      if (this.hint.age >= this.hint.duration) this.hint = null;
    }
    _hintScale(age) {
      if (age <= POP_SEC) {
        const u = age / POP_SEC;
        const ease = 1 - (1 - u) ** 2;
        return START_SCALE + (PEAK_SCALE - START_SCALE) * ease;
      }
      if (age <= POP_SEC + SETTLE_SEC) {
        const settleT = (age - POP_SEC) / SETTLE_SEC;
        const ease = settleT ** 2;
        return PEAK_SCALE + (1 - PEAK_SCALE) * ease;
      }
      return 1;
    }
    _hintAlpha(age) {
      const moveStart = hintMoveStartAge();
      if (age < moveStart) return 1;
      const moveAge = age - moveStart;
      return Math.max(0, 1 - moveAge / FLOAT_FADE_SEC);
    }
    _hintY(baseY, age) {
      const moveStart = hintMoveStartAge();
      if (age < moveStart) return baseY;
      const moveAge = age - moveStart;
      return baseY - moveAge * FLOAT_PX_PER_SEC;
    }
    drawFieldItemHint(ctx) {
      if (!this.hint) return;
      const { text, age } = this.hint;
      const alpha = this._hintAlpha(age);
      if (alpha <= 1e-3) return;
      const x = width * 0.5;
      const baseY = height * ANCHOR_Y_RATIO;
      const y = this._hintY(baseY, age);
      const scale = this._hintScale(age);
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `bold ${BASE_FONT_PX}px "ZCOOL KuaiLe", system-ui, sans-serif`;
      ctx.fillStyle = `rgba(255, 255, 255, ${0.98 * alpha})`;
      ctx.strokeStyle = `rgba(0, 0, 0, ${0.38 * alpha})`;
      ctx.lineWidth = 3;
      ctx.shadowColor = `rgba(0, 0, 0, ${0.5 * alpha})`;
      ctx.shadowBlur = 8;
      ctx.strokeText(text, 0, 0);
      ctx.fillText(text, 0, 0);
      ctx.restore();
    }
  };

  // js/input/InputController.js
  var InputController = class {
    constructor(game) {
      this.game = game;
    }
    screenToLogical(clientX, clientY) {
      const game = this.game;
      const rect = game.dom.canvas.getBoundingClientRect();
      return {
        x: (clientX - rect.left) * (width / rect.width),
        y: (clientY - rect.top) * (height / rect.height)
      };
    }
    pickBalloonAt(x, y) {
      const game = this.game;
      if (game.isInPumpZone(y)) return null;
      for (let i = game.balls.length - 1; i >= 0; i--) {
        const pts = game.balls[i].particles;
        if (game.pointInPolygon(x, y, pts)) return game.balls[i];
        const c = game.polygonCentroid(pts);
        const dist = Math.hypot(x - c.x, y - c.y);
        if (dist < game.balls[i].radius * 1.05) return game.balls[i];
      }
      return null;
    }
    startDrag(clientX, clientY) {
      const game = this.game;
      if (game.appScreen !== "game") return;
      if (game.itemRevealActive || game.itemRevealAnchorHold) return;
      if (game.isGameplayFrozen?.()) return;
      game.sfx.resume();
      const pos = game.screenToLogical(clientX, clientY);
      game.mouse.x = pos.x;
      game.mouse.y = pos.y;
      game.pointerDownPos.x = pos.x;
      game.pointerDownPos.y = pos.y;
      game.pointerDown = true;
      game.dragNode = null;
      game.pendingDragParticle = null;
      if (game.gameOutcome === "transition") return;
      if (game.gameOutcome === "won" || game.gameOutcome === "lost") {
        if (game.gameOutcome === "won" && game.hitSettlementButton(game.settlementButtons.next, game.mouse.x, game.mouse.y)) {
          game.advanceAfterWin();
          return;
        }
        if (game.hitSettlementButton(game.settlementButtons.restart, game.mouse.x, game.mouse.y)) {
          if (game.currentLevelSpec?.testLab && game.lastTestLabParams) {
            game.loadTestLabLevel(game.lastTestLabParams);
          } else {
            game.scheduleLoadLevel(game.levelIndex);
          }
          return;
        }
        return;
      }
      if (game.isInPumpZone(game.mouse.y)) {
        game.showFieldItemHint?.(PUMP_DOCK_HINT_TEXT);
        return;
      }
      const hitBall = game.pickBalloonAt(game.mouse.x, game.mouse.y);
      if (hitBall) {
        if (isRainbowBall(hitBall)) {
          game.showFieldItemHint?.(FIELD_ITEM_HINT_TEXT.rainbow);
          return;
        }
        if (isClownBall(hitBall)) {
          game.showFieldItemHint?.(FIELD_ITEM_HINT_TEXT.clown);
          return;
        }
        const idx = game.selectPumpForBall(hitBall);
        if (idx >= 0 && game.pumpFuelRemaining[idx] > 0) {
          game.beginPlayerDartAction();
          game.activeInflateBall = hitBall;
        } else {
          game.sfx.playDenied();
        }
        return;
      }
      game.activeInflateBall = null;
      if (game.pickTetrisWallAt?.(game.mouse.x, game.mouse.y)) {
        game.showFieldItemHint?.(FIELD_ITEM_HINT_TEXT.wall);
        return;
      }
      let minDist = 42;
      for (const p of game.particles) {
        const dist = Math.hypot(p.x - game.mouse.x, p.y - game.mouse.y);
        if (dist < minDist) {
          minDist = dist;
          game.pendingDragParticle = p;
        }
      }
    }
    moveDrag(clientX, clientY) {
      const game = this.game;
      const pos = game.screenToLogical(clientX, clientY);
      game.mouse.x = pos.x;
      game.mouse.y = pos.y;
      if (!game.pointerDown || game.activeInflateBall || game.dragNode || !game.pendingDragParticle) return;
      const moved = Math.hypot(game.mouse.x - game.pointerDownPos.x, game.mouse.y - game.pointerDownPos.y);
      if (moved >= DRAG_MOVE_THRESHOLD) {
        game.dragNode = game.pendingDragParticle;
        game.pendingDragParticle = null;
      }
    }
    endDrag() {
      const game = this.game;
      game.dragNode = null;
      game.pendingDragParticle = null;
      game.activeInflateBall = null;
      game.pointerDown = false;
    }
    hitSettlementButton(btn, x, y) {
      const game = this.game;
      if (!btn) return false;
      return x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h;
    }
    polygonCentroid(poly) {
      const game = this.game;
      let cx = 0;
      let cy = 0;
      for (let i = 0; i < poly.length; i++) {
        cx += poly[i].x;
        cy += poly[i].y;
      }
      return { x: cx / poly.length, y: cy / poly.length };
    }
    pointInPolygon(px, py, poly) {
      const game = this.game;
      let inside = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const xi = poly[i].x, yi = poly[i].y;
        const xj = poly[j].x, yj = poly[j].y;
        const intersects = yi > py !== yj > py && px < (xj - xi) * (py - yi) / (yj - yi || 1e-8) + xi;
        if (intersects) inside = !inside;
      }
      return inside;
    }
  };

  // js/ui/ProgressStore.js
  var ProgressStore = class {
    constructor(game) {
      this.game = game;
    }
    loadProgress() {
      const game = this.game;
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (data && typeof data.levelIndex === "number" && data.levelIndex >= 0) {
          return data;
        }
      } catch (_) {
      }
      return null;
    }
    saveProgress() {
      const game = this.game;
      if (game.testLevelId) return;
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
          levelIndex: game.levelIndex,
          savedAt: Date.now()
        }));
      } catch (_) {
      }
    }
    clearProgress() {
      const game = this.game;
      try {
        localStorage.removeItem(SAVE_KEY);
      } catch (_) {
      }
    }
  };

  // js/ui/PauseController.js
  var PauseController = class {

    updateStartMenuUI() {

      let top = Infinity;
      let bottom = -Infinity;
      for (let i = 0; i < game.balls.length; i++) {
        const ball = game.balls[i];
        game.syncBallBounds(ball);
        const r = Math.max(ball.boundsRadius, ball.radius) + gap;
        top = Math.min(top, ball.cy - r);
        bottom = Math.max(bottom, ball.cy + r);
      }
      return { top, bottom };
    }
    _overlapsBalls(cells) {
      const game = this.game;
      const gap = this._balloonKeepOutGap();
      for (let i = 0; i < game.balls.length; i++) {
        const ball = game.balls[i];
        game.syncBallBounds(ball);
        const pts = ball.particles;
        for (const cell of cells) {
          for (let p = 0; p < pts.length; p++) {
            if (this._circleRectOverlap(pts[p].x, pts[p].y, gap, cell)) return true;
          }
          const hullR = Math.max(ball.boundsRadius, ball.radius) + gap;
          if (this._circleRectOverlap(ball.cx, ball.cy, hullR, cell)) return true;
        }
      }
      return false;
    }
    _rectsOverlap(a, b, gap = 0) {
      return !(a.x + a.w + gap <= b.x || b.x + b.w + gap <= a.x || a.y + a.h + gap <= b.y || b.y + b.h + gap <= a.y);
    }
    _circleRectOverlap(cx, cy, r, rect) {
      const closestX = clamp(cx, rect.x, rect.x + rect.w);
      const closestY = clamp(cy, rect.y, rect.y + rect.h);
      const dx = cx - closestX;
      const dy = cy - closestY;
      return dx * dx + dy * dy < r * r;
    }
    resolveParticleVsTetrisWalls(particle, slop = 2.2) {
      const game = this.game;
      if (!game.tetrisWalls?.length) return;
      for (let w = 0; w < game.tetrisWalls.length; w++) {
        for (const cell of game.tetrisWalls[w].cells) {
          this._pushParticleOutOfRect(particle, cell.x, cell.y, cell.x + cell.w, cell.y + cell.h, slop);
        }
      }
    }
    _pushParticleOutOfRect(p, minX, minY, maxX, maxY, slop) {
      const closestX = clamp(p.x, minX, maxX);
      const closestY = clamp(p.y, minY, maxY);
      let dx = p.x - closestX;
      let dy = p.y - closestY;
      const distSq = dx * dx + dy * dy;
      if (distSq < 1e-10) {
        const penL = p.x - minX;
        const penR = maxX - p.x;
        const penT = p.y - minY;
        const penB = maxY - p.y;
        const minPen = Math.min(penL, penR, penT, penB);
        if (minPen === penL) p.x -= slop - minPen;
        else if (minPen === penR) p.x += slop - minPen;
        else if (minPen === penT) p.y -= slop - minPen;
        else p.y += slop - minPen;
        return;
      }
      if (distSq >= slop * slop) return;
      const dist = Math.sqrt(distSq);
      const pen = slop - dist;
      p.x += dx / dist * pen;
      p.y += dy / dist * pen;
    }
    solveTetrisWallCollisions() {
      const game = this.game;
      if (!game.tetrisWalls?.length) return;
      const slop = 2.2;
      for (let b = 0; b < game.balls.length; b++) {
        const pts = game.balls[b].particles;
        for (let i = 0; i < pts.length; i++) {
          if (pts[i] === game.dragNode) continue;
          if (game.particleInSpawnGrowBall?.(pts[i])) continue;
          game.resolveParticleVsTetrisWalls(pts[i], slop);
        }
      }
    }
    _outlineBBox(outline) {
      let minX = Infinity;
      let minY = Infinity;
      let maxX = -Infinity;
      let maxY = -Infinity;
      for (let i = 0; i < outline.length; i++) {
        const x = outline[i][0];
        const y = outline[i][1];
        if (x < minX) minX = x;
        if (y < minY) minY = y;
        if (x > maxX) maxX = x;
        if (y > maxY) maxY = y;
      }
      return { minX, minY, maxX, maxY };
    }
    _traceWallPath(ctx, outline) {
      if (!outline?.length) return false;
      ctx.beginPath();
      return pathFromRoundedOutline(ctx, outline, TETRIS_OUTLINE_CORNER_RADIUS);
    }
    drawTetrisWalls(ctx) {
      const game = this.game;
      if (!game.tetrisWalls?.length) return;
      const { base, light, edge } = TETRIS_WALL_COLORS;
      for (const wall of game.tetrisWalls) {
        const outline = wall.outline;
        if (!this._traceWallPath(ctx, outline)) continue;
        const box = this._outlineBBox(outline);
        const g = ctx.createLinearGradient(box.minX, box.minY, box.maxX, box.maxY);
        g.addColorStop(0, light);
        g.addColorStop(0.42, base);
        g.addColorStop(1, edge);
        ctx.fillStyle = g;
        ctx.fill();
        ctx.strokeStyle = "rgba(20, 22, 28, 0.62)";
        ctx.lineWidth = 1.5;
        ctx.lineJoin = "round";
        ctx.stroke();
        const shineW = Math.max(8, (box.maxX - box.minX) * 0.38);
        ctx.save();
        ctx.clip();
        ctx.fillStyle = "rgba(255, 255, 255, 0.14)";
        ctx.fillRect(box.minX + 3, box.minY + 3, shineW, 2.5);
        ctx.restore();
      }
    }
  };

  // js/BalloonGameApp.js
  var BalloonGameApp = class {
    constructor(dom2, opts = {}) {
      this.dom = dom2;
      this._startLevelOverride = opts.startLevel;
      this.testLevelId = opts.testLevelId ?? null;
      this.baselineReferenceCount = 0;
      this.baselineLevelOneCount = 0;
      this.currentLevelSpec = null;
      this.levelSpawnRng = null;
      this.levelIndex = 0;
      this.appScreen = "start";
      this.gameOutcome = "playing";
      this.loseCountdown = null;
      this.winRevealCountdown = null;
      this.levelTransitionCountdown = null;
      this.pendingLoadLevelIndex = 0;
      this.transitionFade = 0;
      this.levelTransitionDidLoad = false;
      this.settlementButtons = { next: null, restart: null };
      this.activeTeams = TUTORIAL_LEVELS[0].activeTeams.slice();
      this.selectedPumpIndex = 0;
      this.pumpFuelRemaining = [];
      this.pumpFuelLabelScale = [];
      this.pumpHitRects = [];
      this.particles = [];
      this.constraints = [];
      this.balls = [];
      this.popEffects = [];
      this.celebrateEffects = [];
      this.winCelebrateSpawned = false;
      this.chainPopQueue = [];
      this.chainPopVisited = null;
      this.chainPopAccum = 0;
      this.chainComboCount = 0;
      this.comboHideTimer = 0;
      this.inflatePumpActive = false;
      this.outcomeSoundPlayed = null;
      this.collisionOrderFlip = false;
      this.collisionPhase = 0;
      this.constraintOrderFlip = false;
      this.simTime = 0;
      this._lastFrameMs = null;
      this._simAccum = 0;
      this.dragNode = null;
      this.pendingDragParticle = null;
      this.activeInflateBall = null;
      this.pointerDown = false;
      this.pointerDownPos = { x: 0, y: 0 };
      this.mouse = { x: 0, y: 0 };
      this.itemPickups = [];
      this.ninjaDarts = [];
      this.itemRevealActive = false;
      this.itemRevealAnchorHold = false;
      this.lastTestLabParams = null;
      this.clownCinematic = null;
      this.clownBurstSpawn = null;
      this.tetrisWalls = [];
      this.sfxEngine = createSfxSystem(() => this.simTime);
      this.sfx = this.sfxEngine;
      this.levelService = new LevelService(this);
      this.balloonService = new BalloonService(this);
      this.pumpService = new PumpService(this);
      this.physicsEngine = new PhysicsEngine(this);
      this.gameFlow = new GameFlowService(this);
      this.renderer = new Renderer(this);
      this.input = new InputController(this);
      this.progress = new ProgressStore(this);
      this.pause = new PauseController(this);
      this.items = new ItemService(this);
      this.itemPickups = this.items.itemPickups;
      this.ninjaDarts = this.items.ninjaDarts;
      this.clownCinematicService = new ClownPopCinematicService(this);
      this.tetrisWallService = new TetrisWallService(this);
      this.fieldItemHints = new FieldItemHintController(this);
      this._wireSubsystemMethods();
      this._initBackgroundCanvas();
      this._bindEvents();
      if (this.testLevelId) {
        this.bootstrapTestLevel(this.testLevelId);
      } else if (this._startLevelOverride != null) {
        this.bootstrapGame(this._startLevelOverride);
      } else {
        this.showStartScreen();
      }
      this.pumpService.layoutPumpHitRects();
    }
    /** 将各子系统 public 方法扁平挂载到 game，保持与原单文件函数互调一致 */
    _wireSubsystemMethods() {
      const services = [
        this.levelService,
        this.balloonService,
        this.pumpService,
        this.physicsEngine,
        this.gameFlow,
        this.renderer,
        this.input,
        this.progress,
        this.pause,
        this.items,
        this.clownCinematicService,
        this.tetrisWallService,
        this.fieldItemHints
      ];
      for (const svc of services) {
        const proto = Object.getPrototypeOf(svc);
        for (const name of Object.getOwnPropertyNames(proto)) {
          if (name === "constructor" || typeof svc[name] !== "function") continue;
          this[name] = svc[name].bind(svc);
        }
      }
    }
    _initBackgroundCanvas() {
      this.bgCanvas = document.createElement("canvas");
      this.bgCanvas.width = width;
      this.bgCanvas.height = height;
      this.bgCtx = this.bgCanvas.getContext("2d");
      const g = this.bgCtx.createLinearGradient(0, 0, 0, height);
      g.addColorStop(0, "#2a1f4e");
      g.addColorStop(0.45, "#1a1a2e");
      g.addColorStop(1, "#12121f");
      this.bgCtx.fillStyle = g;
      this.bgCtx.fillRect(0, 0, width, height);
      this.bgCtx.fillStyle = "rgba(255, 255, 255, 0.03)";
      for (let i = 0; i < 24; i++) {
        const sx = i * 97 % width;
        const sy = i * 131 % height;
        this.bgCtx.beginPath();
        this.bgCtx.arc(sx, sy, 1.2, 0, Math.PI * 2);
        this.bgCtx.fill();
      }
    }
    _bindEvents() {
      const { dom: dom2 } = this;
      if (dom2.btnStartPrimary) {
        dom2.btnStartPrimary.addEventListener("click", () => {
          if (this.appScreen === "start") {
            const save = this.loadProgress();
            this.enterGame(save ? save.levelIndex : 0);
            return;
          }
          if (this.appScreen === "pause") this.resumeGame();
        });
      }
      if (dom2.btnStartRestart) {
        dom2.btnStartRestart.addEventListener("click", () => {
          if (this.appScreen === "start") {
            this.clearProgress();
            this.updateStartMenuUI();
            this.enterGame(0);
            return;
          }
          this.restartFromPause();
        });
      }
      if (dom2.stageEl) {
        dom2.stageEl.addEventListener("pointerdown", () => {
          if (this.appScreen === "game") this.sfx.resume();
        }, { passive: true });
      }
      window.addEventListener("keydown", () => {
        if (this.appScreen === "game") this.sfx.resume();
      });
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          this.togglePause();
          return;
        }
        if (this.appScreen !== "game") return;
        if (e.key === "r" || e.key === "R") {
          if (this.gameOutcome === "transition") return;
          this.scheduleLoadLevel(this.levelIndex);
        }
      });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          if (this.appScreen === "game" && this.gameOutcome === "playing") {
            this.showPauseScreen();
          }
        }
      });
      dom2.canvas.addEventListener("mousedown", (e) => this.startDrag(e.clientX, e.clientY));
      window.addEventListener("mousemove", (e) => this.moveDrag(e.clientX, e.clientY));
      window.addEventListener("mouseup", () => this.endDrag());
      dom2.canvas.addEventListener("touchstart", (e) => {
        e.preventDefault();
        this.startDrag(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: false });
      window.addEventListener("touchmove", (e) => {
        if (e.touches.length) this.moveDrag(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: false });
      window.addEventListener("touchend", () => this.endDrag());
    }
    _tickSimulationStep() {
      const stepDt = dt;
      this.simTime += stepDt;
      this.updateClownPopCinematic();
      this.updateClownBurstSpawn();
      this.updateBalloonSpawnGrows();
      this.updateItems(stepDt);
      this.updateFieldItemHint(stepDt);
      const anchorHold = this.itemRevealAnchorHold;
      const clownFrozen = typeof this.isGameplayFrozen === "function" && this.isGameplayFrozen();
      if (!this.itemRevealActive && !anchorHold && !clownFrozen) {
        this.updateInflation();
        const pumpInflate = this.activeInflateBall && this.balls.includes(this.activeInflateBall) ? this.activeInflateBall.inflate : 0;
        this.sfx.updatePump(pumpInflate, stepDt, this.inflatePumpActive);
        this.updateLevelTransition();
      }
      if (!anchorHold && !clownFrozen) {
        this.updateBallLabelAnims();
        this.updatePumpFuelLabelAnims();
        this.updateComboHud();
        this.updateImminentPops();
        this.processChainPops();
        this.updatePhysics();
        this.checkLevelLose();
        this.updateLoseCountdown();
        this.updateWinRevealCountdown();
        this.updatePopEffects();
      }
      this.updateCelebrateEffects();
    }
    loop() {
      const now = performance.now();
      if (this._lastFrameMs == null) this._lastFrameMs = now;
      let frameDt = (now - this._lastFrameMs) / 1e3;
      this._lastFrameMs = now;
      frameDt = Math.min(SIM_MAX_FRAME_DT, Math.max(0, frameDt));
      if (this.appScreen === "game") {
        this._simAccum += frameDt;
        const stepReal = 1 / SIM_STEPS_PER_SECOND;
        let steps = 0;
        while (this._simAccum >= stepReal && steps < SIM_MAX_STEPS_PER_FRAME) {
          this._simAccum -= stepReal;
          this._tickSimulationStep();
          steps += 1;
        }
        if (this._simAccum > stepReal * 4) this._simAccum = stepReal * 4;
      }
      this.draw();
      requestAnimationFrame(() => this.loop());
    }
    start() {
      this._lastFrameMs = performance.now();
      this._simAccum = 0;
      this.loop();
    }
  };

  // js/main.release.js
  function resolveLaunchOptions() {
    const params = new URLSearchParams(window.location.search);
    const level = params.get("level");
    if (level == null) return {};
    const n = Number.parseInt(level, 10);
    if (!Number.isFinite(n)) return {};
    if (n >= 1) return { startLevel: n - 1 };
    if (n === 0) return { startLevel: 0 };
    return {};
  }
  var canvas = document.getElementById("physicsCanvas");
  var versionTagEl = document.getElementById("versionTag");
  if (!canvas) {
    throw new Error("\u7F3A\u5C11 #physicsCanvas\uFF0C\u8BF7\u901A\u8FC7 HTTP \u6253\u5F00\u6E38\u620F\u9875\u9762");
  }
  canvas.width = LOGICAL_WIDTH;
  canvas.height = LOGICAL_HEIGHT;
  if (versionTagEl) versionTagEl.textContent = `v${APP_VERSION}`;
  var dom = {
    canvas,
    ctx: canvas.getContext("2d"),
    ballCountEl: document.getElementById("ballCount"),
    levelHudEl: document.getElementById("levelHud"),
    comboHudEl: document.getElementById("comboHud"),
    comboValueEl: document.getElementById("comboValue"),
    versionTagEl,
    startScreenEl: document.getElementById("startScreen"),
    btnStartPrimary: document.getElementById("btnStartPrimary"),
    btnStartRestart: document.getElementById("btnStartRestart"),
    stageEl: document.getElementById("stage"),
    btnOpenTestLab: null,
    btnRestartNormalGame: null
  };
  var app = new BalloonGameApp(dom, resolveLaunchOptions());
  app.start();
})();

</script>
