<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2D 软体瑜伽球物理模拟</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a2e; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <!-- 渲染画布 -->
    <canvas id="physicsCanvas"></canvas>

<script>
    // ==========================================
    // 物理引擎核心参数
    // ==========================================
    const canvas = document.getElementById('physicsCanvas');
    const ctx = canvas.getContext('2d');
    
    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    window.addEventListener('resize', () => {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    });

    const gravity = { x: 0, y: 1500 }; // 重力加速度
    const numSubsteps = 10;            // 小步长迭代次数（保证高稳定性）
    const pbdIterations = 2;           // PBD 约束求解迭代次数
    let dt = 1 / 60;                   // 基础时间步长

    const particles = [];
    const constraints = [];
    const balls = [];
    let collisionOrderFlip = false;
    let collisionPhase = 0;
    let constraintOrderFlip = false;

    // ==========================================
    // 基础物理类定义
    // ==========================================

    // 质点类
    class Particle {
        constructor(x, y, mass) {
            this.x = x;
            this.y = y;
            this.px = x; // 上一帧的X位置 (预测位置)
            this.py = y; // 上一帧的Y位置
            this.vx = 0;
            this.vy = 0;
            this.mass = mass;
            this.invMass = mass > 0 ? 1 / mass : 0;
        }
    }

    // 距离约束 (维持球的表面张力和防折叠)
    class DistanceConstraint {
        constructor(p1, p2, stiffness = 1.0) {
            this.p1 = p1;
            this.p2 = p2;
            const dx = p1.x - p2.x;
            const dy = p1.y - p2.y;
            this.restLength = Math.hypot(dx, dy);
            this.stiffness = stiffness;
        }

        solve() {
            const dx = this.p1.x - this.p2.x;
            const dy = this.p1.y - this.p2.y;
            const d = Math.hypot(dx, dy);
            if (d === 0) return;

            const diff = (d - this.restLength) / d;
            const w1 = this.p1.invMass;
            const w2 = this.p2.invMass;
            const w = w1 + w2;
            if (w === 0) return;

            const corrX = dx * diff * this.stiffness / w;
            const corrY = dy * diff * this.stiffness / w;

            this.p1.x -= corrX * w1;
            this.p1.y -= corrY * w1;
            this.p2.x += corrX * w2;
            this.p2.y += corrY * w2;
        }
    }

    // 面积/体积约束 (核心：让球像充气瑜伽球一样保持内部气压)
    class AreaConstraint {
        constructor(particles, stiffness = 1.0) {
            this.particles = particles;
            this.stiffness = stiffness;
            this.restArea = this.calculateArea();
        }

        calculateArea() {
            let area = 0;
            const N = this.particles.length;
            for (let i = 0; i < N; i++) {
                const p = this.particles[i];
                const pNext = this.particles[(i + 1) % N];
                area += (p.x * pNext.y - pNext.x * p.y);
            }
            return 0.5 * area;
        }

        solve() {
            const N = this.particles.length;
            const currentArea = this.calculateArea();
            const deltaArea = currentArea - this.restArea;
            
            let sumWGrad2 = 0;
            const gradients = new Array(N);

            for (let i = 0; i < N; i++) {
                const pNext = this.particles[(i + 1) % N];
                const pPrev = this.particles[(i - 1 + N) % N];

                // 面积对当前顶点的梯度
                gradients[i] = {
                    x: 0.5 * (pNext.y - pPrev.y),
                    y: 0.5 * (pPrev.x - pNext.x)
                };

                const w = this.particles[i].invMass;
                sumWGrad2 += w * (gradients[i].x ** 2 + gradients[i].y ** 2);
            }

            if (sumWGrad2 < 0.00001) return;

            // PBD 乘子
            const lambda = -deltaArea / sumWGrad2 * this.stiffness;

            // 应用位置校正
            for (let i = 0; i < N; i++) {
                const p = this.particles[i];
                const w = p.invMass;
                p.x += lambda * w * gradients[i].x;
                p.y += lambda * w * gradients[i].y;
            }
        }
    }

    // ==========================================
    // 实体生成逻辑
    // ==========================================
    
    function createSoftBall(cx, cy, radius, colorBase, colorLight) {
        const N = 40; // 边缘质点数量
        const ballParticles = [];

        // 1. 生成边缘质点
        for (let i = 0; i < N; i++) {
            const angle = (i / N) * Math.PI * 2;
            const px = cx + Math.cos(angle) * radius;
            const py = cy + Math.sin(angle) * radius;
            const p = new Particle(px, py, 1.0);
            ballParticles.push(p);
            particles.push(p);
        }

        // 2. 添加距离约束（边缘弹簧和抗弯折弹簧）
        for (let i = 0; i < N; i++) {
            // 相邻点连接 (维持周长)
            constraints.push(new DistanceConstraint(ballParticles[i], ballParticles[(i + 1) % N], 1.0));
            // 隔一个点连接 (防止表面出现锐角折叠)
            constraints.push(new DistanceConstraint(ballParticles[i], ballParticles[(i + 2) % N], 0.8));
        }

        // 3. 添加面积约束（气压）
        constraints.push(new AreaConstraint(ballParticles, 1.0));

        // 保存小球数据用于渲染和碰撞检测
        balls.push({
            particles: ballParticles,
            radius: radius,
            colorBase: colorBase,
            colorLight: colorLight
        });
    }

    // 初始化两个瑜伽球
    createSoftBall(width * 0.3, height * 0.3, 80, '#ff0055', '#ff6699');
    createSoftBall(width * 0.7, height * 0.3, 80, '#00f3ff', '#99faff');

    // ==========================================
    // 交互逻辑 (鼠标/触摸拖拽)
    // ==========================================
    let dragNode = null;
    let mouse = { x: 0, y: 0 };

    function startDrag(clientX, clientY) {
        mouse.x = clientX;
        mouse.y = clientY;
        let minDist = 60; // 抓取判定范围
        dragNode = null;

        for (let p of particles) {
            const dist = Math.hypot(p.x - mouse.x, p.y - mouse.y);
            if (dist < minDist) {
                minDist = dist;
                dragNode = p;
            }
        }
    }

    function moveDrag(clientX, clientY) {
        mouse.x = clientX;
        mouse.y = clientY;
    }

    function endDrag() {
        dragNode = null;
    }

    // 绑定事件
    canvas.addEventListener('mousedown', e => startDrag(e.clientX, e.clientY));
    window.addEventListener('mousemove', e => moveDrag(e.clientX, e.clientY));
    window.addEventListener('mouseup', endDrag);

    canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        startDrag(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });
    window.addEventListener('touchmove', e => {
        moveDrag(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });
    window.addEventListener('touchend', endDrag);

    // ==========================================
    // 物理模拟核心循环
    // ==========================================

    function polygonCentroid(poly) {
        let cx = 0;
        let cy = 0;
        for (let i = 0; i < poly.length; i++) {
            cx += poly[i].x;
            cy += poly[i].y;
        }
        return { x: cx / poly.length, y: cy / poly.length };
    }

    function pointInPolygon(px, py, poly) {
        let inside = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
            const xi = poly[i].x, yi = poly[i].y;
            const xj = poly[j].x, yj = poly[j].y;
            const intersects = ((yi > py) !== (yj > py)) &&
                (px < (xj - xi) * (py - yi) / ((yj - yi) || 1e-8) + xi);
            if (intersects) inside = !inside;
        }
        return inside;
    }

    function closestPointOnSegment(px, py, ax, ay, bx, by) {
        const abx = bx - ax;
        const aby = by - ay;
        const abLenSq = abx * abx + aby * aby;
        if (abLenSq < 1e-8) {
            return { x: ax, y: ay, t: 0 };
        }
        let t = ((px - ax) * abx + (py - ay) * aby) / abLenSq;
        t = Math.max(0, Math.min(1, t));
        return {
            x: ax + abx * t,
            y: ay + aby * t,
            t
        };
    }

    function getOutwardNormal(ax, ay, bx, by, centroid) {
        const ex = bx - ax;
        const ey = by - ay;
        let nx = -ey;
        let ny = ex;
        const mx = (ax + bx) * 0.5;
        const my = (ay + by) * 0.5;
        const toOutsideX = mx - centroid.x;
        const toOutsideY = my - centroid.y;
        if (nx * toOutsideX + ny * toOutsideY < 0) {
            nx = -nx;
            ny = -ny;
        }
        const len = Math.hypot(nx, ny) || 1;
        return { x: nx / len, y: ny / len };
    }

    function projectPointVsPolygon(point, poly, centroid, contactSlop) {
        let best = null;
        let bestDistSq = Infinity;

        for (let i = 0; i < poly.length; i++) {
            const j = (i + 1) % poly.length;
            const a = poly[i];
            const b = poly[j];
            const cp = closestPointOnSegment(point.x, point.y, a.x, a.y, b.x, b.y);
            const dx = point.x - cp.x;
            const dy = point.y - cp.y;
            const distSq = dx * dx + dy * dy;
            if (distSq < bestDistSq) {
                bestDistSq = distSq;
                best = { i, j, cp };
            }
        }

        if (!best) return;

        const a = poly[best.i];
        const b = poly[best.j];
        const normal = getOutwardNormal(a.x, a.y, b.x, b.y, centroid);
        const signedDist = (point.x - best.cp.x) * normal.x + (point.y - best.cp.y) * normal.y;
        const inside = pointInPolygon(point.x, point.y, poly);
        const penetration = inside ? (contactSlop - signedDist) : Math.max(0, contactSlop - signedDist);

        if (penetration <= 0) return;

        const wp = point.invMass;
        const wa = a.invMass;
        const wb = b.invMass;
        const t = best.cp.t;
        const wA = wa * (1 - t);
        const wB = wb * t;
        const wSum = wp + wA + wB;
        if (wSum < 1e-8) return;

        const corrX = normal.x * penetration;
        const corrY = normal.y * penetration;

        point.x += corrX * (wp / wSum);
        point.y += corrY * (wp / wSum);

        a.x -= corrX * (wA / wSum);
        a.y -= corrY * (wA / wSum);
        b.x -= corrX * (wB / wSum);
        b.y -= corrY * (wB / wSum);
    }

    function solveBallCollisions() {
        if (balls.length < 2) return;

        const b1 = balls[0].particles;
        const b2 = balls[1].particles;

        // 接触壳层：越小表示越接近真实“贴边才受力”。
        const contactSlop = 2.0;

        const c1 = polygonCentroid(b1);
        const c2 = polygonCentroid(b2);
        const offset1 = collisionPhase % b1.length;
        const offset2 = collisionPhase % b2.length;

        // 交替求解顺序，减少固定顺序带来的单方向偏置。
        if (!collisionOrderFlip) {
            for (let i = 0; i < b1.length; i++) {
                const idx = (offset1 + i) % b1.length;
                projectPointVsPolygon(b1[idx], b2, c2, contactSlop);
            }
            for (let i = 0; i < b2.length; i++) {
                const idx = (offset2 + i) % b2.length;
                projectPointVsPolygon(b2[idx], b1, c1, contactSlop);
            }
        } else {
            for (let i = 0; i < b2.length; i++) {
                const idx = (offset2 + i) % b2.length;
                projectPointVsPolygon(b2[idx], b1, c1, contactSlop);
            }
            for (let i = 0; i < b1.length; i++) {
                const idx = (offset1 + i) % b1.length;
                projectPointVsPolygon(b1[idx], b2, c2, contactSlop);
            }
        }
        collisionOrderFlip = !collisionOrderFlip;
        collisionPhase++;
    }

    function updatePhysics() {
        const subdt = dt / numSubsteps;

        for (let step = 0; step < numSubsteps; step++) {
            // 1. 施加外力并预测位置
            for (let p of particles) {
                if (p === dragNode) continue; 
                
                p.vy += gravity.y * subdt;
                p.vx += gravity.x * subdt;
                
                p.px = p.x;
                p.py = p.y;
                
                p.x += p.vx * subdt;
                p.y += p.vy * subdt;
            }

            // 拖拽控制点作为运动学(Kinematic)粒子
            if (dragNode) {
                dragNode.x = mouse.x;
                dragNode.y = mouse.y;
                dragNode.px = mouse.x;
                dragNode.py = mouse.y;
            }

            // 2. PBD 约束求解
            for (let iter = 0; iter < pbdIterations; iter++) {
                // 内部弹簧与面积约束
                if (!constraintOrderFlip) {
                    for (let i = 0; i < constraints.length; i++) {
                        constraints[i].solve();
                    }
                } else {
                    for (let i = constraints.length - 1; i >= 0; i--) {
                        constraints[i].solve();
                    }
                }
                constraintOrderFlip = !constraintOrderFlip;

                // 球体间互相挤压
                solveBallCollisions();

                // 边界碰撞
                for (let p of particles) {
                    const padding = 5; // 边缘厚度缓冲
                    if (p.y > height - padding) p.y = height - padding;
                    if (p.y < padding) p.y = padding;
                    if (p.x > width - padding) p.x = width - padding;
                    if (p.x < padding) p.x = padding;
                }
            }

            // 3. 更新速度 (带摩擦与反弹)
            for (let p of particles) {
                if (p === dragNode) {
                    p.vx = 0; p.vy = 0;
                    continue;
                }

                p.vx = (p.x - p.px) / subdt;
                p.vy = (p.y - p.py) / subdt;

                // 地面摩擦与微弱弹力
                if (p.y >= height - 5.01 && p.vy > 0) {
                    p.vy = -p.vy * 0.1;
                    p.vx *= 0.8; // 水平摩擦
                }
                // 墙壁摩擦
                if ((p.x <= 5.01 || p.x >= width - 5.01)) {
                    p.vx = -p.vx * 0.1;
                    p.vy *= 0.8;
                }

                // 全局空气阻力
                p.vx *= 0.999;
                p.vy *= 0.999;
            }

            // 4. 每个球独立抑制静止态微漂移（仅在低速时启用）
            const driftBlend = 0.02;
            const driftSpeedThreshold = 40;
            const driftMeanVxThreshold = 8;
            for (let b = 0; b < balls.length; b++) {
                const pts = balls[b].particles;
                let hasDragNode = false;
                for (let i = 0; i < pts.length; i++) {
                    if (pts[i] === dragNode) {
                        hasDragNode = true;
                        break;
                    }
                }
                if (hasDragNode) continue;

                let sumVx = 0;
                let sumVy = 0;
                for (let i = 0; i < pts.length; i++) {
                    sumVx += pts[i].vx;
                    sumVy += pts[i].vy;
                }
                const meanVx = sumVx / pts.length;
                const meanVy = sumVy / pts.length;
                const meanSpeed = Math.hypot(meanVx, meanVy);

                if (meanSpeed > driftSpeedThreshold || Math.abs(meanVx) > driftMeanVxThreshold) {
                    continue;
                }

                for (let i = 0; i < pts.length; i++) {
                    pts[i].vx -= meanVx * driftBlend;
                }
            }

        }
    }

    // ==========================================
    // 渲染循环
    // ==========================================
    
    function draw() {
        ctx.clearRect(0, 0, width, height);

        for (let ball of balls) {
            const pts = ball.particles;
            if (pts.length === 0) continue;

            // 计算近似几何中心，用于渐变和高光
            let cx = 0, cy = 0;
            for (let p of pts) {
                cx += p.x;
                cy += p.y;
            }
            cx /= pts.length;
            cy /= pts.length;

            // 绘制软体多边形
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length; i++) {
                // 使用贝塞尔曲线使边缘更平滑 (简化为直接连线由于点足够密)
                ctx.lineTo(pts[i].x, pts[i].y);
            }
            ctx.closePath();

            // 材质：径向渐变模拟3D瑜伽球光泽
            const grad = ctx.createRadialGradient(
                cx - ball.radius * 0.3, cy - ball.radius * 0.3, ball.radius * 0.1, 
                cx, cy, ball.radius * 1.1
            );
            grad.addColorStop(0, ball.colorLight);
            grad.addColorStop(1, ball.colorBase);

            ctx.fillStyle = grad;
            ctx.fill();

            // 边缘描边增强质感
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.stroke();

            // 高光反射点 (纯视觉效果)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.beginPath();
            ctx.ellipse(cx - ball.radius * 0.4, cy - ball.radius * 0.4, ball.radius * 0.25, ball.radius * 0.15, -Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
        }

        // 绘制鼠标拖拽的连接线提示
        if (dragNode) {
            ctx.beginPath();
            ctx.moveTo(dragNode.x, dragNode.y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
        }
    }

    function loop() {
        updatePhysics();
        draw();
        requestAnimationFrame(loop);
    }

    // 启动循环
    loop();

</script>
</body>
</html>
